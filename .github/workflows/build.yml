name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proj/app/src/main/java/com/benim/tiklayici
          mkdir -p proj/app/src/main/res/xml proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Tiklayici"
          include ':app'
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.benim.tiklayici'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.benim.tiklayici'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tiklayici</string>
              <string name="aciklama">Oyun icin oto tiklayici</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/aciklama" />
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/MainActivity.kt <<'EOF'
          package com.benim.tiklayici

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  layout.addView(TextView(this).apply {
                      text = "1) Erişilebilirlik ayarlarını aç\n2) Tiklayici servisini etkinleştir\n3) Oyunu aç; ekrandaki panelden ☰ ile hangi tuşların aktif olacağını seç, ▶ ile başlat"
                      textSize = 18f
                  })
                  layout.addView(Button(this).apply {
                      text = "Erişilebilirlik Ayarları"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })
                  setContentView(layout)
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/ClickService.kt <<'EOF'
          package com.benim.tiklayici

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.TextView

          class ClickService : AccessibilityService() {

              private class Act(val name: String, val x: Float, val y: Float, val def: Boolean)

              // Konumlar ekran görüntüsünden oran olarak alındı (x, y)
              private val acts = listOf(
                  Act("Hedef seç", 0.953f, 0.580f, true),
                  Act("Saldırı", 0.862f, 0.693f, true),
                  Act("Beceri I", 0.727f, 0.560f, true),
                  Act("Beceri II", 0.715f, 0.648f, true),
                  Act("Beceri III", 0.715f, 0.741f, false),
                  Act("Beceri IV", 0.727f, 0.826f, false),
                  Act("Eşya topla", 0.953f, 0.811f, true),
                  Act("Kırmızı iksir", 0.915f, 0.479f, false),
                  Act("Mavi iksir", 0.862f, 0.460f, false)
              )

              private val speeds = listOf("Yavaş" to (800..1200), "Normal" to (400..700), "Hızlı" to (200..350))

              private val handler = Handler(Looper.getMainLooper())
              private val enabled = BooleanArray(acts.size)
              var running = false
              private var i = 0
              private var speedIdx = 1
              private var wm: WindowManager? = null
              private var panel: View? = null
              private var startBtn: Button? = null

              private fun tap(a: Act) {
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm?.defaultDisplay?.getRealMetrics(m)
                  val path = Path().apply { moveTo(a.x * m.widthPixels, a.y * m.heightPixels) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  dispatchGesture(g, null, null)
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val on = acts.indices.filter { enabled[it] }
                      if (on.isNotEmpty()) tap(acts[on[i++ % on.size]])
                      handler.postDelayed(this, speeds[speedIdx].second.random().toLong())
                  }
              }

              fun toggle() {
                  running = !running
                  startBtn?.text = if (running) "■" else "▶"
                  if (running) handler.post(loop)
              }

              override fun onServiceConnected() {
                  val prefs = getSharedPreferences("ayar", MODE_PRIVATE)
                  for (k in acts.indices) enabled[k] = prefs.getBoolean("a$k", acts[k].def)
                  speedIdx = prefs.getInt("hiz", 1)

                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xCC202020.toInt())
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val handle = TextView(this).apply {
                      text = "✥"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      setPadding(dp(6), 0, dp(10), 0)
                  }
                  val sBtn = Button(this).apply { text = "▶" }
                  startBtn = sBtn
                  sBtn.setOnClickListener { toggle() }
                  val menuBtn = Button(this).apply { text = "☰" }

                  header.addView(handle)
                  header.addView(sBtn, LinearLayout.LayoutParams(dp(56), dp(48)))
                  header.addView(menuBtn, LinearLayout.LayoutParams(dp(56), dp(48)))
                  box.addView(header)

                  val list = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }
                  for (k in acts.indices) {
                      list.addView(CheckBox(this).apply {
                          text = acts[k].name
                          setTextColor(Color.WHITE)
                          isChecked = enabled[k]
                          setOnCheckedChangeListener { _, c ->
                              enabled[k] = c
                              prefs.edit().putBoolean("a$k", c).apply()
                          }
                      })
                  }
                  val speedBtn = Button(this).apply { text = "Hız: " + speeds[speedIdx].first }
                  speedBtn.setOnClickListener {
                      speedIdx = (speedIdx + 1) % speeds.size
                      speedBtn.text = "Hız: " + speeds[speedIdx].first
                      prefs.edit().putInt("hiz", speedIdx).apply()
                  }
                  list.addView(speedBtn)
                  box.addView(list)

                  menuBtn.setOnClickListener {
                      list.visibility = if (list.visibility == View.GONE) View.VISIBLE else View.GONE
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(60)
                      y = dp(80)
                  }

                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  handle.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          lp.x = ox + (e.rawX - sx).toInt()
                          lp.y = oy + (e.rawY - sy).toInt()
                          w.updateViewLayout(box, lp)
                      }
                      true
                  }

                  w.addView(box, lp)
                  panel = box
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  running = false
                  startBtn?.text = "▶"
              }

              override fun onDestroy() {
                  running = false
                  panel?.let { wm?.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
