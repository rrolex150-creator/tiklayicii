              // ---------------- yardımcılar ----------------

              private fun decodeTpl(b64: String): IntArray {
                  val bytes = Base64.decode(b64, Base64.DEFAULT)
                  return IntArray(bytes.size) { bytes[it].toInt() and 255 }
              }

              private fun removeSafe(v: View?) {
                  if (v == null) return
                  try {
                      wm?.removeView(v)
                  } catch (ex: Exception) {
                  }
              }

              private fun toast(s: String) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              }

              private fun screen(): IntArray {
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm?.defaultDisplay?.getRealMetrics(m)
                  return intArrayOf(m.widthPixels.coerceAtLeast(1), m.heightPixels.coerceAtLeast(1))
              }

              private fun loadCfg() {
                  nisanOn = prefs.getBoolean("nisan", true)
                  pickOn = prefs.getBoolean("pick", true)
                  pickMs = prefs.getInt("pickms", 500)
                  gamePkg = prefs.getString("game_pkg", "") ?: ""
                  profile = prefs.getInt("profile", 0).coerceIn(0, Cfg.PNAME.size - 1)
                  nSk = Cfg.SNAME[profile].size
                  val tp = arrayOfNulls<IntArray>(MAXS)
                  for (i in 0 until MAXS) {
                      present[i] = false
                      if (i >= nSk) {
                          bx[i] = -1f
                          by[i] = -1f
                          skillOn[i] = false
                          continue
                      }
                      val k = "s" + profile + "_" + i + "_"
                      val fixed = Cfg.SFIXED[profile][i]
                      var dx = Cfg.SX[profile][i]
                      var dy = Cfg.SY[profile][i]
                      var secDef = Cfg.SSEC[profile][i]
                      var tStr: String? = null
                      if (profile == 0 && i == 2) {
                          dx = prefs.getFloat("bx2", -1f)
                          dy = prefs.getFloat("by2", -1f)
                          secDef = prefs.getInt("budssec", 60)
                          tStr = prefs.getString("t2", null)
                      }
                      bx[i] = if (fixed) Cfg.SX[profile][i] else prefs.getFloat(k + "x", dx)
                      by[i] = if (fixed) Cfg.SY[profile][i] else prefs.getFloat(k + "y", dy)
                      secs[i] = prefs.getInt(k + "sec", secDef)
                      skillOn[i] = prefs.getBoolean(k + "on", defaultOn(profile, i))
                      val learned = prefs.getString(k + "t", tStr)
                      val def = Cfg.STPL[profile][i]
                      thr[i] = Cfg.BTH
                      if (fixed && def != null) {
                          tp[i] = decodeTpl(def)
                      } else if (learned != null) {
                          tp[i] = decodeTpl(learned)
                      } else if (def != null) {
                          tp[i] = decodeTpl(def)
                          thr[i] = Cfg.STHR[profile][i]
                      }
                  }
                  tplBuff = tp
                  if (!running) timeText?.text = Cfg.PNAME[profile]
                  rebuildPanelIcons()
              }

              private fun defaultOn(p: Int, i: Int): Boolean =
                  if (p == 0) prefs.getBoolean("b" + i, Cfg.SON[0][i]) else Cfg.SON[p][i]

              private fun skillEnabled(p: Int, i: Int): Boolean =
                  if (p == profile) skillOn[i] else prefs.getBoolean("s" + p + "_" + i + "_on", defaultOn(p, i))

              private fun iconOf(b64: String): BitmapDrawable {
                  val got = iconCache[b64]
                  if (got != null) return got
                  val bytes = Base64.decode(b64, Base64.DEFAULT)
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  val d = BitmapDrawable(resources, bmp)
                  d.setFilterBitmap(false)
                  iconCache[b64] = d
                  return d
              }

              private fun skillIcon(idx: Int): BitmapDrawable = iconOf(Cfg.SICON[profile][idx])

              // Yüzen penceredeki ikon şeridi: sadece açık olanlar görünür
              private fun rebuildPanelIcons() {
                  val row = iconRow ?: return
                  row.removeAllViews()
                  panelIcons.clear()
                  panelIdx.clear()
                  fun add(idx: Int, d: BitmapDrawable) {
                      val iv = ImageView(this)
                      iv.setImageDrawable(d)
                      iv.alpha = 0.35f
                      val p = LinearLayout.LayoutParams(dpx(24), dpx(24))
                      p.rightMargin = dpx(3)
                      row.addView(iv, p)
                      panelIcons.add(iv)
                      panelIdx.add(idx)
                  }
                  if (nisanOn) add(-1, iconOf(Cfg.IC_NISAN))
                  if (pickOn) add(-2, iconOf(Cfg.IC_EL))
                  for (i in 0 until nSk) {
                      if (skillOn[i] && bx[i] >= 0f) add(i, skillIcon(i))
                  }
                  updateStatus()
              }

              // ---------------- dokunma ----------------

              private fun tapFrac(fx: Float, fy: Float) {
                  val s = screen()
                  val j = 0.004f * s[1]
                  val x = (fx * s[0] + (Math.random().toFloat() * 2f - 1f) * j).coerceIn(0f, s[0] - 1f)
                  val y = (fy * s[1] + (Math.random().toFloat() * 2f - 1f) * j).coerceIn(0f, s[1] - 1f)
                  val path = Path()
                  path.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                      .build()
                  dispatchGesture(g, null, null)
                  lastTap = SystemClock.elapsedRealtime()
              }

              // ---------------- görüntü analizi (şablon eşleştirme) ----------------

              // Küçük skor = şablon bulundu. Ortalama mutlak renk farkı döner.
              private fun slide(px: IntArray, rw: Int, rh: Int, t: IntArray, tw: Int, th: Int): Float {
                  val n = tw * th * 3
                  var best = Int.MAX_VALUE
                  for (y in 0..(rh - th)) {
                      for (x in 0..(rw - tw)) {
                          var s = 0
                          var ti = 0
                          var yy = 0
                          while (yy < th) {
                              var p = (y + yy) * rw + x
                              var xx = 0
                              while (xx < tw) {
                                  val c = px[p++]
                                  s += abs(((c shr 16) and 255) - t[ti]) +
                                      abs(((c shr 8) and 255) - t[ti + 1]) +
                                      abs((c and 255) - t[ti + 2])
                                  ti += 3
                                  xx++
                              }
                              if (s >= best) break
                              yy++
                          }
                          if (s < best) best = s
                      }
                  }
                  return best.toFloat() / n
              }

              // Sol üst buff satırı: Hava Kılıcı, Öfke ve (öğretildiyse) Buds ikonları var mı?
              private fun analyzeBuffs(b: Bitmap, tpls: Array<IntArray?>): FloatArray {
                  val out = FloatArray(MAXS) { 99f }
                  val sc = b.height / 1080f
                  val x0 = (0.03f * b.width).toInt()
                  val x1 = (0.30f * b.width).toInt()
                  val y0 = (0.12f * b.height).toInt()
                  val y1 = (0.22f * b.height).toInt()
                  val f = 0.5f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.TW + 2 || rh < Cfg.TH + 2) return out
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  for (i in 0 until MAXS) {
                      val t = tpls[i] ?: continue
                      out[i] = slide(px, rw, rh, t, Cfg.TW, Cfg.TH)
                  }
                  return out
              }

              // Dokunulan buff ikonunu şablon olarak kaydet (yarım ölçek, 21x20)
              private fun learnIcon(b: Bitmap, fx: Float, fy: Float): String? {
                  val sc = b.height / 1080f
                  val w = (Cfg.TW * 2 * sc).toInt()
                  val h = (Cfg.TH * 2 * sc).toInt()
                  val cx = (fx * b.width).toInt()
                  val cy = (fy * b.height).toInt()
                  val x0 = (cx - w / 2).coerceIn(0, b.width - w)
                  val y0 = (cy - h / 2).coerceIn(0, b.height - h)
                  val crop = Bitmap.createBitmap(b, x0, y0, w, h)
                  val small = Bitmap.createScaledBitmap(crop, Cfg.TW, Cfg.TH, true)
                  val px = IntArray(Cfg.TW * Cfg.TH)
                  small.getPixels(px, 0, Cfg.TW, 0, 0, Cfg.TW, Cfg.TH)
                  val bytes = ByteArray(px.size * 3)
                  for (i in px.indices) {
                      bytes[i * 3] = ((px[i] shr 16) and 255).toByte()
                      bytes[i * 3 + 1] = ((px[i] shr 8) and 255).toByte()
                      bytes[i * 3 + 2] = (px[i] and 255).toByte()
                  }
                  return Base64.encodeToString(bytes, Base64.NO_WRAP)
              }

              // Nişan düğmesi: pasif mi aktif mi? Konumun çevresinde iki şablonu da arar.
              private fun analyzeNisan(b: Bitmap): FloatArray {
                  val sc = b.height / 1080f
                  val cx = (Cfg.NX * b.width).toInt()
                  val cy = (Cfg.NY * b.height).toInt()
                  val r = (103 * sc).toInt()
                  val x0 = (cx - r).coerceAtLeast(0)
                  val y0 = (cy - r).coerceAtLeast(0)
                  val x1 = (cx + r).coerceAtMost(b.width)
                  val y1 = (cy + r).coerceAtMost(b.height)
                  val f = 0.25f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.NT + 2 || rh < Cfg.NT + 2) return floatArrayOf(99f, 99f)
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  return floatArrayOf(
                      slide(px, rw, rh, tplNP, Cfg.NT, Cfg.NT),
                      slide(px, rw, rh, tplNA, Cfg.NT, Cfg.NT)
                  )
              }

              private fun scan() {
                  val now = SystemClock.elapsedRealtime()
                  if (busy && now - busySince > 3000L) busy = false
                  if (busy) return
                  busy = true
                  busySince = now
                  val tpls = tplBuff
                  val lp = learnPt
                  val doLearn = lp != null && now >= learnAfter
                  takeScreenshot(Display.DEFAULT_DISPLAY, worker, object : TakeScreenshotCallback {
                      override fun onSuccess(r: ScreenshotResult) {
                          try {
                              val hb = r.hardwareBuffer
                              val bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                                  ?.copy(Bitmap.Config.ARGB_8888, false)
                              hb.close()
                              if (bmp == null) {
                                  handler.post { busy = false }
                                  return
                              }
                              val bs = analyzeBuffs(bmp, tpls)
                              val ns = analyzeNisan(bmp)
                              var learned: String? = null
                              if (doLearn && lp != null) learned = learnIcon(bmp, lp[0], lp[1])
                              handler.post {
                                  busy = false
                                  if (learned != null) {
                                      val li = learnIdx
                                      prefs.edit().putString("s" + profile + "_" + li + "_t", learned).apply()
                                      useTimer[li] = false
                                      noSee[li] = 0
                                      loadCfg()
                                      learnPt = null
                                      toast(Cfg.SNAME[profile][li] + " ikonu öğrenildi")
                                  }
                                  applyScan(bs, ns)
                              }
                          } catch (ex: Exception) {
                              handler.post { busy = false }
                          }
                      }

                      override fun onFailure(code: Int) {
                          handler.post { busy = false }
                      }
                  })
              }

              private fun applyScan(bs: FloatArray, ns: FloatArray) {
                  val now = SystemClock.elapsedRealtime()
                  for (b in 0 until nSk) {
                      scoreB[b] = bs[b]
                      val tpl = tplBuff[b]
                      val p: Boolean
                      if (tpl != null && !useTimer[b]) {
                          // sol üstteki buff ikonunu izle
                          p = bs[b] < thr[b]
                          if (p) {
                              noSee[b] = 0
                              verifyAt[b] = 0L
                          } else if (verifyAt[b] > 0L && now >= verifyAt[b]) {
                              // basıldı ama ikon çıkmadı: 3 kez üst üste olursa süreye geç
                              verifyAt[b] = 0L
                              noSee[b]++
                              if (noSee[b] >= 3) {
                                  useTimer[b] = true
                                  toast(Cfg.SNAME[profile][b] + ": ikon görünmedi, süreye göre yenilenecek")
                              }
                          }
                      } else {
                          p = lastCast[b] > 0L && now - lastCast[b] < secs[b] * 1000L
                      }
                      present[b] = p
                      if (p) miss[b] = 0 else miss[b]++
                  }
                  scoreP = ns[0]
                  scoreA = ns[1]
                  nisanState = if (minOf(scoreP, scoreA) > 40f) 0
                  else if (scoreP < scoreA - 3f) 1
                  else if (scoreA < scoreP - 3f) 2
                  else 0
                  updateStatus()
                  if (running) decide(now)
              }

              // ---------------- karar: görülen anda hemen bas ----------------

              private fun decide(now: Long) {
                  if (!inGame) return
                  if (now - lastTap < 90L) return
                  // 1) Nişan pasif oldu: anında tekrar aç
                  if (nisanOn && nisanState == 1 && now - lastNisan > nisanGap) {
                      tapFrac(Cfg.NX, Cfg.NY)
                      lastNisan = now
                      nisanCount++
                      return
                  }
                  // 2) Bir beceri (buff) bitti: anında yenile
                  if (now >= skillLock) {
                      for (b in 0 until nSk) {
                          if (skillOn[b] && bx[b] >= 0f && miss[b] >= 1 && now - lastCast[b] > recastGap) {
                              tapFrac(bx[b], by[b])
                              lastCast[b] = now
                              verifyAt[b] = now + 2500L
                              miss[b] = 0
                              skillLock = now + castLockMs
                              skillCount++
                              return
                          }
                      }
                  }
              }

              // ---------------- döngüler ----------------

              // sürekli tarama (ekran görüntüsü sınırı izin verdiği kadar hızlı)
              private val scanLoop = object : Runnable {
                  override fun run() {
                      if (Build.VERSION.SDK_INT >= 30 && inGame) scan()
                      handler.postDelayed(this, if (running) 60L else 600L)
                  }
              }

              private val pickLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      var wait = pickMs.toLong()
                      if (pickOn) {
                          if (now - lastTap < 120L) {
                              wait = 60L
                          } else {
                              tapFrac(Cfg.HX, Cfg.HY)
                              pickCount++
                          }
                      }
                      handler.postDelayed(this, wait)
                  }
              }

              // Hangi uygulama önde? Sadece seçili oyundaysa pencereyi göster ve çalış.
              private fun topAppPkg(): String? {
                  try {
                      val ws = windows
                      if (ws == null || ws.isEmpty()) return null
                      var best: AccessibilityWindowInfo? = null
                      for (wi in ws) {
                          if (wi.type != AccessibilityWindowInfo.TYPE_APPLICATION) continue
                          if (wi.isActive) {
                              best = wi
                              break
                          }
                          if (best == null || wi.layer > best.layer) best = wi
                      }
                      val root = best?.root ?: return null
                      return root.packageName?.toString()
                  } catch (ex: Exception) {
                      return null
                  }
              }

              private val gameLoop = object : Runnable {
                  override fun run() {
                      gamePkg = prefs.getString("game_pkg", "") ?: ""
                      val pkg = topAppPkg() ?: evPkg
                      val now = gamePkg.isNotEmpty() && pkg == gamePkg
                      if (now != inGame) {
                          inGame = now
                          panel?.visibility = if (now) View.VISIBLE else View.GONE
                          if (now) {
                              loadCfg()
                              updateStatus()
                          } else {
                              stopAll()
                              showMenu(false)
                              learnPt = null
                          }
                      }
                      handler.postDelayed(this, 600L)
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val s = (SystemClock.elapsedRealtime() - startAt) / 1000
                      timeText?.text = "%s %02d:%02d · N%d B%d T%d".format(Cfg.PNAME[profile], s / 60, s % 60, nisanCount, skillCount, pickCount)
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun updateStatus() {
                  for (n in 0 until panelIcons.size) {
                      val idx = panelIdx[n]
                      val on = if (idx >= 0) present[idx] else if (idx == -1) (nisanState == 2) else running
                      panelIcons[n].alpha = if (on) 1f else 0.35f
                  }
              }

              private fun stopAll() {
                  running = false
                  handler.removeCallbacks(pickLoop)
                  handler.removeCallbacks(ticker)
                  startBtn?.text = "▶"
                  timeText?.text = Cfg.PNAME[profile]
              }

              fun toggle() {
                  if (running) {
                      stopAll()
                      return
                  }
                  if (Build.VERSION.SDK_INT < 30) {
                      toast("Android 11 veya üstü gerekli")
                      return
                  }
                  if (!inGame) {
                      toast("Önce seçili oyuna gir")
                      return
                  }
                  loadCfg()
                  running = true
                  nisanCount = 0
                  skillCount = 0
                  pickCount = 0
                  lastNisan = 0L
                  skillLock = 0L
                  for (b in 0 until MAXS) {
                      miss[b] = 0
                      lastCast[b] = 0L
                      useTimer[b] = false
                      noSee[b] = 0
                      verifyAt[b] = 0L
                  }
                  startAt = SystemClock.elapsedRealtime()
                  startBtn?.text = "■"
                  handler.post(pickLoop)
                  handler.post(ticker)
                  scan()
              }

              // ---------------- arayüz yardımcıları ----------------

              private fun dpx(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun shape(fill: Int, stroke: Int, rDp: Int, strokeDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dpx(rDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dpx(strokeDp), stroke)
                  return g
              }

              // taş görünümlü düğme (koyu zemin, mavi kenar)
              private fun stoneBtn(label: String, sp: Float, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = sp
                  t.setTextColor(cText)
                  t.gravity = Gravity.CENTER
                  t.setTypeface(t.typeface, Typeface.BOLD)
                  t.background = shape(cStone, cStroke, 8, 1)
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun styledSwitch(label: String, init: Boolean, onChange: (Boolean) -> Unit): Switch {
                  val sw = Switch(this)
                  sw.text = label
                  sw.setTextColor(cText)
                  sw.textSize = 13f
                  sw.isChecked = init
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(cAccent, 0xFF6B7A8E.toInt()))
                  sw.trackTintList = ColorStateList(states, intArrayOf(0x662F9BFF, 0x44FFFFFF))
                  sw.setPadding(0, dpx(5), 0, dpx(5))
                  sw.setOnCheckedChangeListener { _, on -> onChange(on) }
                  return sw
              }

              private fun sectionHead(t: String): TextView {
                  val h = TextView(this)
                  h.text = t
                  h.textSize = 12f
                  h.setTypeface(h.typeface, Typeface.BOLD)
                  h.setTextColor(cCyan)
                  h.setPadding(0, dpx(10), 0, dpx(2))
                  return h
              }

              private fun drag(handle: View, target: View, lp: WindowManager.LayoutParams) {
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  handle.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX
                          sy = e.rawY
                          ox = lp.x
                          oy = lp.y
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          lp.x = ox + (e.rawX - sx).toInt()
                          lp.y = oy + (e.rawY - sy).toInt()
                          try {
                              wm?.updateViewLayout(target, lp)
                          } catch (ex: Exception) {
                          }
                      }
                      true
                  }
              }

              private fun testRow(a: String, fa: () -> Unit, b: String, fb: () -> Unit): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val ba = stoneBtn(a, 12f, fa)
                  val bb = stoneBtn(b, 12f, fb)
                  val p1 = LinearLayout.LayoutParams(0, dpx(40), 1f)
                  p1.topMargin = dpx(4)
                  p1.rightMargin = dpx(3)
                  val p2 = LinearLayout.LayoutParams(0, dpx(40), 1f)
                  p2.topMargin = dpx(4)
                  p2.leftMargin = dpx(3)
                  row.addView(ba, p1)
                  row.addView(bb, p2)
                  return row
              }

              // Tam ekran dokunma katmanı: dokunulan noktayı ekran oranı olarak verir
              private fun pickPoint(msg: String, done: (Float, Float) -> Unit) {
                  val w = wm ?: return
                  showMenu(false)
                  val v = FrameLayout(this)
                  v.setBackgroundColor(0x99000000.toInt())
                  val tv = TextView(this)
                  tv.text = msg
                  tv.textSize = 18f
                  tv.setTextColor(cText)
                  tv.gravity = Gravity.CENTER
                  tv.setPadding(dpx(16), dpx(10), dpx(16), dpx(10))
                  tv.background = shape(cBg, cAccent, 12, 2)
                  v.addView(tv, FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER))
                  val lp = WindowManager.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  v.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_UP) {
                          val sc = screen()
                          val fx = (e.rawX / sc[0]).coerceIn(0f, 1f)
                          val fy = (e.rawY / sc[1]).coerceIn(0f, 1f)
                          removeSafe(v)
                          handler.post {
                              done(fx, fy)
                              showMenu(true)
                          }
                      }
                      true
                  }
                  w.addView(v, lp)
              }

              // ---------------- kontrol menüsü ----------------

              private fun btnRow(items: List<Pair<String, () -> Unit>>): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  for (it in items) {
                      val b = stoneBtn(it.first, 11f, it.second)
                      val p = LinearLayout.LayoutParams(0, dpx(36), 1f)
                      p.topMargin = dpx(4)
                      p.leftMargin = dpx(2)
                      p.rightMargin = dpx(2)
                      row.addView(b, p)
                  }
                  return row
              }

              private fun skillInfo(i: Int): String {
                  if (Cfg.SFIXED[profile][i]) return "Yuva sabit  ·  sol üst ikon takibi açık"
                  val y = if (bx[i] >= 0f) "Yuva: ayarlı" else "Yuva: ayarlanmadı"
                  val ic = if (tplBuff[i] == null) "ikon yok, her " + secs[i] + " sn yeniler"
                  else if (useTimer[i]) "ikon görünmedi, her " + secs[i] + " sn yeniler"
                  else "sol üst ikon takibi açık"
                  return y + "  ·  " + ic
              }

              private fun cardBg(on: Boolean): GradientDrawable =
                  if (on) shape(0xFF0A1B33.toInt(), cAccent, 8, 2) else shape(0xFF0A1220.toInt(), 0xFF14263F.toInt(), 8, 1)

              private fun iconSwitch(b64: String, label: String, init: Boolean, onChange: (Boolean) -> Unit): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val img = ImageView(this)
                  img.setImageDrawable(iconOf(b64))
                  img.alpha = if (init) 1f else 0.35f
                  row.addView(img, LinearLayout.LayoutParams(dpx(34), dpx(34)))
                  val sw = styledSwitch(label, init) { on ->
                      img.alpha = if (on) 1f else 0.35f
                      onChange(on)
                  }
                  val p = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  p.leftMargin = dpx(8)
                  row.addView(sw, p)
                  return row
              }

              private fun buildMenu(): View {
                  val sc = screen()
                  val w = minOf(dpx(310), (sc[0] * 0.46f).toInt())

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.background = shape(cBg, cAccent, 14, 2)
                  root.setPadding(dpx(10), dpx(8), dpx(10), dpx(8))

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  row.addView(logo, LinearLayout.LayoutParams(dpx(28), dpx(28)))
                  val title = TextView(this)
                  title.text = "KONTROL"
                  title.textSize = 14f
                  title.letterSpacing = 0.08f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  title.setTextColor(cCyan)
                  title.setPadding(dpx(8), 0, 0, 0)
                  row.addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  val close = stoneBtn("✕", 14f) { showMenu(false) }
                  row.addView(close, LinearLayout.LayoutParams(dpx(40), dpx(32)))
                  root.addView(row)

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL

                  col.addView(sectionHead("OYUN"))
                  val gn = TextView(this)
                  gn.text = (prefs.getString("game_name", "") ?: "") + "  (yalnızca bu oyunda çalışır)"
                  gn.textSize = 12f
                  gn.setTextColor(cText)
                  col.addView(gn)

                  // --- karakter seçimi: her kartta o karakterin becerileri, açık olanlar parlak ---
                  col.addView(sectionHead("KARAKTER (seçilen aktif olur)"))
                  val strip = Array(Cfg.PNAME.size) { arrayOfNulls<ImageView>(MAXS) }
                  val prow = LinearLayout(this)
                  prow.orientation = LinearLayout.HORIZONTAL
                  for (k in 0 until Cfg.PNAME.size) {
                      val on = (k == profile)
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.VERTICAL
                      card.gravity = Gravity.CENTER_HORIZONTAL
                      card.setPadding(dpx(4), dpx(6), dpx(4), dpx(6))
                      card.background = if (on) shape(cAccent, 0xFF9ADBFF.toInt(), 10, 2) else shape(cStone, cStroke, 10, 1)
                      val nm = TextView(this)
                      nm.text = Cfg.PNAME[k]
                      nm.textSize = 13f
                      nm.setTypeface(nm.typeface, Typeface.BOLD)
                      nm.setTextColor(if (on) 0xFF04101F.toInt() else cText)
                      nm.gravity = Gravity.CENTER
                      card.addView(nm)
                      val sr = LinearLayout(this)
                      sr.orientation = LinearLayout.HORIZONTAL
                      sr.gravity = Gravity.CENTER
                      sr.setPadding(0, dpx(4), 0, 0)
                      for (i in 0 until Cfg.SNAME[k].size) {
                          val iv = ImageView(this)
                          iv.setImageDrawable(iconOf(Cfg.SICON[k][i]))
                          iv.alpha = if (skillEnabled(k, i)) 1f else 0.3f
                          sr.addView(iv, LinearLayout.LayoutParams(dpx(20), dpx(20)))
                          strip[k][i] = iv
                      }
                      card.addView(sr)
                      card.setOnClickListener {
                          if (profile != k) {
                              stopAll()
                              learnPt = null
                              prefs.edit().putInt("profile", k).apply()
                              loadCfg()
                              showMenu(false)
                              showMenu(true)
                          }
                      }
                      val p = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      p.leftMargin = dpx(3)
                      p.rightMargin = dpx(3)
                      prow.addView(card, p)
                  }
                  col.addView(prow)

                  // --- ortak ---
                  col.addView(sectionHead("ORTAK"))
                  col.addView(iconSwitch(Cfg.IC_NISAN, "Nişan: pasif olunca hemen aç", nisanOn) { on ->
                      nisanOn = on
                      prefs.edit().putBoolean("nisan", on).apply()
                      rebuildPanelIcons()
                  })
                  col.addView(iconSwitch(Cfg.IC_EL, "Oto toplama (el düğmesi)", pickOn) { on ->
                      pickOn = on
                      prefs.edit().putBoolean("pick", on).apply()
                      rebuildPanelIcons()
                  })
                  val pl = TextView(this)
                  pl.textSize = 12f
                  pl.setTextColor(cText)
                  pl.setPadding(0, dpx(6), 0, 0)
                  pl.text = "Toplama aralığı: " + pickMs + " ms"
                  col.addView(pl)
                  val pbar = SeekBar(this)
                  pbar.max = 13
                  pbar.progress = ((pickMs - 200) / 100).coerceIn(0, 13)
                  pbar.progressTintList = ColorStateList.valueOf(cAccent)
                  pbar.thumbTintList = ColorStateList.valueOf(cCyan)
                  pbar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          pickMs = 200 + p * 100
                          pl.text = "Toplama aralığı: " + pickMs + " ms"
                          prefs.edit().putInt("pickms", pickMs).apply()
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}

                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })
                  col.addView(pbar)
                  col.addView(btnRow(listOf(
                      Pair("Nişan dene", {
                          tapFrac(Cfg.NX, Cfg.NY)
                          toast("Nişan düğmesine basıldı")
                      }),
                      Pair("Topla dene", {
                          tapFrac(Cfg.HX, Cfg.HY)
                          toast("El düğmesine basıldı")
                      })
                  )))

                  // --- beceriler (seçili karaktere göre) ---
                  col.addView(sectionHead("BECERİLER: " + Cfg.PNAME[profile].uppercase()))
                  for (i in 0 until nSk) {
                      val fixed = Cfg.SFIXED[profile][i]
                      val pf = profile
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.VERTICAL
                      card.background = cardBg(skillOn[i])
                      card.setPadding(dpx(8), dpx(6), dpx(8), dpx(6))

                      val head = LinearLayout(this)
                      head.orientation = LinearLayout.HORIZONTAL
                      head.gravity = Gravity.CENTER_VERTICAL
                      val img = ImageView(this)
                      img.setImageDrawable(skillIcon(i))
                      img.alpha = if (skillOn[i]) 1f else 0.35f
                      head.addView(img, LinearLayout.LayoutParams(dpx(40), dpx(40)))
                      val sw = styledSwitch(Cfg.SNAME[pf][i] + ": bitince bas", skillOn[i]) { on ->
                          skillOn[i] = on
                          prefs.edit().putBoolean("s" + pf + "_" + i + "_on", on).apply()
                          img.alpha = if (on) 1f else 0.35f
                          card.background = cardBg(on)
                          strip[pf][i]?.alpha = if (on) 1f else 0.3f
                          rebuildPanelIcons()
                      }
                      val sp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      sp.leftMargin = dpx(8)
                      head.addView(sw, sp)
                      card.addView(head)

                      val info = TextView(this)
                      info.textSize = 11f
                      info.setTextColor(cMuted)
                      info.text = skillInfo(i)
                      card.addView(info)

                      val test = Pair("Dene", {
                          if (bx[i] < 0f) {
                              toast("Önce yuvayı ayarla")
                          } else {
                              tapFrac(bx[i], by[i])
                              toast(Cfg.SNAME[pf][i] + " basıldı")
                          }
                      })
                      if (fixed) {
                          card.addView(btnRow(listOf(test)))
                      } else {
                          card.addView(btnRow(listOf(
                              Pair("Yuva ayarla", {
                                  pickPoint(Cfg.SNAME[pf][i] + " beceri düğmesine dokun") { fx, fy ->
                                      prefs.edit().putFloat("s" + pf + "_" + i + "_x", fx).putFloat("s" + pf + "_" + i + "_y", fy).apply()
                                      bx[i] = fx
                                      by[i] = fy
                                      toast("Yuva kaydedildi")
                                      rebuildPanelIcons()
                                  }
                              }),
                              Pair("İkon öğret", {
                                  pickPoint(Cfg.SNAME[pf][i] + " açıkken sol üstteki ikonuna dokun") { fx, fy ->
                                      learnPt = floatArrayOf(fx, fy)
                                      learnIdx = i
                                      learnAfter = SystemClock.elapsedRealtime() + 500L
                                      toast("İkon öğreniliyor...")
                                  }
                              })
                          )))
                          card.addView(btnRow(listOf(
                              test,
                              Pair("İkonu sıfırla", {
                                  prefs.edit().remove("s" + pf + "_" + i + "_t").apply()
                                  useTimer[i] = false
                                  noSee[i] = 0
                                  loadCfg()
                                  info.text = skillInfo(i)
                                  toast("Varsayılan ikona dönüldü")
                              })
                          )))
                          val sl = TextView(this)
                          sl.textSize = 11f
                          sl.setTextColor(cText)
                          sl.setPadding(0, dpx(6), 0, 0)
                          sl.text = "İkon görünmezse yenileme: her " + secs[i] + " sn"
                          card.addView(sl)
                          val sk = SeekBar(this)
                          sk.max = 29
                          sk.progress = ((secs[i] / 10) - 1).coerceIn(0, 29)
                          sk.progressTintList = ColorStateList.valueOf(cAccent)
                          sk.thumbTintList = ColorStateList.valueOf(cCyan)
                          sk.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                                  secs[i] = (p + 1) * 10
                                  sl.text = "İkon görünmezse yenileme: her " + secs[i] + " sn"
                                  prefs.edit().putInt("s" + pf + "_" + i + "_sec", secs[i]).apply()
                                  info.text = skillInfo(i)
                              }

                              override fun onStartTrackingTouch(bar: SeekBar?) {}

                              override fun onStopTrackingTouch(bar: SeekBar?) {}
                          })
                          card.addView(sk)
                      }
                      val cp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      cp.topMargin = dpx(6)
                      col.addView(card, cp)
                  }

                  val sv = ScrollView(this)
                  sv.addView(col)
                  root.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (sc[1] * 0.62f).toInt().coerceAtLeast(dpx(140))))

                  val lp = menuLp ?: WindowManager.LayoutParams(
                      w,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).also {
                      it.gravity = Gravity.TOP or Gravity.START
                      it.x = (sc[0] - w) / 2
                      it.y = dpx(56)
                      menuLp = it
                  }
                  drag(title, root, lp)
                  return root
              }

              private fun showMenu(on: Boolean) {
                  val w = wm ?: return
                  if (on && !menuShown) {
                      loadCfg()
                      removeSafe(menu)
                      val fresh = buildMenu()
                      val lp = menuLp ?: return
                      menu = fresh
                      w.addView(fresh, lp)
                      menuShown = true
                  } else if (!on && menuShown) {
                      removeSafe(menu)
                      menuShown = false
                  }
              }

              // ---------------- servis ----------------

              override fun onServiceConnected() {
                  prefs = getSharedPreferences("ayar", MODE_PRIVATE)
                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  removeSafe(panel)
                  removeSafe(menu)
                  menuShown = false
                  loadCfg()
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  // yüzen pencere: küçük, mavi-siyah, logodan sürüklenir, logoya dokununca küçülür
                  val scr = screen()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = shape(cBg, cAccent, 14, 2)
                  box.setPadding(dp(6), dp(5), dp(6), dp(5))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  top.addView(logo, LinearLayout.LayoutParams(dp(34), dp(34)))

                  val ctl = LinearLayout(this)
                  ctl.orientation = LinearLayout.HORIZONTAL
                  val sBtn = stoneBtn("▶", 16f) { toggle() }
                  startBtn = sBtn
                  val mBtn = stoneBtn("☰", 16f) { showMenu(!menuShown) }
                  for (bv in listOf(sBtn, mBtn)) {
                      val p = LinearLayout.LayoutParams(dp(40), dp(34))
                      p.leftMargin = dp(5)
                      ctl.addView(bv, p)
                  }
                  top.addView(ctl)
                  box.addView(top)

                  val info = LinearLayout(this)
                  info.orientation = LinearLayout.VERTICAL
                  info.setPadding(dp(2), dp(3), 0, 0)
                  val tt = TextView(this)
                  tt.textSize = 11f
                  tt.setTextColor(cCyan)
                  timeText = tt
                  tt.text = Cfg.PNAME[profile]
                  val st = TextView(this)
                  st.textSize = 10f
                  st.setTextColor(cMuted)
                  st.maxLines = 3
                  st.maxWidth = dp(230)
                  statusText = st
                  st.text = "parlak = aktif · soluk = bekliyor"
                  val ir = LinearLayout(this)
                  ir.orientation = LinearLayout.HORIZONTAL
                  ir.setPadding(0, dp(4), 0, dp(2))
                  iconRow = ir
                  info.addView(tt)
                  info.addView(ir)
                  info.addView(st)
                  box.addView(info)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = ((scr[0] - dp(190)) / 2).coerceAtLeast(0)
                  lp.y = dp(4)
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  var collapsed = false
                  logo.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX
                          sy = e.rawY
                          ox = lp.x
                          oy = lp.y
                          moved = false
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          val dx = e.rawX - sx
                          val dy = e.rawY - sy
                          if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                          if (moved) {
                              lp.x = ox + dx.toInt()
                              lp.y = oy + dy.toInt()
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      } else if (e.action == MotionEvent.ACTION_UP) {
                          if (!moved) {
                              collapsed = !collapsed
                              ctl.visibility = if (collapsed) View.GONE else View.VISIBLE
                              info.visibility = if (collapsed) View.GONE else View.VISIBLE
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      }
                      true
                  }
                  box.visibility = View.GONE
                  w.addView(box, lp)
                  panel = box
                  rebuildPanelIcons()

                  handler.removeCallbacks(scanLoop)
                  handler.removeCallbacks(gameLoop)
                  handler.post(scanLoop)
                  handler.post(gameLoop)
                  inst = this
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e != null && e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      val p = e.packageName?.toString()
                      if (p != null && p != packageName) evPkg = p
                  }
              }

              override fun onInterrupt() {
                  stopAll()
              }

              override fun onDestroy() {
                  stopAll()
                  handler.removeCallbacks(scanLoop)
                  handler.removeCallbacks(gameLoop)
                  inst = null
                  removeSafe(panel)
                  removeSafe(menu)
                  worker.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Hata ozeti
        if: failure()
        run: |
          {
            echo '### HATA OZETI'
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Execution failed|Could not|Caused by|AAPT|Unresolved" -A4 build.log | head -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
