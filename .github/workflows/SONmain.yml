          cat > proj/app/src/main/java/com/benim/tiklayici/MainActivity.kt <<'EOF'
          package com.benim.tiklayici

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private var statusTv: TextView? = null
              private var gameTv: TextView? = null
              private val cBg = 0xFF05080E.toInt()
              private val cCard = 0xFF0D1522.toInt()
              private val cAccent = 0xFF2F9BFF.toInt()
              private val cCyan = 0xFF7CD0FF.toInt()
              private val cMuted = 0xFF8CA0B8.toInt()

              private fun shape(fill: Int, stroke: Int, r: Float, sw: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = r
                  g.setStroke(sw, stroke)
                  return g
              }

              private fun prefs() = getSharedPreferences("ayar", MODE_PRIVATE)

              private fun refresh() {
                  val on = ClickService.inst != null
                  statusTv?.text = if (on) "● Servis açık" else "○ Servis kapalı  ·  aşağıdan Erişilebilirlik'i aç"
                  statusTv?.setTextColor(if (on) 0xFF4CE0A0.toInt() else cCyan)
                  val name = prefs().getString("game_name", "") ?: ""
                  gameTv?.text = if (name.isEmpty()) "Oyun seçilmedi" else "Seçili oyun: " + name
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun pickGame() {
                  val i = Intent(Intent.ACTION_MAIN)
                  i.addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = packageManager.queryIntentActivities(i, 0)
                  val apps = list.map { Pair(it.loadLabel(packageManager).toString(), it.activityInfo.packageName) }
                      .filter { it.second != packageName }
                      .distinctBy { it.second }
                      .sortedBy { it.first.lowercase() }
                  if (apps.isEmpty()) {
                      Toast.makeText(this, "Uygulama listesi alınamadı", Toast.LENGTH_LONG).show()
                      return
                  }
                  val names = apps.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle("Oyunu seç")
                      .setItems(names) { _, idx ->
                          prefs().edit().putString("game_pkg", apps[idx].second).putString("game_name", apps[idx].first).apply()
                          refresh()
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              private fun launchGame() {
                  val pkg = prefs().getString("game_pkg", "") ?: ""
                  if (pkg.isEmpty()) {
                      Toast.makeText(this, "Önce oyunu seç", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val li = packageManager.getLaunchIntentForPackage(pkg)
                  if (li == null) {
                      Toast.makeText(this, "Oyun açılamadı", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (ClickService.inst == null) {
                      Toast.makeText(this, "Erişilebilirlik servisi kapalı, pencere çıkmaz", Toast.LENGTH_LONG).show()
                  }
                  startActivity(li)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.gravity = Gravity.CENTER_HORIZONTAL
                  col.setBackgroundColor(cBg)
                  col.setPadding(dp(18), dp(36), dp(18), dp(24))

                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  col.addView(logo, LinearLayout.LayoutParams(dp(100), dp(100)))

                  val title = TextView(this)
                  title.text = "OTO AV"
                  title.textSize = 28f
                  title.letterSpacing = 0.15f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  title.setTextColor(cCyan)
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, dp(8), 0, dp(2))
                  col.addView(title)

                  val sub = TextView(this)
                  sub.text = "Savaşçı  •  Sura  •  Nişan  •  Oto Topla"
                  sub.textSize = 12f
                  sub.setTextColor(cMuted)
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, 0, 0, dp(14))
                  col.addView(sub)

                  val st = TextView(this)
                  st.textSize = 14f
                  st.gravity = Gravity.CENTER
                  st.setPadding(dp(12), dp(10), dp(12), dp(10))
                  st.background = shape(cCard, 0xFF1F4F8F.toInt(), dp(12).toFloat(), dp(1))
                  statusTv = st
                  col.addView(st, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val gt = TextView(this)
                  gt.textSize = 15f
                  gt.setTypeface(gt.typeface, Typeface.BOLD)
                  gt.setTextColor(0xFFE6F0FF.toInt())
                  gt.gravity = Gravity.CENTER
                  gt.setPadding(dp(12), dp(10), dp(12), dp(10))
                  gt.background = shape(cCard, 0xFF14263F.toInt(), dp(12).toFloat(), dp(1))
                  gameTv = gt
                  val glp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  glp.topMargin = dp(10)
                  col.addView(gt, glp)

                  fun btn(label: String, filled: Boolean, act: () -> Unit): TextView {
                      val b = TextView(this)
                      b.text = label
                      b.textSize = 15f
                      b.setTypeface(b.typeface, Typeface.BOLD)
                      b.gravity = Gravity.CENTER
                      if (filled) {
                          b.setTextColor(0xFF04101F.toInt())
                          b.background = shape(cAccent, 0xFF9ADBFF.toInt(), dp(12).toFloat(), dp(1))
                      } else {
                          b.setTextColor(0xFFE6F0FF.toInt())
                          b.background = shape(0xFF111B2B.toInt(), 0xFF2A6CB8.toInt(), dp(12).toFloat(), dp(1))
                      }
                      b.setOnClickListener { act() }
                      return b
                  }

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val b1 = btn("Oyunu Seç", false) { pickGame() }
                  val b2 = btn("Oyunu Başlat", true) { launchGame() }
                  val p1 = LinearLayout.LayoutParams(0, dp(48), 1f)
                  p1.rightMargin = dp(4)
                  val p2 = LinearLayout.LayoutParams(0, dp(48), 1f)
                  p2.leftMargin = dp(4)
                  row.addView(b1, p1)
                  row.addView(b2, p2)
                  val rlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  rlp.topMargin = dp(10)
                  col.addView(row, rlp)

                  val how = TextView(this)
                  how.text = "1) Erişilebilirlik'ten Oto Av servisini aç.\n" +
                      "2) Oyunu Seç ile oyunu belirle, Oyunu Başlat ile aç.\n" +
                      "3) Pencere yalnızca o oyunda görünür. Başka uygulamaya geçince gizlenir ve durur.\n" +
                      "4) Logoya dokun: küçült / büyüt. Logodan tutup sürükle.\n" +
                      "5) ☰ menüsünde karakteri seç (Savaşçı / Karakter 2), becerileri aç / kapat, \"dene\" düğmeleriyle dene.\n" +
                      "6) ▶ başlat, ■ durdur.\n\n" +
                      "Yuvası hazır olmayan becerilerde \"Yuva ayarla\" ile beceri düğmesine dokun. \"İkon öğret\" ile sol üstteki buff ikonunu da göster; öğretmezsen süreye göre yeniler.\n\n" +
                      "Android 11 ve üstü gerekir."
                  how.textSize = 13f
                  how.setTextColor(0xFFB8C7DB.toInt())
                  how.setPadding(dp(14), dp(12), dp(14), dp(12))
                  how.background = shape(cCard, 0xFF14263F.toInt(), dp(12).toFloat(), dp(1))
                  val hlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  hlp.topMargin = dp(12)
                  col.addView(how, hlp)

                  val acc = btn("Erişilebilirlik Ayarları", true) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  val blp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48))
                  blp.topMargin = dp(14)
                  col.addView(acc, blp)

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(cBg)
                  sv.addView(col)
                  setContentView(sv)
              }
          }
          EOF

