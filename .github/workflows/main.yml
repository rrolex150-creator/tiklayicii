                  st.textSize = 11f
                  st.setTextColor(0xFFDDDDDD.toInt())
                  st.text = "Hazır"
                  st.maxLines = 4
                  st.setPadding(dp(4), dp(4), dp(4), 0)
                  statusTv = st

                  left.addView(header)
                  left.addView(st, LinearLayout.LayoutParams(dp(180), ViewGroup.LayoutParams.WRAP_CONTENT))

                  // --- sağ: yana açılan menü ---
                  val menu = LinearLayout(this)
                  menu.orientation = LinearLayout.VERTICAL
