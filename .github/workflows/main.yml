              // ---------------- çizilen ikonlar (emoji yok) ----------------
              private val symCache = HashMap<String, BitmapDrawable>()

              private fun sym(kind: String, color: Int): BitmapDrawable {
                  val key = kind + "#" + color
                  val got = symCache[key]
                  if (got != null) return got
                  val n = 96
                  val bmp = Bitmap.createBitmap(n, n, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val s = n / 24f
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = color
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2f * s
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeJoin = Paint.Join.ROUND
                  val f = Paint(Paint.ANTI_ALIAS_FLAG)
                  f.color = color
                  f.style = Paint.Style.FILL
                  val pa = Path()
                  fun ln(a: Float, b: Float, c2: Float, d: Float) {
                      c.drawLine(a * s, b * s, c2 * s, d * s, p)
                  }
                  when (kind) {
                      "play" -> {
                          pa.moveTo(7f * s, 4f * s)
                          pa.lineTo(20f * s, 12f * s)
                          pa.lineTo(7f * s, 20f * s)
                          pa.close()
                          c.drawPath(pa, f)
                      }
                      "stop" -> c.drawRoundRect(RectF(6f * s, 6f * s, 18f * s, 18f * s), 2f * s, 2f * s, f)
                      "menu" -> {
                          ln(4f, 7f, 20f, 7f)
                          ln(4f, 12f, 20f, 12f)
                          ln(4f, 17f, 20f, 17f)
                      }
                      "close" -> {
                          ln(6f, 6f, 18f, 18f)
                          ln(18f, 6f, 6f, 18f)
                      }
                      "plus" -> {
                          ln(12f, 5f, 12f, 19f)
                          ln(5f, 12f, 19f, 12f)
                      }
                      "minus" -> ln(5f, 12f, 19f, 12f)
                      "tgt" -> {
                          c.drawCircle(12f * s, 12f * s, 7f * s, p)
                          c.drawCircle(12f * s, 12f * s, 1.5f * s, f)
                          ln(12f, 2f, 12f, 6f)
                          ln(12f, 18f, 12f, 22f)
                          ln(2f, 12f, 6f, 12f)
                          ln(18f, 12f, 22f, 12f)
                      }
                      "sword" -> {
                          ln(6f, 18f, 19f, 5f)
                          ln(8f, 12f, 12f, 16f)
                          ln(6f, 18f, 4f, 20f)
                      }
                      "hand" -> {
                          c.drawRoundRect(RectF(7f * s, 11f * s, 18f * s, 21f * s), 3f * s, 3f * s, p)
                          ln(9f, 11f, 9f, 5f)
                          ln(11.5f, 11f, 11.5f, 4f)
                          ln(14f, 11f, 14f, 5f)
                          ln(16.5f, 11f, 16.5f, 7f)
                      }
                      "pot" -> {
                          ln(9.5f, 3f, 14.5f, 3f)
                          pa.moveTo(10f * s, 3f * s)
                          pa.lineTo(10f * s, 9f * s)
                          pa.lineTo(5.5f * s, 18f * s)
                          pa.quadTo(5f * s, 21f * s, 8f * s, 21f * s)
                          pa.lineTo(16f * s, 21f * s)
                          pa.quadTo(19f * s, 21f * s, 18.5f * s, 18f * s)
                          pa.lineTo(14f * s, 9f * s)
                          pa.lineTo(14f * s, 3f * s)
                          c.drawPath(pa, p)
                          ln(7.5f, 15f, 16.5f, 15f)
                      }
                      "heart" -> {
                          pa.moveTo(12f * s, 20f * s)
                          pa.cubicTo(3f * s, 14f * s, 3f * s, 6f * s, 8.5f * s, 6f * s)
                          pa.cubicTo(10.5f * s, 6f * s, 12f * s, 7.5f * s, 12f * s, 9f * s)
                          pa.cubicTo(12f * s, 7.5f * s, 13.5f * s, 6f * s, 15.5f * s, 6f * s)
                          pa.cubicTo(21f * s, 6f * s, 21f * s, 14f * s, 12f * s, 20f * s)
                          pa.close()
                          c.drawPath(pa, p)
                      }
                      "star" -> {
                          for (k in 0 until 10) {
                              val ang = Math.toRadians((-90 + k * 36).toDouble())
                              val r = if (k % 2 == 0) 9f else 4f
                              val x = (12f + r * Math.cos(ang).toFloat()) * s
                              val y = (12f + r * Math.sin(ang).toFloat()) * s
                              if (k == 0) pa.moveTo(x, y) else pa.lineTo(x, y)
                          }
                          pa.close()
                          c.drawPath(pa, p)
                      }
                      "gear" -> {
                          c.drawCircle(12f * s, 12f * s, 3.2f * s, p)
                          for (k in 0 until 8) {
                              val ang = Math.toRadians((k * 45).toDouble())
                              val ca = Math.cos(ang).toFloat()
                              val sa = Math.sin(ang).toFloat()
                              ln(12f + 6.5f * ca, 12f + 6.5f * sa, 12f + 9.5f * ca, 12f + 9.5f * sa)
                          }
                          c.drawCircle(12f * s, 12f * s, 6.5f * s, p)
                      }
                      "bolt" -> {
                          c.drawArc(RectF(3f * s, 5f * s, 21f * s, 23f * s), 180f, 180f, false, p)
                          ln(12f, 14f, 16f, 9f)
                      }
                  }
                  val d = BitmapDrawable(resources, bmp)
                  d.setFilterBitmap(true)
                  symCache[key] = d
                  return d
              }

