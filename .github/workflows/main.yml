              private fun addWindowCard(col: LinearLayout) {
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.background = cardBg(false)
                  card.setPadding(dpx(8), dpx(6), dpx(8), dpx(6))

                  val sl = TextView(this)
                  sl.textSize = 12f
                  sl.setTextColor(cText)
                  sl.text = "Pencere boyutu: %" + (pScale * 100f + 0.5f).toInt()
                  card.addView(sl)
                  val sb = SeekBar(this)
                  sb.max = 10
                  sb.progress = ((pScale - 0.6f) * 10f + 0.5f).toInt().coerceIn(0, 10)
                  sb.progressTintList = ColorStateList.valueOf(cAccent)
                  sb.thumbTintList = ColorStateList.valueOf(cCyan)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          sl.text = "Pencere boyutu: %" + (60 + p * 10)
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}

                      override fun onStopTrackingTouch(bar: SeekBar?) {
                          val v = 0.6f + (bar?.progress ?: 4) * 0.1f
                          prefs.edit().putFloat("pscale", v).commit()
                          lastScroll = menuSv?.scrollY ?: 0
                          rebuildPanel()
                      }
                  })
                  card.addView(sb)

                  val tl = TextView(this)
                  tl.textSize = 12f
                  tl.setTextColor(cText)
                  tl.setPadding(0, dpx(6), 0, 0)
                  val tp0 = ((1f - pAlpha()) * 100f + 0.5f).toInt()
                  tl.text = "Pencere şeffaflığı: %" + tp0
                  card.addView(tl)
                  val tb = SeekBar(this)
                  tb.max = 7
                  tb.progress = (tp0 / 10).coerceIn(0, 7)
                  tb.progressTintList = ColorStateList.valueOf(cAccent)
                  tb.thumbTintList = ColorStateList.valueOf(cCyan)
                  tb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          tl.text = "Pencere şeffaflığı: %" + (p * 10)
                          val a = 1f - p * 0.1f
                          panel?.alpha = a
                          prefs.edit().putFloat("palpha", a).commit()
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}

                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })
                  card.addView(tb)

                  card.addView(btnRow(listOf(
                      Pair("Varsayılan boyut ve şeffaflık", {
                          prefs.edit().remove("pscale").remove("palpha").commit()
                          lastScroll = menuSv?.scrollY ?: 0
                          rebuildPanel()
                      })
                  )))
                  col.addView(card, cardLp())
              }


