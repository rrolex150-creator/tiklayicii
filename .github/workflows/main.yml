              private fun dpx(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun shape(fill: Int, stroke: Int, rDp: Int, strokeDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dpx(rDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dpx(strokeDp), stroke)
                  return g
              }

