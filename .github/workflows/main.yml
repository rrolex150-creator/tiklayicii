                  col.addView(card, cardLp())
              }

              // İkon seçme ekranı: karakterin tüm becerileri kare ikonlar olarak
              private fun addSkillGrid(col: LinearLayout) {
                  if (selSk >= nSk) selSk = 0
                  val per = 5
                  var rowL: LinearLayout? = null
                  for (i in 0 until nSk) {
                      if (i % per == 0) {
                          val nr = LinearLayout(this)
                          nr.orientation = LinearLayout.HORIZONTAL
                          col.addView(nr, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                          rowL = nr
                      }
                      val r = rowL ?: continue
                      val on = skillOn[i]
                      val tile = FrameLayout(this)
                      tile.background = if (i == selSk) shape(0xFF2A1A0D.toInt(), cCyan, 9, 2)
                      else shape(0xFF1D1108.toInt(), if (on) cAccent else 0xFF5A3A12.toInt(), 9, 1)
                      val iv = ImageView(this)
                      iv.setImageDrawable(skillIcon(i))
                      iv.alpha = if (on) 1f else 0.5f
                      iv.setPadding(dpx(5), dpx(5), dpx(5), dpx(5))
                      tile.addView(iv, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                      val dot = View(this)
                      val dg = GradientDrawable()
                      dg.shape = GradientDrawable.OVAL
                      dg.setColor(if (bx[i] >= 0f) 0xFF6DD66D.toInt() else 0xFF4A3A22.toInt())
                      dot.background = dg
                      val dp0 = FrameLayout.LayoutParams(dpx(8), dpx(8), Gravity.TOP or Gravity.END)
                      dp0.topMargin = dpx(4)
                      dp0.rightMargin = dpx(4)
                      tile.addView(dot, dp0)
                      tile.setOnClickListener {
                          selSk = i
                          lastScroll = menuSv?.scrollY ?: 0
                          refreshMenu()
                      }
                      val p = LinearLayout.LayoutParams(0, dpx(50), 1f)
                      p.leftMargin = dpx(2)
                      p.rightMargin = dpx(2)
                      p.topMargin = dpx(3)
                      r.addView(tile, p)
                  }
                  val rem = nSk % per
                  val rr = rowL
                  if (rem != 0 && rr != null) {
                      for (k in rem until per) {
                          val sp = View(this)
                          val p = LinearLayout.LayoutParams(0, dpx(50), 1f)
                          rr.addView(sp, p)
                      }
                  }
              }

