name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK lisanslarini kabul et
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proj/app/src/main/java/com/benim/tiklayici
          mkdir -p proj/app/src/main/res/xml proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Tiklayici"
          include ':app'
          EOF

          cat > proj/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.benim.tiklayici'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.benim.tiklayici'
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tiklayici</string>
              <string name="aciklama">Oyun icin oto tiklayici</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/aciklama" />
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/Cfg.kt <<'EOF'
          package com.benim.tiklayici

          object Cfg {
              // ivl: kaç saniyede bir basılsın (0 = diğerleriyle sırayla)
              class Act(val name: String, val x: Float, val y: Float, val def: Boolean, val ivl: Int)

              const val TOPLA = 2
              const val KIRMIZI = 7

              // x,y = -1 ise konum henüz ayarlanmamıştır (menüden ayarlanır)
              val acts = listOf(
                  Act("Hedef seç", 0.953f, 0.580f, true, 0),
                  Act("Saldırı", 0.862f, 0.693f, true, 0),
                  Act("Eşya topla", 0.953f, 0.811f, true, 0),
                  Act("Hava Kılıcı (buff)", -1f, -1f, false, 60),
                  Act("Öfke (buff)", -1f, -1f, false, 60),
                  Act("Beceri 1", -1f, -1f, false, 0),
                  Act("Beceri 2", -1f, -1f, false, 0),
                  Act("Kırmızı iksir", 0.915f, 0.479f, false, 0),
                  Act("Mavi iksir", 0.862f, 0.460f, false, 0)
              )

              val mobs = listOf(
                  "Beyaz Yeminli Asker", "Beyaz Yeminli Okçu",
                  "Kırmızı Yeminli Asker", "Kırmızı Yeminli Okçu",
                  "Mavi Yeminli Asker", "Mavi Yeminli Okçu",
                  "Vahşi Köpek", "Kurt", "Boz Kurt", "Yaban Domuzu", "Kaplan", "Ayı", "Maymun",
                  "Hayalet", "İskelet", "Zombi", "Cadı", "Haydut", "Çöl Haydutu",
                  "Ork Savaşçısı", "Ork Okçusu", "Ork Şamanı", "Ork Lideri",
                  "Örümcek", "Zehirli Örümcek", "Örümcek Kraliçesi",
                  "Buz Golemi", "Yeti", "Kar Kurdu", "Ateş Golemi", "Ateş Ruhu",
                  "Şeytan", "Cehennem Köpeği", "Gölge Savaşçısı"
              )
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/MainActivity.kt <<'EOF'
          package com.benim.tiklayici

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val refreshers = ArrayList<() -> Unit>()
              private var saver: (() -> Unit)? = null

              override fun onResume() {
                  super.onResume()
                  refreshers.forEach { it() }
              }

              override fun onPause() {
                  saver?.invoke()
                  super.onPause()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("ayar", MODE_PRIVATE)
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()
                  val gold = 0xFFE0A526.toInt()
                  val bgColor = 0xFF14161B.toInt()
                  val cardColor = 0xFF1F232B.toInt()
                  val grey = 0xFF9AA0AA.toInt()
                  val green = 0xFF6FCF7F.toInt()
                  val orange = 0xFFE5A04B.toInt()
                  val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
                  val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

                  fun rounded(c: Int, r: Int = 14) = GradientDrawable().apply {
                      setColor(c)
                      cornerRadius = dp(r).toFloat()
                  }

                  val frame = FrameLayout(this)
                  val scrolls = ArrayList<ScrollView>()

                  fun newPage(): LinearLayout {
                      val inner = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(12), dp(4), dp(12), dp(16))
                      }
                      val sv = ScrollView(this).apply {
                          addView(inner)
                          visibility = View.GONE
                      }
                      frame.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
                      scrolls.add(sv)
                      return inner
                  }

                  fun card(parent: LinearLayout, title: String?): LinearLayout {
                      val c = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = rounded(cardColor)
                          setPadding(dp(14), dp(12), dp(14), dp(12))
                      }
                      val lp = LinearLayout.LayoutParams(MATCH, WRAP)
                      lp.setMargins(0, 0, 0, dp(10))
                      c.layoutParams = lp
                      if (title != null) {
                          c.addView(TextView(this).apply {
                              text = title
                              textSize = 14f
                              setTypeface(typeface, Typeface.BOLD)
                              setTextColor(gold)
                              setPadding(0, 0, 0, dp(6))
                          })
                      }
                      parent.addView(c)
                      return c
                  }

                  fun note(parent: LinearLayout, s: String) {
                      parent.addView(TextView(this).apply {
                          text = s
                          textSize = 13f
                          setTextColor(grey)
                          setPadding(dp(2), dp(2), dp(2), dp(10))
                      })
                  }

                  fun sw(parent: LinearLayout, label: String, checked: Boolean): Switch {
                      val s = Switch(this).apply {
                          text = label
                          setTextColor(Color.WHITE)
                          textSize = 16f
                          isChecked = checked
                          setPadding(0, dp(6), 0, dp(6))
                      }
                      parent.addView(s)
                      return s
                  }

                  fun numField(parent: LinearLayout, label: String, key: String, def: Int): EditText {
                      parent.addView(TextView(this).apply {
                          text = label
                          textSize = 13f
                          setTextColor(grey)
                          setPadding(0, dp(8), 0, 0)
                      })
                      val e = EditText(this).apply {
                          inputType = InputType.TYPE_CLASS_NUMBER
                          setTextColor(Color.WHITE)
                          setText(prefs.getInt(key, def).toString())
                      }
                      parent.addView(e)
                      return e
                  }

                  // ---------- SAYFA 1: ANA ----------
                  val pAna = newPage()

                  val stCard = card(pAna, "DURUM")
                  val statusTv = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.WHITE)
                  }
                  stCard.addView(statusTv)
                  refreshers.add {
                      val on = ClickService.inst != null
                      statusTv.text = if (on) "● Servis açık. Oyunda yüzen panel görünür." else "○ Servis kapalı. Aşağıdaki düğmeden Erişilebilirlik'i aç."
                      statusTv.setTextColor(if (on) green else orange)
                  }

                  val modCard = card(pAna, "MOD")
                  val rg = RadioGroup(this).apply { orientation = LinearLayout.VERTICAL }
                  val rbClick = RadioButton(this).apply {
                      id = View.generateViewId()
                      text = "Tıklama modu: açık tuşlara sırayla basar"
                      setTextColor(Color.WHITE)
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val rbFarm = RadioButton(this).apply {
                      id = View.generateViewId()
                      text = "İsimle farm: seçili canavarı bulur, keser, eşya toplar (Android 11+)"
                      setTextColor(Color.WHITE)
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  rg.addView(rbClick)
                  rg.addView(rbFarm)
                  if (prefs.getBoolean("farm", false)) rbFarm.isChecked = true else rbClick.isChecked = true
                  modCard.addView(rg)

                  val howCard = card(pAna, "NASIL KULLANILIR")
                  note(howCard, "1) Erişilebilirlik'ten Tiklayici servisini aç.\n2) BECERİ sekmesinde tuşları aç ve her birinin konumunu 📍 ile oyun ekranında göster.\n3) CANAVAR sekmesinde kesilecekleri seç.\n4) Oyuna geç, yüzen panelden ▶ ile başlat, ■ ile durdur.")

                  pAna.addView(Button(this).apply {
                      text = "Erişilebilirlik Ayarları"
                      setTextColor(Color.BLACK)
                      background = rounded(gold, 12)
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  // ---------- SAYFA 2: BECERİ ----------
                  val pSkill = newPage()
                  note(pSkill, "Her tuş için: aç/kapat, kaç saniyede bir basılacağı ve ekrandaki yeri. 0 saniye = diğer tuşlarla sırayla basılır. Hava Kılıcı ve Öfke gibi buff'lar için süre yaz (örn. 60), süre dolunca yeniden basılır. Konumu olmayan tuşa basılmaz.")
                  val swList = ArrayList<Switch>()
                  val ivlList = ArrayList<EditText>()
                  for (k in Cfg.acts.indices) {
                      val a = Cfg.acts[k]
                      val c = card(pSkill, null)
                      swList.add(sw(c, a.name, prefs.getBoolean("a$k", a.def)))

                      val row1 = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      row1.addView(TextView(this).apply {
                          text = "Kaç saniyede bir (0 = sırayla)"
                          textSize = 13f
                          setTextColor(grey)
                      }, LinearLayout.LayoutParams(0, WRAP, 1f))
                      val e = EditText(this).apply {
                          inputType = InputType.TYPE_CLASS_NUMBER
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setText(prefs.getInt("i$k", a.ivl).toString())
                      }
                      row1.addView(e, LinearLayout.LayoutParams(dp(80), WRAP))
                      ivlList.add(e)
                      c.addView(row1)

                      val row2 = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      val stv = TextView(this).apply { textSize = 13f }
                      row2.addView(stv, LinearLayout.LayoutParams(0, WRAP, 1f))
                      refreshers.add {
                          val ok = prefs.getFloat("x$k", a.x) >= 0f
                          stv.text = if (ok) "✔ konum ayarlı" else "⚠ konum yok"
                          stv.setTextColor(if (ok) green else orange)
                      }
                      row2.addView(Button(this).apply {
                          text = "📍 Konumu ayarla"
                          setOnClickListener {
                              saver?.invoke()
                              val svc = ClickService.inst
                              if (svc == null) {
                                  Toast.makeText(this@MainActivity, "Önce erişilebilirlik servisini aç", Toast.LENGTH_LONG).show()
                              } else {
                                  svc.calibrate(k)
                                  moveTaskToBack(true)
                              }
                          }
                      })
                      c.addView(row2)
                  }
                  pSkill.addView(Button(this).apply {
                      text = "Konumları varsayılana döndür"
                      setOnClickListener {
                          val e = prefs.edit()
                          for (k in Cfg.acts.indices) {
                              e.remove("x$k")
                              e.remove("y$k")
                          }
                          e.apply()
                          refreshers.forEach { it() }
                          Toast.makeText(this@MainActivity, "Konumlar sıfırlandı", Toast.LENGTH_SHORT).show()
                      }
                  })

                  // ---------- SAYFA 3: CANAVAR ----------
                  val pMob = newPage()
                  val mobCard = card(pMob, "KESİLECEK CANAVARLAR")
                  note(mobCard, "İsimle farm modunda sadece seçililer kesilir.")
                  val chosen = (prefs.getString("secili", "Beyaz Yeminli Asker") ?: "")
                      .split(",").map { it.trim() }.toSet()
                  val mobBoxes = Cfg.mobs.map { nm ->
                      CheckBox(this).apply {
                          text = nm
                          setTextColor(Color.WHITE)
                          textSize = 16f
                          setPadding(0, dp(4), 0, dp(4))
                          isChecked = nm in chosen
                      }
                  }
                  val mrow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  mrow.addView(Button(this).apply {
                      text = "Hepsini seç"
                      setOnClickListener { mobBoxes.forEach { it.isChecked = true } }
                  })
                  mrow.addView(Button(this).apply {
                      text = "Temizle"
                      setOnClickListener { mobBoxes.forEach { it.isChecked = false } }
                  })
                  mobCard.addView(mrow)
                  mobBoxes.forEach { mobCard.addView(it) }
                  val ozelCard = card(pMob, "KENDİN EKLE")
                  note(ozelCard, "Listede olmayan canavar isimlerini virgülle ayırarak yaz.")
                  val ozel = EditText(this).apply {
                      setTextColor(Color.WHITE)
                      hint = "Örn: Beyaz Yeminli Asker, Ork Savaşçısı"
                      setHintTextColor(grey)
                      setText(prefs.getString("ozel", ""))
                  }
                  ozelCard.addView(ozel)

                  // ---------- SAYFA 4: AYAR ----------
                  val pSet = newPage()
                  val timeCard = card(pSet, "ZAMAN")
                  val eSure = numField(timeCard, "Süre sınırı (dakika, 0 = sınırsız)", "sure", 0)
                  val eGecikme = numField(timeCard, "Başlama gecikmesi (saniye)", "gecikme", 3)
                  val eMin = numField(timeCard, "Tıklama aralığı en az (milisaniye)", "amin", 400)
                  val eMax = numField(timeCard, "Tıklama aralığı en çok (milisaniye)", "amax", 700)
                  val hpCard = card(pSet, "CAN (HP)")
                  val eHp = numField(hpCard, "HP bu yüzdenin altına düşünce kırmızı iksir bas (0 = kapalı). İsimle farm modunda ve Android 11+ ile çalışır, kırmızı iksirin konumu ayarlı olmalı.", "hp", 0)

                  // ---------- ÜST BAŞLIK ve ALT SEKMELER ----------
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(4), dp(14), dp(8))
                  }
                  header.addView(TextView(this).apply {
                      text = "⚔ Metin2 Farm Botu"
                      textSize = 22f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(gold)
                  }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  header.addView(Button(this).apply {
                      text = "KAYDET"
                      setTextColor(Color.BLACK)
                      background = rounded(gold, 10)
                      setOnClickListener {
                          saver?.invoke()
                          Toast.makeText(this@MainActivity, "Kaydedildi", Toast.LENGTH_SHORT).show()
                      }
                  })

                  val tabBtns = ArrayList<Button>()
                  fun select(idx: Int) {
                      for (k in scrolls.indices) scrolls[k].visibility = if (k == idx) View.VISIBLE else View.GONE
                      for (k in tabBtns.indices) {
                          tabBtns[k].background = rounded(if (k == idx) gold else cardColor, 10)
                          tabBtns[k].setTextColor(if (k == idx) Color.BLACK else Color.WHITE)
                      }
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(0xFF0E1013.toInt())
                      setPadding(dp(4), dp(6), dp(4), dp(10))
                  }
                  val titles = listOf("ANA", "BECERİ", "CANAVAR", "AYAR")
                  for (k in titles.indices) {
                      val b = Button(this).apply {
                          text = titles[k]
                          textSize = 12f
                          setOnClickListener { select(k) }
                      }
                      tabBtns.add(b)
                      val lp = LinearLayout.LayoutParams(0, dp(46), 1f)
                      lp.setMargins(dp(3), 0, dp(3), 0)
                      bar.addView(b, lp)
                  }

                  val main = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgColor)
                      setPadding(0, dp(32), 0, 0)
                  }
                  main.addView(header)
                  main.addView(frame, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  main.addView(bar)
                  setContentView(main)
                  select(0)

                  saver = {
                      val e = prefs.edit()
                      e.putBoolean("farm", rbFarm.isChecked)
                      for (k in Cfg.acts.indices) {
                          e.putBoolean("a$k", swList[k].isChecked)
                          e.putInt("i$k", ivlList[k].text.toString().toIntOrNull() ?: Cfg.acts[k].ivl)
                      }
                      e.putInt("sure", eSure.text.toString().toIntOrNull() ?: 0)
                      e.putInt("gecikme", eGecikme.text.toString().toIntOrNull() ?: 3)
                      e.putInt("amin", eMin.text.toString().toIntOrNull() ?: 400)
                      e.putInt("amax", eMax.text.toString().toIntOrNull() ?: 700)
                      e.putInt("hp", eHp.text.toString().toIntOrNull() ?: 0)
                      e.putString(
                          "secili",
                          Cfg.mobs.filterIndexed { k, _ -> mobBoxes[k].isChecked }.joinToString(",")
                      )
                      e.putString("ozel", ozel.text.toString())
                      e.apply()
                  }
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/ClickService.kt <<'EOF'
          package com.benim.tiklayici

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityService.ScreenshotResult
          import android.accessibilityservice.AccessibilityService.TakeScreenshotCallback
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.concurrent.Executor

          class ClickService : AccessibilityService() {

              companion object {
                  var inst: ClickService? = null
              }

              private val acts = Cfg.acts
              private val n = Cfg.acts.size
              private val handler = Handler(Looper.getMainLooper())
              private val exec = Executor { r -> handler.post(r) }
              private val enabled = BooleanArray(n)
              private val px = FloatArray(n)
              private val py = FloatArray(n)
              private val ivl = IntArray(n)
              private val last = LongArray(n)
              private val recognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }
              private lateinit var prefs: SharedPreferences

              var running = false
              private var i = 0
              private var farmOn = false
              private var attackTicks = 0
              private var busy = false
              private var aMin = 400
              private var aMax = 700
              private var limitMs = 0L
              private var delayMs = 3000L
              private var startAt = 0L
              private var hpPct = 0
              private var lastPotion = 0L
              private var wanted: List<String> = emptyList()

              private var wm: WindowManager? = null
              private var panel: View? = null
              private var startBtn: Button? = null
              private var timeText: TextView? = null

              private fun norm(s: String): String {
                  return s.lowercase()
                      .replace('ı', 'i').replace('ş', 's').replace('ç', 'c')
                      .replace('ğ', 'g').replace('ö', 'o').replace('ü', 'u')
                      .filter { it.isLetter() }
              }

              // Menüde kaydedilen ayarları oku
              private fun loadCfg() {
                  farmOn = prefs.getBoolean("farm", false)
                  for (k in 0 until n) {
                      val a = acts[k]
                      enabled[k] = prefs.getBoolean("a$k", a.def)
                      px[k] = prefs.getFloat("x$k", a.x)
                      py[k] = prefs.getFloat("y$k", a.y)
                      ivl[k] = prefs.getInt("i$k", a.ivl)
                      last[k] = 0L
                  }
                  aMin = prefs.getInt("amin", 400).coerceAtLeast(50)
                  aMax = prefs.getInt("amax", 700).coerceAtLeast(aMin)
                  limitMs = prefs.getInt("sure", 0).coerceAtLeast(0) * 60_000L
                  delayMs = prefs.getInt("gecikme", 3).coerceAtLeast(0) * 1000L
                  hpPct = prefs.getInt("hp", 0).coerceIn(0, 95)
                  val secili = prefs.getString("secili", "Beyaz Yeminli Asker") ?: ""
                  val ozel = prefs.getString("ozel", "") ?: ""
                  wanted = (secili + "," + ozel).split(",").map { norm(it) }.filter { it.isNotEmpty() }
              }

              private fun tapPx(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  dispatchGesture(g, null, null)
              }

              private fun tapAct(k: Int) {
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm?.defaultDisplay?.getRealMetrics(m)
                  tapPx(px[k] * m.widthPixels, py[k] * m.heightPixels)
              }

              // Sırayla basılacak tuşlar (süresi 0 olanlar, konumu ayarlı olanlar)
              private fun rotation(skipTarget: Boolean): List<Int> {
                  return (0 until n).filter {
                      enabled[it] && ivl[it] == 0 && px[it] >= 0f &&
                          it != Cfg.KIRMIZI && !(skipTarget && it == 0)
                  }
              }

              // Süresi dolan buff / zamanlı tuşa bas
              private fun fireTimed(): Boolean {
                  val now = SystemClock.elapsedRealtime()
                  for (k in 0 until n) {
                      if (enabled[k] && ivl[k] > 0 && px[k] >= 0f && now - last[k] >= ivl[k] * 1000L) {
                          last[k] = now
                          tapAct(k)
                          return true
                      }
                  }
                  return false
              }

              // HP çubuğunda eşik noktasında kırmızı dolgu yoksa can düşük demektir
              private fun hpLow(b: Bitmap): Boolean {
                  val xr = 0.103f + (0.227f - 0.103f) * hpPct / 100f
                  val x = (b.width * xr).toInt().coerceIn(0, b.width - 1)
                  for (yy in floatArrayOf(0.040f, 0.046f, 0.052f)) {
                      val y = (b.height * yy).toInt().coerceIn(0, b.height - 1)
                      val c = b.getPixel(x, y)
                      if (Color.red(c) > 140 && Color.green(c) < 100 && Color.blue(c) < 100) return false
                  }
                  return true
              }

              // Ekrandaki yazılardan seçili isimlerden birini bul, en yakın olana dokun
              private fun found(t: Text, w: Int, h: Int) {
                  var best: Rect? = null
                  var bestD = Float.MAX_VALUE
                  for (b in t.textBlocks) {
                      for (l in b.lines) {
                          val box = l.boundingBox ?: continue
                          val cx = box.centerX().toFloat()
                          val cy = box.centerY().toFloat()
                          if (cy < h * 0.12f) continue
                          if (cy > h * 0.80f && cx < w * 0.75f) continue
                          if (cx > w * 0.68f && cy > h * 0.38f) continue
                          val nm = norm(l.text)
                          if (wanted.none { nm.contains(it) }) continue
                          val dx = cx - w * 0.525f
                          val dy = cy - h * 0.48f
                          val dd = dx * dx + dy * dy
                          if (dd < bestD) {
                              bestD = dd
                              best = box
                          }
                      }
                  }
                  val bx = best
                  if (bx != null) {
                      tapPx(bx.centerX().toFloat(), bx.bottom + h * 0.05f)
                      attackTicks = 7
                  } else if (enabled[Cfg.TOPLA] && px[Cfg.TOPLA] >= 0f) {
                      tapAct(Cfg.TOPLA)
                  }
              }

              private fun farmStep() {
                  if (attackTicks > 0) {
                      attackTicks--
                      val on = rotation(true)
                      if (on.isNotEmpty()) tapAct(on[i++ % on.size])
                      return
                  }
                  if (busy) return
                  busy = true
                  takeScreenshot(Display.DEFAULT_DISPLAY, exec, object : TakeScreenshotCallback {
                      override fun onSuccess(r: ScreenshotResult) {
                          val hb = r.hardwareBuffer
                          val bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                              ?.copy(Bitmap.Config.ARGB_8888, false)
                          hb.close()
                          if (bmp == null) {
                              busy = false
                              return
                          }
                          val now = SystemClock.elapsedRealtime()
                          if (hpPct > 0 && px[Cfg.KIRMIZI] >= 0f && now - lastPotion > 4000 && hpLow(bmp)) {
                              lastPotion = now
                              tapAct(Cfg.KIRMIZI)
                          }
                          recognizer.process(InputImage.fromBitmap(bmp, 0))
                              .addOnSuccessListener { t ->
                                  found(t, bmp.width, bmp.height)
                                  busy = false
                              }
                              .addOnFailureListener { busy = false }
                      }

                      override fun onFailure(code: Int) {
                          busy = false
                      }
                  })
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      if (limitMs > 0 && SystemClock.elapsedRealtime() - startAt >= limitMs) {
                          stopAll()
                          return
                      }
                      if (!fireTimed()) {
                          if (farmOn && Build.VERSION.SDK_INT >= 30) {
                              farmStep()
                          } else {
                              val on = rotation(false)
                              if (on.isNotEmpty()) tapAct(on[i++ % on.size])
                          }
                      }
                      handler.postDelayed(this, (aMin..aMax).random().toLong())
                  }
              }

              // Süre sayacını her saniye güncelle
              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      if (now < startAt) {
                          timeText?.text = "başlıyor"
                      } else {
                          val s = if (limitMs > 0) (limitMs - (now - startAt)) / 1000 else (now - startAt) / 1000
                          timeText?.text = "%02d:%02d".format(s / 60, s % 60)
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun stopAll() {
                  running = false
                  handler.removeCallbacks(loop)
                  handler.removeCallbacks(ticker)
                  startBtn?.text = "▶"
                  timeText?.text = ""
              }

              fun toggle() {
                  if (running) {
                      stopAll()
                      return
                  }
                  loadCfg()
                  running = true
                  attackTicks = 0
                  busy = false
                  startAt = SystemClock.elapsedRealtime() + delayMs
                  startBtn?.text = "■"
                  handler.postDelayed(loop, delayMs)
                  handler.post(ticker)
              }

              // Menüden çağrılır: ekranda bir tuşa dokunarak konumunu kaydet
              fun calibrate(k: Int) {
                  val w = wm ?: return
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  w.defaultDisplay.getRealMetrics(m)
                  val d = resources.displayMetrics.density

                  val layer = FrameLayout(this)
                  layer.setBackgroundColor(0x55000000)
                  val msg = TextView(this).apply {
                      text = acts[k].name + " tuşunun tam üstüne dokun"
                      textSize = 20f
                      setTextColor(Color.YELLOW)
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xDD000000.toInt())
                      setPadding((16 * d).toInt(), (40 * d).toInt(), (16 * d).toInt(), (16 * d).toInt())
                  }
                  layer.addView(
                      msg,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                      )
                  )
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  layer.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_UP) {
                          val rx = (e.rawX / m.widthPixels).coerceIn(0f, 1f)
                          val ry = (e.rawY / m.heightPixels).coerceIn(0f, 1f)
                          prefs.edit().putFloat("x$k", rx).putFloat("y$k", ry).apply()
                          px[k] = rx
                          py[k] = ry
                          w.removeView(layer)
                          Toast.makeText(this, acts[k].name + " konumu kaydedildi", Toast.LENGTH_SHORT).show()
                      }
                      true
                  }
                  w.addView(layer, lp)
              }

              override fun onServiceConnected() {
                  inst = this
                  prefs = getSharedPreferences("ayar", MODE_PRIVATE)

                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(0xCC202020.toInt())
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                  }
                  val handle = TextView(this).apply {
                      text = "✥"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      setPadding(dp(6), 0, dp(10), 0)
                  }
                  val sBtn = Button(this).apply { text = "▶" }
                  startBtn = sBtn
                  sBtn.setOnClickListener { toggle() }
                  val gear = Button(this).apply { text = "⚙" }
                  gear.setOnClickListener {
                      val it2 = Intent(this, MainActivity::class.java)
                      it2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(it2)
                  }
                  val tt = TextView(this).apply {
                      textSize = 14f
                      setTextColor(Color.YELLOW)
                      setPadding(dp(8), 0, dp(4), 0)
                  }
                  timeText = tt

                  box.addView(handle)
                  box.addView(sBtn, LinearLayout.LayoutParams(dp(56), dp(48)))
                  box.addView(gear, LinearLayout.LayoutParams(dp(56), dp(48)))
                  box.addView(tt)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(60)
                      y = dp(80)
                  }

                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  handle.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          lp.x = ox + (e.rawX - sx).toInt()
                          lp.y = oy + (e.rawY - sy).toInt()
                          w.updateViewLayout(box, lp)
                      }
                      true
                  }

                  w.addView(box, lp)
                  panel = box
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  stopAll()
              }

              override fun onDestroy() {
                  stopAll()
                  inst = null
                  panel?.let { wm?.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
