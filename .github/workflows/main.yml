name: Build Oto Av ESP APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

# Android SDK, Gradle runner ortamında hazırdır; setup-android adımı kaldırıldı.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proj/app/src/main/java/com/benim/otoav
          mkdir -p proj/app/src/main/res/xml proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OtoAvESP"
          include ':app'
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.benim.otoav'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.benim.otoav'
                  minSdk 30
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Oto Av ESP</string>
              <string name="aciklama">Yüzen oto av paneli ve ekran tabanlı canavar algılama</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101116</item>
                  <item name="android:navigationBarColor">#101116</item>
              </style>
          </resources>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/aciklama"/>
          EOF

          cat > proj/app/src/main/java/com/benim/otoav/MainActivity.kt <<'EOF'
          package com.benim.otoav

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 70, 40, 40)
                  }

                  root.addView(TextView(this).apply {
                      text = "OTO AV ESP\\n\\n1) Erişilebilirlik servisini aç.\\n2) Oto Av paneli oyunun üzerinde yüzer.\\n3) Canavar menüsünden isimleri seç.\\n4) Başlat'a bas."
                      textSize = 19f
                  })

                  root.addView(Button(this).apply {
                      text = "Erişilebilirlik Ayarlarını Aç"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  root.addView(TextView(this).apply {
                      text = "\\nNot: ESP, ekran görüntüsündeki kırmızı canavar isimlerini OCR ile arar. Oyun arayüzü değişirse koordinat kalibrasyonu gerekebilir."
                      textSize = 14f
                  })

                  setContentView(root)
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/otoav/ClickService.kt <<'EOF'
          package com.benim.otoav

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.*
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class ClickService : AccessibilityService() {

              data class Monster(val name: String, val x: Float, val y: Float)
              data class Skill(
                  val name: String,
                  var x: Float,
                  var y: Float,
                  var cooldownMs: Long,
                  var enabled: Boolean = false,
                  var nextAt: Long = 0L
              )

              private val handler = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private var panel: View? = null
              private var running = false
              private var espEnabled = true
              private var attackEnabled = true
              private var lootEnabled = false
              private var selectedNames = linkedSetOf(
                  "Beyaz Yeminli Asker",
                  "Beyaz Yeminli Okçu"
              )

              // Ekran görüntüsündeki oyun butonları için oranlar.
              private val attackX = 0.862f
              private val attackY = 0.693f
              private val lootX = 0.953f
              private val lootY = 0.811f

              // Görseldeki iki buff için başlangıç koordinatları.
              // Kullanıcı menüden değiştirebilir.
              private val skills = mutableListOf(
                  Skill("Hava", 0.715f, 0.648f, 30_000L, false),
                  Skill("Öfke", 0.727f, 0.560f, 45_000L, false)
              )

              private var statusText: TextView? = null
              private var espText: TextView? = null
              private var menu: LinearLayout? = null
              private var lastTarget: Monster? = null
              private var lastScan = 0L
              private var scanBusy = false

              private fun screenMetrics(): DisplayMetrics {
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm?.defaultDisplay?.getRealMetrics(m)
                  return m
              }

              private fun tapXY(nx: Float, ny: Float) {
                  val m = screenMetrics()
                  val path = Path().apply {
                      moveTo(nx.coerceIn(0f, 1f) * m.widthPixels,
                             ny.coerceIn(0f, 1f) * m.heightPixels)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 55))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun tapSkill(skill: Skill) {
                  tapXY(skill.x, skill.y)
                  skill.nextAt = System.currentTimeMillis() + skill.cooldownMs
              }

              private fun normalize(s: String): String =
                  s.lowercase(Locale("tr", "TR"))
                      .replace("ı", "i")
                      .replace("ş", "s")
                      .replace("ğ", "g")
                      .replace("ü", "u")
                      .replace("ö", "o")
                      .replace("ç", "c")
                      .replace(Regex("[^a-z0-9 ]"), "")
                      .replace(Regex("\\s+"), " ")
                      .trim()

              private fun matchesSelected(text: String): Boolean {
                  val n = normalize(text)
                  return selectedNames.any { wanted ->
                      val w = normalize(wanted)
                      n == w || n.contains(w) || w.contains(n)
                  }
              }

              private fun captureAndScan() {
                  if (!running || !espEnabled || scanBusy) return
                  val now = System.currentTimeMillis()
                  if (now - lastScan < 350L) return
                  lastScan = now
                  scanBusy = true

                  takeScreenshot(
                      android.view.Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              try {
                                  val hardware = result.hardwareBuffer
                                  val bitmap = Bitmap.wrapHardwareBuffer(hardware, result.colorSpace)
                                  hardware.close()
                                  if (bitmap != null) {
                                      recognize(bitmap)
                                  } else {
                                      scanBusy = false
                                  }
                              } catch (_: Throwable) {
                                  scanBusy = false
                              }
                          }

                          override fun onFailure(errorCode: Int) {
                              scanBusy = false
                          }
                      }
                  )
              }

              private fun recognize(bitmap: Bitmap) {
                  val image = InputImage.fromBitmap(bitmap, 0)
                  TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                      .process(image)
                      .addOnSuccessListener { result ->
                          val found = ArrayList<Monster>()

                          for (block in result.textBlocks) {
                              for (line in block.lines) {
                                  val t = line.text.trim()
                                  if (!matchesSelected(t)) continue

                                  val r = line.boundingBox ?: continue
                                  val cx = (r.left + r.right) / 2f / bitmap.width
                                  // İsim etiketi karakterin üstünde; saldırı hedefi için etiketin
                                  // biraz altını kullanıyoruz.
                                  val cy = min(0.92f, (r.bottom + max(28, r.height() * 2)) / bitmap.height.toFloat())

                                  // Kırmızı etiket kontrolü: seçilen isim gerçekten kırmızı
                                  // yazı bölgesine denk geliyorsa kabul et.
                                  if (isMostlyRed(bitmap, r.left, r.top, r.right, r.bottom)) {
                                      found.add(Monster(t, cx, cy))
                                  }
                              }
                          }

                          val target = nearestToCenter(found)
                          lastTarget = target
                          espText?.text = if (target != null)
                              "ESP: ${target.name}\\nHedef: %.2f / %.2f".format(target.x, target.y)
                          else
                              "ESP: hedef yok"

                          if (running && attackEnabled && target != null) {
                              // Hedefi seçip saldırı butonuna basma döngüsü.
                              tapXY(target.x, target.y)
                              handler.postDelayed({
                                  if (running && lastTarget === target) tapXY(attackX, attackY)
                              }, 90L)
                          }

                          scanBusy = false
                      }
                      .addOnFailureListener {
                          scanBusy = false
                      }
                      .addOnCompleteListener {
                          bitmap.recycle()
                      }
              }

              private fun isMostlyRed(bitmap: Bitmap, l0: Int, t0: Int, r0: Int, b0: Int): Boolean {
                  val l = max(0, l0)
                  val t = max(0, t0)
                  val r = min(bitmap.width - 1, r0)
                  val b = min(bitmap.height - 1, b0)
                  if (r <= l || b <= t) return false

                  var red = 0
                  var samples = 0
                  val sx = max(1, (r - l) / 20)
                  val sy = max(1, (b - t) / 4)

                  var y = t
                  while (y <= b) {
                      var x = l
                      while (x <= r) {
                          val c = bitmap.getPixel(x, y)
                          val rr = Color.red(c)
                          val gg = Color.green(c)
                          val bb = Color.blue(c)
                          if (rr > 110 && rr > gg * 1.35 && rr > bb * 1.35) red++
                          samples++
                          x += sx
                      }
                      y += sy
                  }
                  return samples > 0 && red.toFloat() / samples > 0.18f
              }

              private fun nearestToCenter(list: List<Monster>): Monster? {
                  if (list.isEmpty()) return null
                  return list.minByOrNull {
                      val dx = it.x - 0.5f
                      val dy = it.y - 0.48f
                      dx * dx + dy * dy
                  }
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return

                      captureAndScan()

                      val now = System.currentTimeMillis()
                      for (s in skills) {
                          if (s.enabled && now >= s.nextAt) {
                              tapSkill(s)
                          }
                      }

                      if (lootEnabled && lastTarget != null) {
                          tapXY(lootX, lootY)
                      }

                      updateStatus()
                      handler.postDelayed(this, 250L)
                  }
              }

              private fun updateStatus() {
                  val now = System.currentTimeMillis()
                  val hava = skills[0]
                  val ofke = skills[1]

                  fun left(s: Skill): String =
                      if (!s.enabled || s.nextAt <= now) "HAZIR"
                      else "${((s.nextAt - now) / 1000L) + 1}s"

                  statusText?.text =
                      "OTO AV: ${if (running) "AKTİF" else "KAPALI"}\\n" +
                      "Hava: ${left(hava)}   Öfke: ${left(ofke)}"
              }

              private fun toggleRun() {
                  running = !running
                  if (running) {
                      for (s in skills) if (s.enabled && s.nextAt == 0L) s.nextAt = 0L
                      handler.removeCallbacks(loop)
                      handler.post(loop)
                  } else {
                      handler.removeCallbacks(loop)
                  }
                  updateStatus()
              }

              private fun addMonsterRow(container: LinearLayout, name: String) {
                  val cb = CheckBox(this).apply {
                      text = name
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      isChecked = selectedNames.contains(name)
                      setOnCheckedChangeListener { _, checked ->
                          if (checked) selectedNames.add(name) else selectedNames.remove(name)
                      }
                  }
                  container.addView(cb)
              }

              private fun buildPanel() {
                  val density = resources.displayMetrics.density
                  fun dp(v: Int) = (v * density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      setBackgroundColor(0xE61A1B21.toInt())
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val logo = TextView(this).apply {
                      text = "⚔\\nOA"
                      gravity = Gravity.CENTER
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(0xFF8B5CF6.toInt())
                      setPadding(dp(7), dp(2), dp(7), dp(2))
                  }

                  val title = TextView(this).apply {
                      text = "  OTO AV"
                      textSize = 17f
                      setTextColor(Color.WHITE)
                  }

                  val start = Button(this).apply {
                      text = "▶"
                      setOnClickListener { toggleRun() }
                  }

                  val menuButton = Button(this).apply {
                      text = "☰"
                  }

                  header.addView(logo, LinearLayout.LayoutParams(dp(46), dp(46)))
                  header.addView(title, LinearLayout.LayoutParams(0, dp(46), 1f))
                  header.addView(start, LinearLayout.LayoutParams(dp(52), dp(46)))
                  header.addView(menuButton, LinearLayout.LayoutParams(dp(52), dp(46)))
                  root.addView(header)

                  statusText = TextView(this).apply {
                      textSize = 12f
                      setTextColor(0xFFD8D8E2.toInt())
                      setPadding(0, dp(5), 0, dp(4))
                  }
                  root.addView(statusText)

                  espText = TextView(this).apply {
                      text = "ESP: hedef yok"
                      textSize = 11f
                      setTextColor(0xFF7CF7A3.toInt())
                  }
                  root.addView(espText)

                  val menuBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }

                  val esp = CheckBox(this).apply {
                      text = "Canavar ESP"
                      setTextColor(Color.WHITE)
                      isChecked = espEnabled
                      setOnCheckedChangeListener { _, c -> espEnabled = c }
                  }
                  val atk = CheckBox(this).apply {
                      text = "Seçili canavara otomatik saldır"
                      setTextColor(Color.WHITE)
                      isChecked = attackEnabled
                      setOnCheckedChangeListener { _, c -> attackEnabled = c }
                  }
                  val loot = CheckBox(this).apply {
                      text = "Eşya toplama"
                      setTextColor(Color.WHITE)
                      isChecked = lootEnabled
                      setOnCheckedChangeListener { _, c -> lootEnabled = c }
                  }

                  menuBox.addView(TextView(this).apply {
                      text = "CANAVARLAR"
                      textSize = 13f
                      setTextColor(0xFFFFD166.toInt())
                  })
                  addMonsterRow(menuBox, "Beyaz Yeminli Asker")
                  addMonsterRow(menuBox, "Beyaz Yeminli Okçu")
                  addMonsterRow(menuBox, "Beyaz Yeminli Okçu (uzak)")
                  addMonsterRow(menuBox, "Özel canavar")

                  menuBox.addView(esp)
                  menuBox.addView(atk)
                  menuBox.addView(loot)

                  menuBox.addView(TextView(this).apply {
                      text = "BECERİ TAKİBİ"
                      textSize = 13f
                      setTextColor(0xFFFFD166.toInt())
                  })

                  for (s in skills) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      val cb = CheckBox(this).apply {
                          text = s.name
                          setTextColor(Color.WHITE)
                          isChecked = s.enabled
                          setOnCheckedChangeListener { _, c ->
                              s.enabled = c
                              if (!c) s.nextAt = 0L
                          }
                      }
                      val sec = EditText(this).apply {
                          hint = "sn"
                          setText((s.cooldownMs / 1000L).toString())
                          setTextColor(Color.WHITE)
                          setHintTextColor(0xFF999999.toInt())
                          inputType = android.text.InputType.TYPE_CLASS_NUMBER
                          setSelectAllOnFocus(true)
                      }
                      val apply = Button(this).apply {
                          text = "Süre"
                          setOnClickListener {
                              val seconds = sec.text.toString().toLongOrNull()?.coerceIn(1L, 3600L) ?: 30L
                              s.cooldownMs = seconds * 1000L
                              s.nextAt = 0L
                          }
                      }
                      row.addView(cb, LinearLayout.LayoutParams(0, dp(45), 1f))
                      row.addView(sec, LinearLayout.LayoutParams(dp(65), dp(45)))
                      row.addView(apply, LinearLayout.LayoutParams(dp(70), dp(45)))
                      menuBox.addView(row)
                  }

                  root.addView(menuBox)

                  menuButton.setOnClickListener {
                      menuBox.visibility =
                          if (menuBox.visibility == View.GONE) View.VISIBLE else View.GONE
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      android.graphics.PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(35)
                      y = dp(90)
                  }

                  var downX = 0f
                  var downY = 0f
                  var oldX = 0
                  var oldY = 0

                  logo.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX
                              downY = event.rawY
                              oldX = lp.x
                              oldY = lp.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = oldX + (event.rawX - downX).toInt()
                              lp.y = oldY + (event.rawY - downY).toInt()
                              wm?.updateViewLayout(root, lp)
                              true
                          }
                          else -> true
                      }
                  }

                  wm?.addView(root, lp)
                  panel = root
                  updateStatus()
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  buildPanel()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  running = false
                  handler.removeCallbacks(loop)
              }

              override fun onDestroy() {
                  running = false
                  handler.removeCallbacks(loop)
                  panel?.let { runCatching { wm?.removeView(it) } }
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: oto-av-esp-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
