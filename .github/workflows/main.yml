                  menu.setPadding(dp(8), 0, 0, 0)

                  val tabs = hrow()
                  val pageHost = FrameLayout(this)
                  val pages = listOf(buildKeysPage(), buildTargetPage(), buildSettingsPage())
                  val tabNames = listOf("Tuşlar", "Hedef", "Ayar")
                  val tabViews = ArrayList<TextView>()

                  fun showPage(i: Int) {
                      for (k in pages.indices) {
                          pages[k].visibility = if (k == i) View.VISIBLE else View.GONE
                          setChip(tabViews[k], k == i)
                      }
                  }

                  for (k in tabNames.indices) {
                      val t = chip(tabNames[k], false) { showPage(k) }
                      tabViews.add(t)
                      tabs.addView(t, rowLp())
                  }
                  for (pg in pages) {
                      pageHost.addView(pg, FrameLayout.LayoutParams(dp(330), ViewGroup.LayoutParams.WRAP_CONTENT))
                  }
