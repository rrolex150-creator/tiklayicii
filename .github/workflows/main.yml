                  val j = 0.004f * s[1]
                  val x = (fx * s[0] + (Math.random().toFloat() * 2f - 1f) * j).coerceIn(0f, s[0] - 1f)
                  val y = (fy * s[1] + (Math.random().toFloat() * 2f - 1f) * j).coerceIn(0f, s[1] - 1f)
                  val path = Path()
                  path.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                      .build()
                  dispatchGesture(g, null, null)
                  lastTap = SystemClock.elapsedRealtime()
              }

              // ---------------- görüntü analizi (şablon eşleştirme) ----------------

              // Küçük skor = şablon bulundu. Ortalama mutlak renk farkı döner.
              private fun slide(px: IntArray, rw: Int, rh: Int, t: IntArray, tw: Int, th: Int): Float {
                  val n = tw * th * 3
                  var best = Int.MAX_VALUE
                  for (y in 0..(rh - th)) {
                      for (x in 0..(rw - tw)) {
                          var s = 0
                          var ti = 0
                          var yy = 0
                          while (yy < th) {
                              var p = (y + yy) * rw + x
                              var xx = 0
                              while (xx < tw) {
                                  val c = px[p++]
                                  s += abs(((c shr 16) and 255) - t[ti]) +
                                      abs(((c shr 8) and 255) - t[ti + 1]) +
                                      abs((c and 255) - t[ti + 2])
                                  ti += 3
                                  xx++
                              }
                              if (s >= best) break
                              yy++
                          }
                          if (s < best) best = s
                      }
                  }
                  return best.toFloat() / n
              }

              // Sol üst buff satırı: Hava Kılıcı, Öfke ve (öğretildiyse) Buds ikonları var mı?
              private fun analyzeBuffs(b: Bitmap, tpls: Array<IntArray?>): FloatArray {
                  val out = FloatArray(MAXS) { 99f }
                  val sc = b.height / 1080f
                  val x0 = (0.03f * b.width).toInt()
                  val x1 = (0.30f * b.width).toInt()
                  val y0 = (0.12f * b.height).toInt()
                  val y1 = (0.22f * b.height).toInt()
                  val f = 0.5f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.TW + 2 || rh < Cfg.TH + 2) return out
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  for (i in 0 until MAXS) {
                      val t = tpls[i] ?: continue
                      if (gTpl[i] != null) continue
                      out[i] = slide(px, rw, rh, t, Cfg.TW, Cfg.TH)
                  }
                  return out
              }

              // Dokunulan buff ikonunu şablon olarak kaydet (yarım ölçek, 21x20)
              private fun learnIcon(b: Bitmap, fx: Float, fy: Float): String? {
                  val sc = b.height / 1080f
                  val w = (Cfg.TW * 2 * sc).toInt()
                  val h = (Cfg.TH * 2 * sc).toInt()
                  val cx = (fx * b.width).toInt()
                  val cy = (fy * b.height).toInt()
                  val x0 = (cx - w / 2).coerceIn(0, b.width - w)
                  val y0 = (cy - h / 2).coerceIn(0, b.height - h)
                  val crop = Bitmap.createBitmap(b, x0, y0, w, h)
                  val small = Bitmap.createScaledBitmap(crop, Cfg.TW, Cfg.TH, true)
                  val px = IntArray(Cfg.TW * Cfg.TH)
                  small.getPixels(px, 0, Cfg.TW, 0, 0, Cfg.TW, Cfg.TH)
                  val bytes = ByteArray(px.size * 3)
                  for (i in px.indices) {
                      bytes[i * 3] = ((px[i] shr 16) and 255).toByte()
                      bytes[i * 3 + 1] = ((px[i] shr 8) and 255).toByte()
                      bytes[i * 3 + 2] = (px[i] and 255).toByte()
                  }
                  return Base64.encodeToString(bytes, Base64.NO_WRAP)
              }

              // Bir düğmenin çevresinde pasif ve aktif görünümü arar: [pasif skoru, aktif skoru]
              private fun analyzeSlot(b: Bitmap, fx: Float, fy: Float, tP: IntArray?, tA: IntArray?, rad: Float): FloatArray {
                  val none = floatArrayOf(99f, 99f)
                  if (fx < 0f || fy < 0f || tP == null || tA == null) return none
                  val need = Cfg.NT * Cfg.NT * 3
                  if (tP.size < need || tA.size < need) return none
                  val sc = b.height / 1080f
                  val cx = (fx * b.width).toInt()
                  val cy = (fy * b.height).toInt()
                  val r = (rad * sc).toInt()
                  val x0 = (cx - r).coerceAtLeast(0)
                  val y0 = (cy - r).coerceAtLeast(0)
                  val x1 = (cx + r).coerceAtMost(b.width)
                  val y1 = (cy + r).coerceAtMost(b.height)
                  val f = 0.25f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.NT + 2 || rh < Cfg.NT + 2) return none
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  return floatArrayOf(
                      slide(px, rw, rh, tP, Cfg.NT, Cfg.NT),
                      slide(px, rw, rh, tA, Cfg.NT, Cfg.NT)
                  )
              }

              // Düğmenin çevresini kırpıp şablon (çeyrek ölçek, 29x29 RGB) olarak döndürür
              private fun cropTpl(b: Bitmap, fx: Float, fy: Float): String? {
                  val sc = b.height / 1080f
                  val w = (Cfg.NT * 4 * sc).toInt()
                  if (w < 8 || w > b.width || w > b.height) return null
                  val cx = (fx * b.width).toInt()
                  val cy = (fy * b.height).toInt()
                  val x0 = (cx - w / 2).coerceIn(0, b.width - w)
                  val y0 = (cy - w / 2).coerceIn(0, b.height - w)
                  val crop = Bitmap.createBitmap(b, x0, y0, w, w)
                  val small = Bitmap.createScaledBitmap(crop, Cfg.NT, Cfg.NT, true)
                  val px = IntArray(Cfg.NT * Cfg.NT)
                  small.getPixels(px, 0, Cfg.NT, 0, 0, Cfg.NT, Cfg.NT)
                  val bytes = ByteArray(px.size * 3)
                  for (i in px.indices) {
                      bytes[i * 3] = ((px[i] shr 16) and 255).toByte()
                      bytes[i * 3 + 1] = ((px[i] shr 8) and 255).toByte()
                      bytes[i * 3 + 2] = (px[i] and 255).toByte()
                  }
                  return Base64.encodeToString(bytes, Base64.NO_WRAP)
              }

              // İki şablon ne kadar farklı (ortalama mutlak fark)
              private fun tplDiff(x: String, y: String): Float {
                  val a = decodeTpl(x)
                  val b = decodeTpl(y)
                  val n = minOf(a.size, b.size)
                  if (n == 0) return 0f
                  var s = 0L
                  for (i in 0 until n) {
                      s += abs(a[i] - b[i])
                  }
                  return s.toFloat() / n
              }

              // ---------- otomatik ikon öğrenme ("Dene" düğmesi) ----------

              private fun grab(cb: (Bitmap?) -> Unit) {
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, worker, object : TakeScreenshotCallback {
                          override fun onSuccess(r: ScreenshotResult) {
                              var bmp: Bitmap? = null
                              try {
                                  val hb = r.hardwareBuffer
                                  bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                              } catch (ex: Exception) {
                              }
                              cb(bmp)
                          }

                          override fun onFailure(code: Int) {
                              cb(null)
                          }
                      })
                  } catch (ex: Exception) {
                      cb(null)
                  }
              }

              // Basmadan önceki ve sonraki görüntüyü karşılaştırır, sol üstteki buff satırında
              // yeni çıkan ikonu bulup şablon olarak döndürür. Bulamazsa null.
              private fun diffLearn(a: Bitmap, b: Bitmap): String? {
                  if (a.width != b.width || a.height != b.height) return null
                  val sc = b.height / 1080f
                  val half = (16 * sc).toInt().coerceAtLeast(4)
                  val cy = (170f * sc).toInt()
                  var bestK = -1
                  var bestD = 0f
                  var second = 0f
                  for (k in 0 until 12) {
                      val cx = ((138f + 49f * k) * sc).toInt()
                      if (cx - half < 0 || cy - half < 0 || cx + half >= b.width || cy + half >= b.height) continue
                      var sum = 0L
                      var n = 0
                      var y = cy - half
                      while (y < cy + half) {
                          var x = cx - half
                          while (x < cx + half) {
                              val p = a.getPixel(x, y)
                              val q = b.getPixel(x, y)
                              sum += abs(((p shr 16) and 255) - ((q shr 16) and 255)) +
                                  abs(((p shr 8) and 255) - ((q shr 8) and 255)) +
                                  abs((p and 255) - (q and 255))
                              n++
                              x += 3
                          }
                          y += 3
                      }
                      val d = sum.toFloat() / (n * 3)
                      if (d > bestD) {
                          second = bestD
                          bestD = d
                          bestK = k
                      } else if (d > second) {
                          second = d
                      }
                  }
                  if (bestK < 0 || bestD < 14f || bestD < second * 1.4f) return null
                  val fx = ((138f + 49f * bestK) * sc) / b.width
                  val fy = (170f * sc) / b.height
                  return learnIcon(b, fx, fy)
              }

              // Ortak öğrenme akışı: menüyü ve pencereyi gizler, ekran görüntüsü alır, sonucu kaydeder.
              // twoStep: önce görüntü al, düğmeye bas, 1 sn sonra tekrar görüntü al. untap: tekrar bas (aç/kapa düğmeleri).
              private fun runShot(
                  twoStep: Boolean, fx: Float, fy: Float, untap: Boolean,
                  calc: (Bitmap, Bitmap?) -> Boolean, okMsg: String, failMsg: String
              ) {
                  if (Build.VERSION.SDK_INT < 30) {
                      toast("Android 11 veya üstü gerekli")
                      return
                  }
                  if (fx < 0f || fy < 0f) {
                      toast("Önce yuvayı ayarla")
                      return
                  }
                  if (autoBusy) return
                  autoBusy = true
                  showMenu(false)
                  panel?.visibility = View.INVISIBLE
                  toast("Öğreniyor, bekle...")
                  fun finish(msg: String) {
                      autoBusy = false
                      panel?.visibility = if (inGame) View.VISIBLE else View.GONE
                      showMenu(true)
                      toast(msg)
                  }
                  handler.postDelayed({
                      grab { a ->
                          if (a == null) {
                              handler.post { finish("Ekran görüntüsü alınamadı") }
                          } else if (!twoStep) {
                              var ok = false
                              try {
                                  ok = calc(a, null)
                              } catch (ex: Exception) {
                              }
                              handler.post { finish(if (ok) okMsg else failMsg) }
                          } else {
                              handler.post {
                                  tapFrac(fx, fy)
                                  handler.postDelayed({
                                      grab { b ->
                                          var ok = false
                                          if (b != null) {
                                              try {
                                                  ok = calc(a, b)
                                              } catch (ex: Exception) {
                                              }
                                          }
                                          handler.post {
                                              if (untap) tapFrac(fx, fy)
                                              finish(if (ok) okMsg else failMsg)
                                          }
                                      }
                                  }, 1000L)
                              }
                          }
                      }
                  }, 700L)
              }

              // Sol üst buff ikonunu otomatik öğren (beceri kapalıyken bas, yeni çıkan ikonu bul)
              private fun autoLearn(idx: Int) {
                  val pf = profile
                  val kk = "s" + pf + "_" + idx + "_"
                  runShot(true, bx[idx], by[idx], false, { a, b ->
                      val r = if (b != null) diffLearnG(a, b) else null
                      if (r != null) {
                          prefs.edit().putString(kk + "g", r.tpl).putFloat(kk + "gs", r.s)
                              .putFloat(kk + "gx", r.x).putFloat(kk + "gy", r.y).commit()
                          useTimer[idx] = false
                          noSee[idx] = 0
                          true
                      } else {
                          false
                      }
                  }, Cfg.SNAME[pf][idx] + " ikonu öğrenildi", "Yeni ikon çıkmadı. Buff yokken tekrar dene")
              }

              // Düğmenin pasif ve aktif görünümünü otomatik öğren (pasifken bas, sonra aktif hâlini kaydet)
              private fun autoLearnBtn(kP: String, kA: String, fx: Float, fy: Float, untap: Boolean, name: String) {
                  runShot(true, fx, fy, untap, { a, b ->
                      val tp = cropTpl(a, fx, fy)
                      val ta = if (b != null) cropTpl(b, fx, fy) else null
                      if (tp != null && ta != null && tplDiff(tp, ta) >= 8f) {
                          prefs.edit().putString(kP, tp).putString(kA, ta).commit()
                          true
                      } else {
                          false
                      }
                  }, name + ": pasif ve aktif görünüm öğrenildi",
                      "Düğmenin görünümü değişmedi. Pasifken dene ya da bu düğmede takip yok de")
              }

              // Düğmenin şu anki görünümünü kaydet (pasif ya da aktif, sen seçersin)

              // En iyi eşleşme ve yeri: [skor, x, y]
              private fun slideXY(px: IntArray, rw: Int, rh: Int, t: IntArray, tw: Int, th: Int): FloatArray {
                  val n = tw * th * 3
                  var best = Int.MAX_VALUE
                  var bxx = 0
                  var byy = 0
                  for (y in 0..(rh - th)) {
                      for (x in 0..(rw - tw)) {
                          var sm = 0
                          var ti = 0
                          var yy = 0
                          while (yy < th) {
                              var p = (y + yy) * rw + x
                              var xx = 0
                              while (xx < tw) {
                                  val c = px[p++]
                                  sm += abs(((c shr 16) and 255) - t[ti]) +
                                      abs(((c shr 8) and 255) - t[ti + 1]) +
                                      abs((c and 255) - t[ti + 2])
                                  ti += 3
                                  xx++
                              }
                              if (sm >= best) break
                              yy++
                          }
                          if (sm < best) {
                              best = sm
                              bxx = x
                              byy = y
                          }
                      }
                  }
                  return floatArrayOf(best.toFloat() / n, bxx.toFloat(), byy.toFloat())
              }

              // Öğrenilmiş buff ikonlarını (her yerleşimde) ara: önce son yerinin çevresi, bulunamazsa sol üst bölge
              private fun analyzeBuffG(b: Bitmap, out: FloatArray) {
                  val now = SystemClock.elapsedRealtime()
                  for (i in 0 until MAXS) {
                      val t = gTpl[i] ?: continue
                      val s = gSz[i] * b.height
                      if (s < 8f) continue
                      val f = 24f / s
                      var found = false
                      // 1) son konumun çevresi
                      val lx = gX[i] * b.width
                      val ly = gY[i] * b.height
                      var x0 = (lx - 3.2f * s).toInt().coerceAtLeast(0)
                      var y0 = (ly - 1.7f * s).toInt().coerceAtLeast(0)
                      var x1 = (lx + 3.2f * s).toInt().coerceAtMost(b.width)
                      var y1 = (ly + 1.7f * s).toInt().coerceAtMost(b.height)
                      for (pass in 0..1) {
                          if (pass == 1) {
                              if (found || now - gFull[i] < 700L) break
                              gFull[i] = now
                              x0 = 0
                              y0 = 0
                              x1 = (0.40f * b.width).toInt()
                              y1 = (0.34f * b.height).toInt()
                          }
                          val rw = ((x1 - x0) * f).toInt()
                          val rh = ((y1 - y0) * f).toInt()
                          if (rw < 26 || rh < 26 || x1 - x0 < 4 || y1 - y0 < 4) continue
                          val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                          val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                          val px = IntArray(rw * rh)
                          small.getPixels(px, 0, rw, 0, 0, rw, rh)
                          val r = slideXY(px, rw, rh, t, 24, 24)
                          if (r[0] < out[i] || out[i] >= 99f) out[i] = r[0]
                          if (r[0] < thr[i]) {
                              found = true
                              gX[i] = (x0 + (r[1] + 12f) / f) / b.width
                              gY[i] = (y0 + (r[2] + 12f) / f) / b.height
                          }
                      }
                  }
              }

              // Basmadan önce / sonra: sol üstte yeni çıkan ikonu bul (her yerleşimde çalışır)
              private fun diffLearnG(a: Bitmap, b: Bitmap): GL? {
                  if (a.width != b.width || a.height != b.height) return null
                  val H = b.height
                  val W = b.width
                  val cell = (H / 60).coerceAtLeast(8)
                  val rx1 = (0.40f * W).toInt()
                  val ry1 = (0.34f * H).toInt()
                  val gw = rx1 / cell + 1
                  val gh = ry1 / cell + 1
                  val cnt = IntArray(gw * gh)
                  val minXs = IntArray(gw * gh) { Int.MAX_VALUE }
                  val maxXs = IntArray(gw * gh) { -1 }
                  val minYs = IntArray(gw * gh) { Int.MAX_VALUE }
                  val maxYs = IntArray(gw * gh) { -1 }
                  var y = 0
                  while (y < ry1) {
                      var x = 0
                      while (x < rx1) {
                          val p = a.getPixel(x, y)
                          val q = b.getPixel(x, y)
                          val d = abs(((p shr 16) and 255) - ((q shr 16) and 255)) +
                              abs(((p shr 8) and 255) - ((q shr 8) and 255)) +
                              abs((p and 255) - (q and 255))
                          if (d > 90) {
                              val k = (y / cell) * gw + x / cell
                              cnt[k]++
                              if (x < minXs[k]) minXs[k] = x
                              if (x > maxXs[k]) maxXs[k] = x
                              if (y < minYs[k]) minYs[k] = y
                              if (y > maxYs[k]) maxYs[k] = y
                          }
                          x += 2
                      }
                      y += 2
                  }
                  val seen = BooleanArray(gw * gh)
                  var bestTot = 0
                  var bx0 = 0
                  var bx1 = 0
                  var by0 = 0
                  var by1 = 0
                  for (st in 0 until gw * gh) {
                      if (seen[st] || cnt[st] < 4) continue
                      val stack = ArrayList<Int>()
                      stack.add(st)
                      seen[st] = true
                      var tot = 0
                      var mnx = Int.MAX_VALUE
                      var mxx = -1
                      var mny = Int.MAX_VALUE
                      var mxy = -1
                      while (stack.isNotEmpty()) {
                          val k = stack.removeAt(stack.size - 1)
                          tot += cnt[k]
                          if (minXs[k] < mnx) mnx = minXs[k]
                          if (maxXs[k] > mxx) mxx = maxXs[k]
                          if (minYs[k] < mny) mny = minYs[k]
                          if (maxYs[k] > mxy) mxy = maxYs[k]
                          val kx = k % gw
                          val ky = k / gw
                          for (d in 0 until 4) {
                              val nx = kx + (if (d == 0) 1 else if (d == 1) -1 else 0)
                              val ny = ky + (if (d == 2) 1 else if (d == 3) -1 else 0)
                              if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue
                              val nk = ny * gw + nx
                              if (!seen[nk] && cnt[nk] >= 4) {
                                  seen[nk] = true
                                  stack.add(nk)
                              }
                          }
                      }
                      val bw = mxx - mnx + 1
                      val bh = mxy - mny + 1
                      if (bw < 0.02f * H || bh < 0.02f * H || bw > 0.09f * H || bh > 0.09f * H) continue
                      if (bw > bh * 1.5f || bh > bw * 1.5f) continue
                      if (tot > bestTot) {
                          bestTot = tot
                          bx0 = mnx
                          bx1 = mxx
                          by0 = mny
                          by1 = mxy
                      }
                  }
                  if (bestTot < 12) return null
                  val sz = maxOf(bx1 - bx0 + 1, by1 - by0 + 1)
                  val cx = (bx0 + bx1) / 2
                  val cy = (by0 + by1) / 2
                  val x0 = (cx - sz / 2).coerceIn(0, W - sz)
                  val y0 = (cy - sz / 2).coerceIn(0, H - sz)
                  val crop = Bitmap.createBitmap(b, x0, y0, sz, sz)
                  val small = Bitmap.createScaledBitmap(crop, 24, 24, true)
                  val px = IntArray(24 * 24)
                  small.getPixels(px, 0, 24, 0, 0, 24, 24)
                  val bytes = ByteArray(px.size * 3)
                  for (i in px.indices) {
                      bytes[i * 3] = ((px[i] shr 16) and 255).toByte()
                      bytes[i * 3 + 1] = ((px[i] shr 8) and 255).toByte()
                      bytes[i * 3 + 2] = (px[i] and 255).toByte()
                  }
                  return GL(Base64.encodeToString(bytes, Base64.NO_WRAP), sz.toFloat() / H, (x0 + sz / 2f) / W, (y0 + sz / 2f) / H)
              }

              // Katalogdaki beceri ikonunu ekranın sağ-alt bölgesinde ara: [x, y, skor, boyut oranı]
              private fun findSlot(b: Bitmap, q64: String): FloatArray? {
                  val bytes = Base64.decode(q64, Base64.DEFAULT)
                  val qb = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return null
                  val qw = qb.width / 2
                  val kk = 4
                  val x0 = (b.width * 0.40f).toInt()
                  val y0 = (b.height * 0.30f).toInt()
                  val rw = (b.width - x0) / kk
                  val rh = (b.height - y0) / kk
                  if (rw < 40 || rh < 40) return null
                  val reg = Bitmap.createBitmap(b, x0, y0, b.width - x0, b.height - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  val g = IntArray(rw * rh)
                  for (i in px.indices) {
                      val c = px[i]
                      g[i] = (((c shr 16) and 255) * 30 + ((c shr 8) and 255) * 59 + (c and 255) * 11) / 100
                  }
                  val iw = rw + 1
                  val sm = LongArray(iw * (rh + 1))
                  val sq = LongArray(iw * (rh + 1))
                  for (y in 0 until rh) {
                      var rs = 0L
                      var rq = 0L
                      for (x in 0 until rw) {
                          val v = g[y * rw + x]
                          rs += v
                          rq += v * v
                          sm[(y + 1) * iw + x + 1] = sm[y * iw + x + 1] + rs
                          sq[(y + 1) * iw + x + 1] = sq[y * iw + x + 1] + rq
                      }
                  }
                  val vars = arrayOf(intArrayOf(0, 0), intArrayOf(qw, 0), intArrayOf(0, qw))
                  val sizes = intArrayOf(10, 12, 14, 17, 20, 24, 28)
                  var bestN = -2f
                  var bestX = 0
                  var bestY = 0
                  var bestS = 0
                  val inner = (qw * 0.6f).toInt()
                  val off = (qw * 0.2f).toInt()
                  for (v in vars) {
                      val glyph = Bitmap.createBitmap(qb, v[0] + off, v[1] + off, inner, inner)
                      for (sz in sizes) {
                          if (sz >= rw || sz >= rh) continue
                          val tb = Bitmap.createScaledBitmap(glyph, sz, sz, true)
                          val tp = IntArray(sz * sz)
                          tb.getPixels(tp, 0, sz, 0, 0, sz, sz)
                          val n = sz * sz
                          val tg = FloatArray(n)
                          var mean = 0f
                          for (i in 0 until n) {
                              val c = tp[i]
                              tg[i] = (((c shr 16) and 255) * 30 + ((c shr 8) and 255) * 59 + (c and 255) * 11) / 100f
                              mean += tg[i]
                          }
                          mean /= n
                          var vr = 0f
                          for (i in 0 until n) {
                              tg[i] -= mean
                              vr += tg[i] * tg[i]
                          }
                          val sd = Math.sqrt((vr / n).toDouble()).toFloat()
                          if (sd < 4f) continue
                          for (i in 0 until n) tg[i] /= sd
                          var y = 0
                          while (y <= rh - sz) {
                              var x = 0
                              while (x <= rw - sz) {
                                  val a = (y + sz) * iw + x + sz
                                  val bb = y * iw + x + sz
                                  val cc = (y + sz) * iw + x
                                  val dd = y * iw + x
                                  val ws = (sm[a] - sm[bb] - sm[cc] + sm[dd]).toFloat()
                                  val wq = (sq[a] - sq[bb] - sq[cc] + sq[dd]).toFloat()
                                  val wm = ws / n
                                  val wv = wq / n - wm * wm
                                  if (wv > 36f) {
                                      var dot = 0f
                                      var ti = 0
                                      var yy = 0
                                      while (yy < sz) {
                                          var p = (y + yy) * rw + x
                                          var xx = 0
                                          while (xx < sz) {
                                              dot += tg[ti] * g[p]
                                              ti++
                                              p++
                                              xx++
                                          }
                                          yy++
                                      }
                                      val ncc = (dot - wm * 0f) / (n * Math.sqrt(wv.toDouble()).toFloat())
                                      if (ncc > bestN) {
                                          bestN = ncc
                                          bestX = x
                                          bestY = y
                                          bestS = sz
                                      }
                                  }
                                  x += 2
                              }
                              y += 2
                          }
                      }
                  }
                  if (bestN < 0.42f || bestS == 0) return null
                  val cx = x0 + (bestX + bestS / 2f) * kk
                  val cy = y0 + (bestY + bestS / 2f) * kk
                  return floatArrayOf(cx / b.width, cy / b.height, bestN, bestS * kk / b.height.toFloat())
              }

              // Düğmenin çevresi basmadan önce / sonra ne kadar değişti
              private fun slotChange(a: Bitmap, b: Bitmap, fx: Float, fy: Float, szf: Float): Float {
                  if (a.width != b.width || a.height != b.height) return 0f
                  val r = (szf * a.height * 0.7f).toInt().coerceAtLeast(10)
                  val cx = (fx * a.width).toInt()
                  val cy = (fy * a.height).toInt()
                  val x0 = (cx - r).coerceAtLeast(0)
                  val y0 = (cy - r).coerceAtLeast(0)
                  val x1 = (cx + r).coerceAtMost(a.width - 1)
                  val y1 = (cy + r).coerceAtMost(a.height - 1)
                  var sum = 0L
                  var n = 0
                  var y = y0
                  while (y < y1) {
                      var x = x0
                      while (x < x1) {
                          val p = a.getPixel(x, y)
                          val q = b.getPixel(x, y)
                          sum += abs(((p shr 16) and 255) - ((q shr 16) and 255)) +
                              abs(((p shr 8) and 255) - ((q shr 8) and 255)) +
                              abs((p and 255) - (q and 255))
                          n++
                          x += 3
                      }
                      y += 3
                  }
                  return if (n == 0) 0f else sum.toFloat() / (n * 3)
              }

              // "Burdan yeniden başla" yazısının şablonu (çeyrek ölçek, 48x14)
              private fun cropRv(b: Bitmap, fx: Float, fy: Float): String? {
                  val sc = b.height / 1080f
                  val w = (RVW * 4 * sc).toInt()
                  val h = (RVH * 4 * sc).toInt()
                  if (w < 8 || h < 4 || w > b.width || h > b.height) return null
                  val cx = (fx * b.width).toInt()
                  val cy = (fy * b.height).toInt()
                  val x0 = (cx - w / 2).coerceIn(0, b.width - w)
                  val y0 = (cy - h / 2).coerceIn(0, b.height - h)
                  val crop = Bitmap.createBitmap(b, x0, y0, w, h)
                  val small = Bitmap.createScaledBitmap(crop, RVW, RVH, true)
                  val px = IntArray(RVW * RVH)
                  small.getPixels(px, 0, RVW, 0, 0, RVW, RVH)
                  val bytes = ByteArray(px.size * 3)
                  for (i in px.indices) {
                      bytes[i * 3] = ((px[i] shr 16) and 255).toByte()
                      bytes[i * 3 + 1] = ((px[i] shr 8) and 255).toByte()
                      bytes[i * 3 + 2] = (px[i] and 255).toByte()
                  }
                  return Base64.encodeToString(bytes, Base64.NO_WRAP)
              }

              private fun analyzeRevive(b: Bitmap, t: IntArray, fx: Float, fy: Float): Float {
                  if (fx < 0f || t.size < RVW * RVH * 3) return 99f
                  val sc = b.height / 1080f
                  val cx = (fx * b.width).toInt()
                  val cy = (fy * b.height).toInt()
                  val x0 = (cx - 0.22f * b.width).toInt().coerceAtLeast(0)
                  val y0 = (cy - 0.12f * b.height).toInt().coerceAtLeast(0)
                  val x1 = (cx + 0.22f * b.width).toInt().coerceAtMost(b.width)
                  val y1 = (cy + 0.12f * b.height).toInt().coerceAtMost(b.height)
                  val f = 0.25f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < RVW + 2 || rh < RVH + 2) return 99f
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  return slide(px, rw, rh, t, RVW, RVH)
              }

