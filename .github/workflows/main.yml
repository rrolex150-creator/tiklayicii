name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proj/app/src/main/java/com/benim/tiklayici
          mkdir -p proj/app/src/main/res/xml proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Tiklayici"
          include ':app'
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.benim.tiklayici'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.benim.tiklayici'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              // Cihaz ici (internetsiz) yazi tanima - canavar isimlerini ekrandan okumak icin
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tiklayici</string>
              <string name="aciklama">Oyun icin oto farm (dokunma + ekran okuma)</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/aciklama" />
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/MainActivity.kt <<'EOF'
          package com.benim.tiklayici

          import android.app.Activity
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var list: LinearLayout

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(32), dp(16), dp(16))
                  }

                  layout.addView(TextView(this).apply {
                      text = "1) Erişilebilirlik ayarlarını aç, Tiklayici servisini etkinleştir.\n" +
                          "2) Oyunu aç. Panelde ☰ > Hedef > 🔍 ile ekrandaki canavarları tara (ya da aşağıya adını yaz).\n" +
                          "3) Farm yapmak istediğin canavarları işaretle.\n" +
                          "4) Panelde ▶ ile başlat."
                      textSize = 15f
                  })

                  layout.addView(Button(this).apply {
                      text = "Erişilebilirlik Ayarları"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  val et = EditText(this).apply {
                      hint = "Canavar adı (oyunda yazıldığı gibi)"
                      setSingleLine(true)
                  }
                  val addBtn = Button(this).apply {
                      text = "Ekle"
                      setOnClickListener {
                          val n = et.text.toString().trim()
                          if (Shared.addName(this@MainActivity, n)) {
                              Shared.setSelected(this@MainActivity, n.replace(Regex("\\s+"), " "), true)
                              et.setText("")
                              refresh()
                          }
                      }
                  }
                  val addRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  addRow.addView(et, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  addRow.addView(addBtn)
                  layout.addView(addRow)

                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  layout.addView(list)

                  scroll.addView(layout)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  list.removeAllViews()
                  val sel = Shared.selected(this)
                  val names = Shared.all(this).sorted()

                  if (names.isEmpty()) {
                      list.addView(TextView(this).apply {
                          text = "Henüz canavar yok."
                          setPadding(0, dp(12), 0, 0)
                      })
                      return
                  }

                  for (n in names) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(4), 0, dp(4))
                      }

                      val img = ImageView(this).apply {
                          setBackgroundColor(0xFFDDDDDD.toInt())
                          scaleType = ImageView.ScaleType.FIT_CENTER
                      }
                      val f = Shared.thumb(this, n)
                      if (f.exists()) {
                          val bm = BitmapFactory.decodeFile(f.path)
                          if (bm != null) img.setImageBitmap(bm)
                      }
                      row.addView(img, LinearLayout.LayoutParams(dp(56), dp(56)))

                      val cb = CheckBox(this).apply {
                          text = n
                          isChecked = sel.contains(n)
                          setOnCheckedChangeListener { _, c ->
                              Shared.setSelected(this@MainActivity, n, c)
                          }
                      }
                      row.addView(cb, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                      val del = TextView(this).apply {
                          text = "✕"
                          textSize = 20f
                          setPadding(dp(14), dp(8), dp(14), dp(8))
                          setOnClickListener {
                              Shared.removeName(this@MainActivity, n)
                              refresh()
                          }
                      }
                      row.addView(del)

                      list.addView(row)
                  }
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/Shared.kt <<'EOF'
          package com.benim.tiklayici

          import android.content.Context
          import android.content.SharedPreferences
          import java.io.File
          import java.util.Locale

          object Shared {

              fun prefs(c: Context): SharedPreferences =
                  c.getSharedPreferences("ayar", Context.MODE_PRIVATE)

              // ---- Canavar listesi (öğrenilen / elle eklenen) ve seçili olanlar ----

              fun all(c: Context): MutableSet<String> =
                  HashSet(prefs(c).getStringSet("mob_all", emptySet<String>()) ?: emptySet<String>())

              fun selected(c: Context): MutableSet<String> =
                  HashSet(prefs(c).getStringSet("mob_sel", emptySet<String>()) ?: emptySet<String>())

              fun saveAll(c: Context, s: Set<String>) {
                  prefs(c).edit().putStringSet("mob_all", HashSet(s)).apply()
              }

              fun saveSel(c: Context, s: Set<String>) {
                  prefs(c).edit().putStringSet("mob_sel", HashSet(s)).apply()
              }

              fun addName(c: Context, name: String): Boolean {
                  val n = name.trim().replace(Regex("\\s+"), " ")
                  if (letters(n) < 3) return false
                  val a = all(c)
                  for (x in a) {
                      if (simFull(x, n) >= 0.85f) return false
                  }
                  a.add(n)
                  saveAll(c, a)
                  return true
              }

              fun removeName(c: Context, name: String) {
                  val a = all(c)
                  a.remove(name)
                  saveAll(c, a)
                  val s = selected(c)
                  s.remove(name)
                  saveSel(c, s)
                  try {
                      thumb(c, name).delete()
                  } catch (e: Exception) {
                  }
              }

              fun setSelected(c: Context, name: String, on: Boolean) {
                  val s = selected(c)
                  if (on) s.add(name) else s.remove(name)
                  saveSel(c, s)
              }

              fun thumb(c: Context, name: String): File =
                  File(c.filesDir, "mob_" + Integer.toHexString(name.hashCode()) + ".png")

              // ---- Metin normalleştirme / benzerlik ----

              fun norm(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s.lowercase(Locale("tr", "TR"))) {
                      val c = when (ch) {
                          'ç' -> 'c'
                          'ğ' -> 'g'
                          'ı' -> 'i'
                          'ö' -> 'o'
                          'ş' -> 's'
                          'ü' -> 'u'
                          else -> ch
                      }
                      if ((c in 'a'..'z') || (c in '0'..'9')) sb.append(c)
                  }
                  return sb.toString()
              }

              fun letters(s: String): Int = norm(s).count { it in 'a'..'z' }

              fun lev(a: String, b: String): Int {
                  var prev = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      val cur = IntArray(b.length + 1)
                      cur[0] = i
                      for (j in 1..b.length) {
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(prev[j - 1] + cost, prev[j] + 1, cur[j - 1] + 1)
                      }
                      prev = cur
                  }
                  return prev[b.length]
              }

              // İki metnin tamamı ne kadar benzer (0..1)
              fun simFull(a: String, b: String): Float {
                  val x = norm(a)
                  val y = norm(b)
                  val m = maxOf(x.length, y.length)
                  if (m == 0) return 1f
                  return 1f - lev(x, y).toFloat() / m
              }

              // "name" metnin (text) içinde yaklaşık olarak geçiyor mu (0..1). OCR hatalarına dayanıklı.
              fun sim(text: String, name: String): Float {
                  val a = norm(text)
                  val b = norm(name)
                  if (a.isEmpty() || b.isEmpty()) return 0f
                  var prev = IntArray(a.length + 1)
                  for (i in 1..b.length) {
                      val cur = IntArray(a.length + 1)
                      cur[0] = i
                      for (j in 1..a.length) {
                          val cost = if (b[i - 1] == a[j - 1]) 0 else 1
                          cur[j] = minOf(prev[j - 1] + cost, prev[j] + 1, cur[j - 1] + 1)
                      }
                      prev = cur
                  }
                  var m = Int.MAX_VALUE
                  for (j in 0..a.length) {
                      if (prev[j] < m) m = prev[j]
                  }
                  return 1f - m.toFloat() / b.length
              }

              // Son kelime de tutmalı: "Beyaz Yeminli Asker" ile "Beyaz Yeminli Okçu" karışmasın
              fun nameScore(text: String, name: String): Float {
                  val parts = name.trim().split(Regex("\\s+"))
                  val lw = norm(parts[parts.size - 1])
                  if (lw.length >= 3 && sim(text, lw) < 0.7f) return 0f
                  return sim(text, name)
              }

              // text, bilinen isimlerden en çok hangisine benziyor; o isim seçili listedeyse true
              fun matchSel(text: String, sel: Collection<String>, all: Collection<String>): Boolean {
                  var best: String? = null
                  var bs = 0f
                  for (n in all) {
                      val s = nameScore(text, n)
                      val longer = best != null && s == bs && norm(n).length > norm(best).length
                      if (s > bs || longer) {
                          bs = s
                          best = n
                      }
                  }
                  return best != null && bs >= 0.78f && sel.contains(best)
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/ClickService.kt <<'EOF'
          package com.benim.tiklayici

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.io.FileOutputStream
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicReference

          class ClickService : AccessibilityService() {

              private class Act(val name: String, val x: Float, val y: Float, val def: Boolean)
              private class Spd(val name: String, val click: IntRange, val farm: IntRange)
              private class Line2(val text: String, val box: Rect)

              companion object {
                  const val IDX_TARGET = 0
                  const val IDX_ATTACK = 1
                  const val IDX_LOOT = 6
                  const val IDX_HP = 7
                  const val IDX_MP = 8
              }

              // Ekran oranları (genişlik, yükseklik) - senin ekran görüntülerinden
              private val acts = listOf(
                  Act("Hedef seç", 0.953f, 0.580f, true),
                  Act("Saldırı", 0.862f, 0.693f, true),
                  Act("Beceri I", 0.727f, 0.560f, true),
                  Act("Beceri II", 0.715f, 0.648f, true),
                  Act("Beceri III", 0.715f, 0.741f, false),
                  Act("Beceri IV", 0.727f, 0.826f, false),
                  Act("Eşya topla", 0.953f, 0.811f, true),
                  Act("Kırmızı iksir", 0.915f, 0.479f, false),
                  Act("Mavi iksir", 0.862f, 0.460f, false)
              )

              private val speeds = listOf(
                  Spd("Yavaş", 800..1200, 1300..1800),
                  Spd("Normal", 400..700, 800..1200),
                  Spd("Hızlı", 200..350, 500..750)
              )

              // Canavar etiketinin altında gövdeye dokunma mesafesi (ekran yüksekliği oranı)
              private val OFFS = floatArrayOf(0.07f, 0.10f, 0.045f, 0.13f)

              private val TS = floatArrayOf(
                  0.14f, 0.18f, 0.22f, 0.26f, 0.30f, 0.34f,
                  0.66f, 0.70f, 0.74f, 0.78f, 0.82f, 0.86f
              )
              private val TOL1 = floatArrayOf(-0.03f, 0f, 0.03f)
              private val TOL2 = floatArrayOf(-0.02f, 0f, 0.02f)

              private val COL_ON = 0xFF2E7D32.toInt()
              private val COL_OFF = 0xFF424242.toInt()
              private val COL_BTN = 0xFF1565C0.toInt()

              private val handler = Handler(Looper.getMainLooper())
              private val cbExec = Executors.newSingleThreadExecutor()
              private val recognizer by lazy {
                  TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              }

              private val enabled = BooleanArray(acts.size)

              @Volatile
              var running = false

              private var mode = 0          // 0 = akıllı farm, 1 = tıklayıcı
              private var speedIdx = 1
              private var longAtk = false
              private var hpPct = 50
              private var mpPct = 30
              private var esik = 85

              private var wm: WindowManager? = null
              private var panel: View? = null
              private var startBtn: TextView? = null
              private var statusTv: TextView? = null
              private var mobList: LinearLayout? = null
              private var worker: Thread? = null

              // farm durumu
              private var hadTarget = false
              private var lootBurst = 0
              private var offIdx = 0
              private var awaitingSelect = false
              private var lastAtkTap = 0L
              private var lastLoot = 0L
              private var lastHp = 0L
              private var lastMp = 0L
              private var skillI = 0
              private var miss = 0

              // ------------------------------------------------------------------
              //  Servis yaşam döngüsü
              // ------------------------------------------------------------------

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val p = Shared.prefs(this)
                  for (k in acts.indices) enabled[k] = p.getBoolean("a$k", acts[k].def)
                  mode = p.getInt("mod", 0)
                  speedIdx = p.getInt("hiz", 1).coerceIn(0, speeds.size - 1)
                  longAtk = p.getBoolean("uzun", false)
                  hpPct = p.getInt("hp", 50)
                  mpPct = p.getInt("mp", 30)
                  esik = p.getInt("esik", 85)
                  buildPanel()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  running = false
              }

              override fun onDestroy() {
                  running = false
                  try {
                      panel?.let { wm?.removeView(it) }
                  } catch (e: Exception) {
                  }
                  try {
                      recognizer.close()
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              // ------------------------------------------------------------------
              //  Küçük yardımcılar
              // ------------------------------------------------------------------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun ui(r: () -> Unit) {
                  handler.post { r() }
              }

              private fun setStatus(s: String) {
                  ui { statusTv?.text = s }
              }

              private fun sleep(ms: Long) {
                  try {
                      Thread.sleep(ms)
                  } catch (e: InterruptedException) {
                      running = false
                  }
              }

              @Suppress("DEPRECATION")
              private fun realSize(): IntArray {
                  val m = DisplayMetrics()
                  wm?.defaultDisplay?.getRealMetrics(m)
                  return intArrayOf(m.widthPixels, m.heightPixels)
              }

              private fun tapPx(x: Float, y: Float, dur: Long = 60L) {
                  handler.post {
                      val path = Path()
                      path.moveTo(x, y)
                      val g = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, dur))
                          .build()
                      dispatchGesture(g, null, null)
                  }
              }

              private fun tapAct(k: Int) {
                  val s = realSize()
                  val a = acts[k]
                  val dur = if (k == IDX_ATTACK && longAtk) 700L else 60L
                  tapPx(a.x * s[0], a.y * s[1], dur)
              }

              // ------------------------------------------------------------------
              //  Panel (yatay açılan menü)
              // ------------------------------------------------------------------

              private fun chip(text: String, on: Boolean, click: (TextView) -> Unit): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = 12f
                  t.setTextColor(Color.WHITE)
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(6), dp(8), dp(6), dp(8))
                  t.setBackgroundColor(if (on) COL_ON else COL_OFF)
                  t.setOnClickListener { click(t) }
                  return t
              }

              private fun setChip(v: TextView, on: Boolean) {
                  v.setBackgroundColor(if (on) COL_ON else COL_OFF)
              }

              private fun rowLp(): LinearLayout.LayoutParams {
                  val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  lp.setMargins(dp(2), dp(2), dp(2), dp(2))
                  return lp
              }

              private fun hrow(): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  return r
              }

              private fun bigBtn(text: String): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = 20f
                  t.setTextColor(Color.WHITE)
                  t.gravity = Gravity.CENTER
                  t.setBackgroundColor(COL_BTN)
                  return t
              }

              private fun stepper(
                  label: String,
                  getV: () -> Int,
                  setV: (Int) -> Unit,
                  step: Int,
                  lo: Int,
                  hi: Int
              ): View {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setBackgroundColor(COL_OFF)
                  val tv = TextView(this)
                  tv.textSize = 11f
                  tv.setTextColor(Color.WHITE)
                  tv.gravity = Gravity.CENTER
                  tv.text = label + " " + getV()
                  val minus = chip("−", false) {
                      setV((getV() - step).coerceAtLeast(lo))
                      tv.text = label + " " + getV()
                  }
                  val plus = chip("+", false) {
                      setV((getV() + step).coerceAtMost(hi))
                      tv.text = label + " " + getV()
                  }
                  row.addView(minus, LinearLayout.LayoutParams(dp(30), dp(36)))
                  row.addView(tv, LinearLayout.LayoutParams(0, dp(36), 1f))
                  row.addView(plus, LinearLayout.LayoutParams(dp(30), dp(36)))
                  return row
              }

              private fun buildKeysPage(): View {
                  val p = Shared.prefs(this)
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  var row: LinearLayout? = null
                  for (k in acts.indices) {
                      if (k % 3 == 0) {
                          row = hrow()
                          col.addView(row)
                      }
                      val c = chip(acts[k].name, enabled[k]) { v ->
                          enabled[k] = !enabled[k]
                          setChip(v, enabled[k])
                          p.edit().putBoolean("a$k", enabled[k]).apply()
                      }
                      row!!.addView(c, rowLp())
                  }
                  return col
              }

              private fun buildTargetPage(): View {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL

                  val r1 = hrow()
                  r1.addView(chip("🔍 Ekranı tara", false) { scanOnce() }, rowLp())
                  r1.addView(chip("Seçimi temizle", false) {
                      Shared.saveSel(this, emptySet())
                      rebuildMobList()
                  }, rowLp())
                  col.addView(r1)

                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  mobList = list
                  val sv = ScrollView(this)
                  sv.addView(list)
                  col.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(110)))
                  return col
              }

              private fun rebuildMobList() {
                  val list = mobList ?: return
                  list.removeAllViews()
                  val names = Shared.all(this).sorted()
                  val sel = Shared.selected(this)
                  if (names.isEmpty()) {
                      val tv = TextView(this)
                      tv.text = "Canavarlar ekrandayken 🔍 bas.\n(Ya da uygulamadan isim yaz.)"
                      tv.textSize = 11f
                      tv.setTextColor(Color.LTGRAY)
                      list.addView(tv)
                      return
                  }
                  for (n in names) {
                      val c = chip(n, sel.contains(n)) { v ->
