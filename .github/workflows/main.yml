                      Pair("Elle göster", {
                          pickPoint(nm + " beceri düğmesine dokun") { fx, fy ->
                              prefs.edit().putFloat(kk + "x", fx).putFloat(kk + "y", fy).commit()
                              bx[i] = fx
                              by[i] = fy
                              toast("Yuva kaydedildi")
                              refreshMenu()
                          }
                      })
                  )))
                  card.addView(chips(listOf("Üstte görünür", "Süreyle"), if (smode[i] == 1) 0 else 1) { n ->
                      prefs.edit().putInt(kk + "mode", if (n == 0) 1 else 0).commit()
