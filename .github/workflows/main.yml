              private fun iconOf(b64: String): BitmapDrawable {
                  val got = iconCache[b64]
                  if (got != null) return got
                  val bytes = Base64.decode(b64, Base64.DEFAULT)
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  val d = BitmapDrawable(resources, bmp)
                  d.setFilterBitmap(false)
                  iconCache[b64] = d
                  return d
              }

              // 2x2 renk hâlli resmin sol üst çeyreği
              private fun qIcon(b64: String): BitmapDrawable {
                  val got = iconCache["q" + b64]
                  if (got != null) return got
                  val bytes = Base64.decode(b64, Base64.DEFAULT)
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  val h = bmp.width / 2 - 2
                  val cr = Bitmap.createBitmap(bmp, 0, 0, h, h)
                  val d = BitmapDrawable(resources, cr)
                  d.setFilterBitmap(true)
                  iconCache["q" + b64] = d
                  return d
