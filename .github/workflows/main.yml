          cat > proj/app/src/main/java/com/benim/tiklayici/MainActivity.kt <<'EOF'
          package com.benim.tiklayici

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private var statusTv: TextView? = null
              private val cBg = 0xFF05080E.toInt()
              private val cCard = 0xFF0D1522.toInt()
              private val cAccent = 0xFF2F9BFF.toInt()
              private val cCyan = 0xFF7CD0FF.toInt()
              private val cMuted = 0xFF8CA0B8.toInt()

              private fun shape(fill: Int, stroke: Int, r: Float, sw: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = r
                  g.setStroke(sw, stroke)
                  return g
              }

              override fun onResume() {
                  super.onResume()
                  val on = ClickService.inst != null
                  statusTv?.text = if (on) "● Servis açık  ·  oyuna geç, yüzen pencere görünür" else "○ Servis kapalı  ·  aşağıdan Erişilebilirlik'i aç"
                  statusTv?.setTextColor(if (on) 0xFF4CE0A0.toInt() else cCyan)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.gravity = Gravity.CENTER_HORIZONTAL
                  col.setBackgroundColor(cBg)
                  col.setPadding(dp(18), dp(40), dp(18), dp(24))

                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  col.addView(logo, LinearLayout.LayoutParams(dp(110), dp(110)))

                  val title = TextView(this)
                  title.text = "OTO AV"
                  title.textSize = 28f
                  title.letterSpacing = 0.15f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  title.setTextColor(cCyan)
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, dp(10), 0, dp(2))
                  col.addView(title)

                  val sub = TextView(this)
                  sub.text = "Hava Kılıcı  •  Öfke  •  Otomatik Av"
                  sub.textSize = 13f
                  sub.setTextColor(cMuted)
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, 0, 0, dp(16))
                  col.addView(sub)

                  val st = TextView(this)
                  st.textSize = 14f
                  st.gravity = Gravity.CENTER
                  st.setPadding(dp(12), dp(10), dp(12), dp(10))
                  st.background = shape(cCard, 0xFF1F4F8F.toInt(), dp(12).toFloat(), dp(1))
                  statusTv = st
                  col.addView(st, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val how = TextView(this)
                  how.text = "1) Erişilebilirlik'ten Oto Av servisini aç.\n" +
                      "2) Oyuna geç: üstte küçük yüzen pencere çıkar. Logoya dokun: küçül / büyüt, logodan tutup sürükle.\n" +
                      "3) ☰ : yakındaki kırmızı isimli canavarlar listelenir, avlanacakları seç.\n" +
                      "4) ▶ başlat, ■ durdur. Canavara gider, saldırır, eşya toplar.\n" +
                      "5) ⚙ Ayarlar: Hava Kılıcı ve Öfke otomatik yenileme, \"dene\" düğmeleri, joystick ayarı.\n\n" +
                      "Hava Kılıcı ve Öfke bitince (sol üstteki ikonlar kaybolunca) ilgili beceriye kendiliğinden basılır.\n" +
                      "Android 11 ve üstü gerekir. Sol üstteki buff ikonlarının üstünü kapatma."
                  how.textSize = 13f
                  how.setTextColor(0xFFB8C7DB.toInt())
                  how.setPadding(dp(14), dp(12), dp(14), dp(12))
                  how.background = shape(cCard, 0xFF14263F.toInt(), dp(12).toFloat(), dp(1))
                  val hlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  hlp.topMargin = dp(12)
                  col.addView(how, hlp)

                  val btn = TextView(this)
                  btn.text = "Erişilebilirlik Ayarları"
                  btn.textSize = 15f
                  btn.setTypeface(btn.typeface, Typeface.BOLD)
                  btn.setTextColor(0xFF04101F.toInt())
                  btn.gravity = Gravity.CENTER
                  btn.background = shape(cAccent, 0xFF9ADBFF.toInt(), dp(12).toFloat(), dp(1))
                  btn.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  val blp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48))
                  blp.topMargin = dp(16)
                  col.addView(btn, blp)

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(cBg)
                  sv.addView(col)
                  setContentView(sv)
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/ClickService.kt <<'EOF'
          package com.benim.tiklayici

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityService.GestureResultCallback
          import android.accessibilityservice.AccessibilityService.ScreenshotResult
          import android.accessibilityservice.AccessibilityService.TakeScreenshotCallback
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.content.res.ColorStateList
          import android.widget.ImageView
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Base64
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.concurrent.Executor
          import kotlin.math.abs

          // ESP katmanı: canavarların etrafına kutu çizer (dokunmayı geçirir)
          class EspView(ctx: Context) : View(ctx) {
              class Box(val l: Float, val t: Float, val r: Float, val b: Float, val sel: Boolean)

              var boxes: List<Box> = emptyList()
              var px = -1f
              var py = -1f
              var tx = -1f
              var ty = -1f
              var bw = 1
              var bh = 1
              private val pSel = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pOth = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pLine = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  pSel.style = Paint.Style.STROKE
                  pSel.color = 0xFF39FF6A.toInt()
                  pSel.strokeWidth = 4f
                  pOth.style = Paint.Style.STROKE
                  pOth.color = 0xFFFFD54A.toInt()
                  pOth.strokeWidth = 2f
                  pLine.style = Paint.Style.STROKE
                  pLine.color = 0x9939FF6A.toInt()
                  pLine.strokeWidth = 2f
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  val sx = width.toFloat() / bw
                  val sy = height.toFloat() / bh
                  for (m in boxes) {
                      c.drawRect(m.l * sx, m.t * sy, m.r * sx, m.b * sy, if (m.sel) pSel else pOth)
                  }
                  if (tx >= 0f) c.drawLine(px * sx, py * sy, tx * sx, ty * sy, pLine)
              }
          }

          class ClickService : AccessibilityService() {

              companion object {
                  var inst: ClickService? = null
              }

              private class Mob(val box: Rect, val name: String, val nm: String)

              private val handler = Handler(Looper.getMainLooper())
              private val exec = Executor { r -> handler.post(r) }
              private val recognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }
              private lateinit var prefs: SharedPreferences

              // şablonlar: 0 = Hava Kılıcı, 1 = Öfke
              private val tpl: Array<IntArray> by lazy {
                  arrayOf(decodeTpl(Cfg.T_HAVA), decodeTpl(Cfg.T_OFKE))
              }

              var running = false
              private var busy = false
              private var busySince = 0L
              private var tick = 0
              private var attackTicks = 0
              private val attackReps = 8
              private val castMs = 1600L
              private var castUntil = 0L
              private var startAt = 0L

              private var espOn = true
              private val buffOn = BooleanArray(2)
              private val buffMiss = IntArray(2)
              private val buffLast = LongArray(2) { -1L }
              private val buffPresent = BooleanArray(2)
              private var pendingBuff = -1

              private val seen = LinkedHashMap<String, String>()   // norm -> görünen ad
              private val selectedNames = ArrayList<String>()
              private var selNorms: List<String> = emptyList()
              private var menuDirty = false
              private var buffLine = ""
              private var humanOn = true
              private var wanderOn = true
              private var jxv = 0.15f
              private var jyv = 0.62f
              private var jrv = 10
              private var heading = 0.0
              private var moveUntil = 0L
              private var settings: View? = null
              private var settingsLp: WindowManager.LayoutParams? = null
              private var settingsShown = false
              private var joyLayer: View? = null
              private var candNm = ""
              private var candX = 0f
              private var candY = 0f
              private var candHits = 0
              private var noTarget = 0
              private var lastMove = 0L
              private var targets = 0
              private class Blk(val x: Float, val y: Float, val until: Long)
              private class Tp(val x: Float, val y: Float, val t: Long)
              private val blacklist = ArrayList<Blk>()
              private val taps = ArrayList<Tp>()
              private var lastAction = ""

              private var wm: WindowManager? = null
              private var refreshSec = 0

              // mavi - siyah tema
              private val cBg = 0xF0070B12.toInt()
              private val cStone = 0xFF111B2B.toInt()
              private val cStroke = 0xFF2A6CB8.toInt()
              private val cAccent = 0xFF2F9BFF.toInt()
              private val cCyan = 0xFF7CD0FF.toInt()
              private val cText = 0xFFE6F0FF.toInt()
              private val cMuted = 0xFF8CA0B8.toInt()
              private var espView: EspView? = null
              private var panel: View? = null
              private var menu: View? = null
              private var menuLp: WindowManager.LayoutParams? = null
              private var menuList: LinearLayout? = null
              private var menuShown = false
              private var startBtn: TextView? = null
              private var timeText: TextView? = null
              private var statusText: TextView? = null

              // ---------------- yardımcılar ----------------

              private fun norm(s: String): String {
                  return s.lowercase()
                      .replace('ı', 'i').replace('ş', 's').replace('ç', 'c')
                      .replace('ğ', 'g').replace('ö', 'o').replace('ü', 'u')
                      .filter { it.isLetter() }
              }

              private fun clean(s: String): String {
                  return s.replace(Regex("[^\\p{L} ]"), " ").replace(Regex("\\s+"), " ").trim()
              }

              private fun decodeTpl(b64: String): IntArray {
                  val bytes = Base64.decode(b64, Base64.DEFAULT)
                  return IntArray(bytes.size) { bytes[it].toInt() and 255 }
              }

              private fun removeSafe(v: View?) {
                  if (v == null) return
                  try {
                      wm?.removeView(v)
                  } catch (ex: Exception) {
                  }
              }

              private fun toast(s: String) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show()
              }

              private fun screen(): IntArray {
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm?.defaultDisplay?.getRealMetrics(m)
                  return intArrayOf(m.widthPixels.coerceAtLeast(1), m.heightPixels.coerceAtLeast(1))
              }

              private fun isSel(nm: String): Boolean {
                  return selNorms.any { nm.contains(it) || (nm.length >= 6 && it.contains(nm)) }
              }

              private fun loadCfg() {
                  espOn = prefs.getBoolean("esp", true)
                  humanOn = prefs.getBoolean("human", true)
                  wanderOn = prefs.getBoolean("wander", true)
                  jxv = prefs.getFloat("jx", 0.15f)
                  jyv = prefs.getFloat("jy", 0.62f)
                  jrv = prefs.getInt("jr", 10)
                  refreshSec = prefs.getInt("refresh", 0) * 10
                  for (b in 0 until 2) buffOn[b] = prefs.getBoolean("b$b", true)
                  selectedNames.clear()
                  (prefs.getString("secili", "") ?: "").split(",")
                      .map { it.trim() }.filter { it.isNotEmpty() }.forEach { selectedNames.add(it) }
                  selNorms = selectedNames.map { norm(it) }.filter { it.length >= 4 }
              }

              private fun saveSelected() {
                  prefs.edit().putString("secili", selectedNames.joinToString(",")).apply()
                  selNorms = selectedNames.map { norm(it) }.filter { it.length >= 4 }
              }

              // ---------------- dokunma ----------------

              private fun rnd(a: Float): Float = (Math.random().toFloat() * 2f - 1f) * a

              // Doğal mod: bekleme süreleri düzensiz, ara sıra kısa duraksama
              private fun nextWait(): Long {
                  if (!humanOn) return (400..650).random().toLong()
                  var w = 420L + (Math.random() * Math.random() * 700).toLong() + (Math.random() * 250).toLong()
                  if (Math.random() < 0.06) w += (900..2200).random().toLong()
                  return w
              }

              // Joystick: kayıtlı merkezden verilen yöne (radyan, 90° = yukarı) basılı tutarak sürükle
              private fun joyMove(ang: Double, holdMs: Long) {
                  val s = screen()
                  val jit = if (humanOn) 0.012f * s[1] else 0f
                  val sx = (jxv * s[0] + rnd(jit)).coerceIn(0f, s[0] - 1f)
                  val sy = (jyv * s[1] + rnd(jit)).coerceIn(0f, s[1] - 1f)
                  val rr = jrv / 100f * s[1] * (if (humanOn) 0.85f + Math.random().toFloat() * 0.3f else 1f)
                  val ex = (sx + Math.cos(ang) * rr).toFloat().coerceIn(0f, s[0] - 1f)
                  val ey = (sy - Math.sin(ang) * rr).toFloat().coerceIn(0f, s[1] - 1f)
                  val path = Path()
                  path.moveTo(sx, sy)
                  path.lineTo(ex, ey)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, holdMs))
                      .build()
                  dispatchGesture(g, null, null)
              }

              // Canavar yokken: yönünü yavaş yavaş değiştirerek gez
              private fun wanderStep(now: Long) {
                  heading += (Math.random() - 0.5) * Math.toRadians(100.0)
                  if (Math.random() < 0.2) heading += Math.PI
                  val hold = if (humanOn) (900 + Math.random() * 1400).toLong() else 1500L
                  joyMove(heading, hold)
                  moveUntil = now + hold + (if (humanOn) (300 + Math.random() * 900).toLong() else 400L)
                  lastAction = "Gezinti"
              }

              private fun showDot(cx: Float, cy: Float) {
                  val w = wm ?: return
                  val d = resources.displayMetrics.density
                  val sz = (28 * d).toInt()
                  val dot = View(this)
                  val gd = GradientDrawable()
                  gd.shape = GradientDrawable.OVAL
                  gd.setColor(0xCCFF3030.toInt())
                  dot.background = gd
                  val lp = WindowManager.LayoutParams(
                      sz,
                      sz,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = (cx - sz / 2f).toInt()
                  lp.y = (cy - sz / 2f).toInt()
                  try {
                      w.addView(dot, lp)
                      handler.postDelayed({ removeSafe(dot) }, 800)
                  } catch (ex: Exception) {
                  }
              }

              private fun tapPx(x: Float, y: Float, onFail: (() -> Unit)? = null) {
                  val sz = screen()
                  val j = if (humanOn) 0.008f * sz[1] else 0f
                  val path = Path().apply {
                      moveTo((x + rnd(j)).coerceIn(0f, sz[0] - 1f), (y + rnd(j)).coerceIn(0f, sz[1] - 1f))
                  }
                  val dur = if (humanOn) (45 + (Math.random() * 70).toInt()).toLong() else 60L
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, dur))
                      .build()
                  val cb = object : GestureResultCallback() {
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          onFail?.invoke()
                      }
                  }
                  val ok = dispatchGesture(g, cb, handler)
                  if (!ok) onFail?.invoke()
              }

              private fun tapFrac(fx: Float, fy: Float, onFail: (() -> Unit)? = null) {
                  val s = screen()
                  tapPx(fx * s[0], fy * s[1], onFail)
              }

              // ---------------- buff takibi (şablon eşleştirme) ----------------

              // Sol üst buff satırında şablonu kaydırarak ara; küçük skor = ikon var
              private fun analyzeBuffs(b: Bitmap): FloatArray {
                  val sc = b.height / 1080f
                  val x0 = (0.03f * b.width).toInt()
                  val x1 = (0.30f * b.width).toInt()
                  val y0 = (0.12f * b.height).toInt()
                  val y1 = (0.22f * b.height).toInt()
                  val f = 0.5f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.TW + 2 || rh < Cfg.TH + 2) return floatArrayOf(0f, 0f)
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  return floatArrayOf(slide(px, rw, rh, tpl[0]), slide(px, rw, rh, tpl[1]))
              }

              private fun slide(px: IntArray, rw: Int, rh: Int, t: IntArray): Float {
                  val tw = Cfg.TW
                  val th = Cfg.TH
                  val n = tw * th * 3
                  var best = Int.MAX_VALUE
                  for (y in 0..(rh - th)) {
                      for (x in 0..(rw - tw)) {
                          var s = 0
                          var ti = 0
                          var yy = 0
                          while (yy < th) {
                              var p = (y + yy) * rw + x
                              var xx = 0
                              while (xx < tw) {
                                  val c = px[p++]
                                  s += abs(((c shr 16) and 255) - t[ti]) +
                                      abs(((c shr 8) and 255) - t[ti + 1]) +
                                      abs((c and 255) - t[ti + 2])
                                  ti += 3
                                  xx++
                              }
                              if (s >= best) break
                              yy++
                          }
                          if (s < best) best = s
                      }
                  }
                  return best.toFloat() / n
              }

              // ---------------- canavar tespiti ----------------

              // Etiket yazısı kırmızı mı? (canavar isimleri kırmızı, oyuncular değil)
              private fun isRed(b: Bitmap, r: Rect): Boolean {
                  val x0 = (r.left + 2).coerceIn(0, b.width - 1)
                  val x1 = (r.right - 2).coerceIn(x0 + 1, b.width)
                  val y0 = (r.top + 2).coerceIn(0, b.height - 1)
                  val y1 = (r.bottom - 2).coerceIn(y0 + 1, b.height)
                  var red = 0
                  var tot = 0
                  var y = y0
                  while (y < y1) {
                      var x = x0
                      while (x < x1) {
                          val c = b.getPixel(x, y)
                          tot++
                          if (Color.red(c) > 140 && Color.green(c) < 100 && Color.blue(c) < 100) red++
                          x += 2
                      }
                      y += 2
                  }
                  return tot > 0 && red.toFloat() / tot > 0.04f
              }

              private fun addSeen(name: String) {
                  val nm = norm(name)
                  if (nm.length < 5) return
                  for (key in seen.keys) {
                      if (nm.contains(key)) return
                  }
                  val rm = seen.keys.filter { it.contains(nm) }
                  rm.forEach { seen.remove(it) }
                  seen[nm] = name
                  if (seen.size > 40) {
                      val first = seen.keys.first()
                      seen.remove(first)
                  }
                  menuDirty = true
              }

              private fun refreshStatus() {
                  statusText?.text = buffLine + "\n" + lastAction
              }

              private fun clearEsp() {
                  val ev = espView ?: return
                  ev.boxes = emptyList()
                  ev.tx = -1f
                  ev.invalidate()
              }

              // Karakterin etrafında rastgele bir zemin noktasına dokun (tıkla-git)
              private fun moveRandom(w: Int, h: Int) {
                  val ang = Math.random() * 2 * Math.PI
                  val x = (w * 0.525f + Math.cos(ang) * 0.30 * h).toFloat().coerceIn(w * 0.25f, w * 0.65f)
                  val y = (h * 0.52f + Math.sin(ang) * 0.25 * h).toFloat().coerceIn(h * 0.35f, h * 0.75f)
                  tapPx(x, y)
              }

              private fun handleScan(t: Text, bmp: Bitmap, scores: FloatArray) {
                  val w = bmp.width
                  val h = bmp.height
                  val k = h / 1080f
                  val now = SystemClock.elapsedRealtime()

                  // 1) buff takibi
                  val sb = StringBuilder()
                  for (b in 0 until 2) {
                      val present = scores[b] < 26f
                      buffPresent[b] = present
                      if (present) buffMiss[b] = 0 else buffMiss[b]++
                          // zorla yenile: ikon görünse bile belirlenen süre geçtiyse yeniden bas
                          if (running && buffOn[b] && refreshSec > 0 && buffLast[b] >= 0L && now - buffLast[b] > refreshSec * 1000L) buffMiss[b] = 2
                      if (buffOn[b]) {
                          sb.append(Cfg.BSHORT[b]).append(if (present) " ✓  " else " ✗  ")
                      }
                  }
                  buffLine = sb.toString()

                  // 2) kırmızı isimli canavarlar
                  val mobs = ArrayList<Mob>()
                  for (blk in t.textBlocks) {
                      for (l in blk.lines) {
                          val box = l.boundingBox ?: continue
                          val cx = box.centerX().toFloat()
                          val cy = box.centerY().toFloat()
                          if (cy < h * 0.10f) continue
                          if (cx < w * 0.30f && cy < h * 0.22f) continue
                          if (cx > w * 0.60f && cy < h * 0.16f) continue
                          if (cy > h * 0.80f && cx < w * 0.75f) continue
                          if (cx > w * 0.68f && cy > h * 0.38f) continue
                          if (!isRed(bmp, box)) continue
                          val name = clean(l.text)
                          if (name.length < 4) continue
                          mobs.add(Mob(box, name, norm(name)))
                      }
                  }

                  blacklist.removeAll { it.until <= now }
                  val cands = ArrayList<Pair<Float, Mob>>()
                  var target: Mob? = null
                  var bestD = Float.MAX_VALUE
                  val boxes = ArrayList<EspView.Box>()
                  for (m in mobs) {
                      addSeen(m.name)
                      val sel = isSel(m.nm)
                      val cx = m.box.centerX().toFloat()
                      val top = m.box.bottom + 4f * k
                      boxes.add(EspView.Box(cx - 45f * k, top, cx + 45f * k, top + 160f * k, sel))
                      val cyb = m.box.bottom + h * 0.05f
                      val blocked = blacklist.any { abs(it.x - cx) < 0.06f * h && abs(it.y - cyb) < 0.06f * h }
                      if (sel && !blocked) {
                          val dx = cx - w * 0.525f
                          val dy = m.box.centerY() - h * 0.48f
                          val dd = dx * dx + dy * dy
                          cands.add(Pair(dd, m))
                      }
                  }
                  cands.sortBy { it.first }
                  if (cands.isNotEmpty()) {
                      target = cands[0].second
                      if (humanOn && cands.size > 1 && Math.random() < 0.2) target = cands[1].second
                  }
                  val tg = target

                  // 3) ESP çiz
                  val ev = espView
                  if (ev != null) {
                      if (espOn) {
                          ev.bw = w
                          ev.bh = h
                          ev.boxes = boxes
                          ev.px = w * 0.525f
                          ev.py = h * 0.52f
                          if (tg != null) {
                              ev.tx = tg.box.centerX().toFloat()
                              ev.ty = tg.box.bottom + 80f * k
                          } else {
                              ev.tx = -1f
                          }
                          ev.invalidate()
                      } else {
                          clearEsp()
                      }
                  }

                  // 4) kararlar (sadece av çalışıyorsa)
                  if (running) {
                      if (pendingBuff < 0) {
                          for (b in 0 until 2) {
                              if (buffOn[b] && buffMiss[b] >= 2 && (buffLast[b] < 0L || now - buffLast[b] > 6000L)) {
                                  pendingBuff = b
                                  break
                              }
                          }
                      }
                      if (pendingBuff < 0 && now >= castUntil && attackTicks == 0) {
                          if (tg != null) {
                              val gx = tg.box.centerX().toFloat()
                              val gy = tg.box.bottom + h * 0.05f
                              noTarget = 0
                              // kararlı hedef: aynı canavar iki taramada aynı yerde görünmeli
                              if (tg.nm == candNm && abs(gx - candX) < 0.05f * h && abs(gy - candY) < 0.05f * h) {
                                  candHits++
                              } else {
                                  candHits = 1
                              }
                              candNm = tg.nm
                              candX = gx
                              candY = gy
                              if (candHits >= 2) {
                                  taps.removeAll { now - it.t > 12000L }
                                  val same = taps.count { abs(it.x - gx) < 0.06f * h && abs(it.y - gy) < 0.06f * h }
                                  if (same >= 3) {
                                      // aynı noktaya tekrar tekrar basıldı: ulaşılamıyor, kara listeye al
                                      blacklist.add(Blk(gx, gy, now + 20000L))
                                      taps.clear()
                                      candHits = 0
                                      lastAction = "Ulaşılamayan hedef atlandı"
                                  } else {
                                      tapPx(gx, gy)
                                      taps.add(Tp(gx, gy, now))
                                      attackTicks = if (humanOn) (6..11).random() else attackReps
                                      moveUntil = 0L
                                      targets++
                                      candHits = 0
                                      lastAction = "Hedef: " + tg.name
                                  }
                              } else {
                                  lastAction = "Doğrulanıyor: " + tg.name
                              }
                          } else {
                              candHits = 0
                              noTarget++
                              if (wanderOn && noTarget >= 3) {
                                  if (now >= moveUntil) {
                                      if (noTarget % 4 == 3) {
                                          tapFrac(Cfg.HX, Cfg.HY)
                                          lastAction = "Eşya topla"
                                      } else {
                                          wanderStep(now)
                                      }
                                  }
                              } else {
                                  tapFrac(Cfg.HX, Cfg.HY)
                                  lastAction = "Canavar yok, eşya topla"
                                  // gezinti kapalıysa uzun süre canavar yoksa yer değiştir
                                  if (!wanderOn && noTarget >= 12 && now - lastMove > 6000L) {
                                      noTarget = 0
                                      lastMove = now
                                      moveRandom(w, h)
                                      lastAction = "Canavar yok: yer değiştiriliyor"
                                  }
                              }
                          }
                      }
                  }
                  refreshStatus()
                  if (menuShown && menuDirty) {
                      menuDirty = false
                      refreshMenuList()
                  }
              }

              private fun scan() {
                  val now = SystemClock.elapsedRealtime()
                  if (busy && now - busySince > 5000L) busy = false
                  if (busy) return
                  busy = true
                  busySince = now
                  takeScreenshot(Display.DEFAULT_DISPLAY, exec, object : TakeScreenshotCallback {
                      override fun onSuccess(r: ScreenshotResult) {
                          val hb = r.hardwareBuffer
                          val bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                              ?.copy(Bitmap.Config.ARGB_8888, false)
                          hb.close()
                          if (bmp == null) {
                              busy = false
                              return
                          }
                          val sc = analyzeBuffs(bmp)
                          recognizer.process(InputImage.fromBitmap(bmp, 0))
                              .addOnSuccessListener { t ->
                                  handleScan(t, bmp, sc)
                                  busy = false
                              }
                              .addOnFailureListener { busy = false }
                      }

                      override fun onFailure(code: Int) {
                          busy = false
                      }
                  })
              }

              // ---------------- döngüler ----------------

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      var wait = nextWait()
                      tick++
                      if (now >= castUntil) {
                          if (pendingBuff >= 0) {
                              val b = pendingBuff
                              pendingBuff = -1
                              buffLast[b] = now
                              buffMiss[b] = 0
                              lastAction = Cfg.BNAME[b] + " basıldı"
                              tapFrac(Cfg.BX[b], Cfg.BY[b]) { buffLast[b] = -1L }
                              castUntil = now + castMs
                              wait = castMs
                          } else if (attackTicks > 0) {
                              attackTicks--
                              if (tick % 4 == 0) tapFrac(Cfg.HX, Cfg.HY) else tapFrac(Cfg.AX, Cfg.AY)
                          }
                      }
                      if (attackTicks == 0 || tick % 3 == 0) scan()
                      handler.postDelayed(this, wait)
                  }
              }

              // av durmuşken ESP ve canavar listesi için yavaş tarama
              private val idle = object : Runnable {
                  override fun run() {
                      if (!running && (espOn || menuShown) && Build.VERSION.SDK_INT >= 30) scan()
                      handler.postDelayed(this, 1200)
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      if (now < startAt) {
                          timeText?.text = "başlıyor"
                      } else {
                          val s = (now - startAt) / 1000
                          timeText?.text = "%02d:%02d · %d hedef".format(s / 60, s % 60, targets)
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun stopAll() {
                  running = false
                  handler.removeCallbacks(loop)
                  handler.removeCallbacks(ticker)
                  attackTicks = 0
                  pendingBuff = -1
                  startBtn?.text = "▶"
                  timeText?.text = ""
                  lastAction = ""
                  refreshStatus()
              }

              fun toggle() {
                  if (running) {
                      stopAll()
                      return
                  }
                  if (Build.VERSION.SDK_INT < 30) {
                      toast("Oto av için Android 11 veya üstü gerekli")
                      return
                  }
                  loadCfg()
                  if (selNorms.isEmpty()) {
                      toast("Canavar seçilmedi: ☰ menüsünden seç. Şimdilik sadece buff ve eşya toplama çalışır.")
                  }
                  running = true
                  attackTicks = 0
                  pendingBuff = -1
                  castUntil = 0L
                  tick = 0
                  candHits = 0
                  noTarget = 0
                  lastMove = 0L
                  targets = 0
                  moveUntil = 0L
                  heading = Math.random() * 2 * Math.PI
                  blacklist.clear()
                  taps.clear()
                  for (b in 0 until 2) {
                      buffMiss[b] = 0
                      buffLast[b] = -1L
                  }
                  startAt = SystemClock.elapsedRealtime() + 3000L
                  startBtn?.text = "■"
                  handler.postDelayed(loop, 3000L)
                  handler.post(ticker)
              }

              // ---------------- canavar menüsü ----------------

              private fun setSelected(disp: String, on: Boolean) {
                  val nm = norm(disp)
                  if (on) {
                      if (selectedNames.none { norm(it) == nm }) selectedNames.add(disp)
                  } else {
                      selectedNames.removeAll { val x = norm(it); x == nm || x.contains(nm) || nm.contains(x) }
                  }
                  saveSelected()
              }

              private fun refreshMenuList() {
                  val list = menuList ?: return
                  val d = resources.displayMetrics.density
                  list.removeAllViews()
                  val names = LinkedHashMap<String, String>()
                  for (e in seen) names[e.key] = e.value
                  for (s in selectedNames) {
                      val nm = norm(s)
                      if (names.keys.none { it.contains(nm) || nm.contains(it) }) names[nm] = s
                  }
                  if (names.isEmpty()) {
                      list.addView(TextView(this).apply {
                          text = "Henüz canavar görülmedi. Oyunda kırmızı isimli canavarlara bak, burada listelenir."
                          textSize = 12f
                          setTextColor(0xFF9AA0AA.toInt())
                      })
                      return
                  }
                  for (e in names) {
                      val nm = e.key
                      val disp = e.value
                      val cb = CheckBox(this)
                      cb.text = disp
                      cb.textSize = 13f
                      cb.setTextColor(cText)
                              cb.buttonTintList = ColorStateList.valueOf(cAccent)
                      cb.setPadding(0, (2 * d).toInt(), 0, (2 * d).toInt())
                      cb.isChecked = isSel(nm)
                      cb.setOnCheckedChangeListener { _, on -> setSelected(disp, on) }
                      list.addView(cb)
                  }
              }

              private fun dpx(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun shape(fill: Int, stroke: Int, rDp: Int, strokeDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dpx(rDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dpx(strokeDp), stroke)
                  return g
              }

              // taş görünümlü düğme (koyu zemin, mavi kenar)
              private fun stoneBtn(label: String, sp: Float, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = sp
                  t.setTextColor(cText)
                  t.gravity = Gravity.CENTER
                  t.setTypeface(t.typeface, Typeface.BOLD)
                  t.background = shape(cStone, cStroke, 8, 1)
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun styledSwitch(label: String, init: Boolean, onChange: (Boolean) -> Unit): Switch {
                  val sw = Switch(this)
                  sw.text = label
                  sw.setTextColor(cText)
                  sw.textSize = 13f
                  sw.isChecked = init
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(cAccent, 0xFF6B7A8E.toInt()))
                  sw.trackTintList = ColorStateList(states, intArrayOf(0x662F9BFF, 0x44FFFFFF))
                  sw.setPadding(0, dpx(4), 0, dpx(4))
                  sw.setOnCheckedChangeListener { _, on -> onChange(on) }
                  return sw
              }

