              private fun slotText(x: Float): String = if (x >= 0f) "Yuva: ayarlı" else "Yuva: ayarlanmadı"

              private fun skillInfo(i: Int): String {
                  val t = if (smode[i] == 2) {
                      if (sTplP[i] != null && sTplA[i] != null) "düğme aktif / pasif izleniyor"
                      else "düğme görünümü öğrenilmedi, her " + secs[i] + " sn yeniler"
                  } else if (smode[i] == 1) {
                      if (tplBuff[i] == null) "ikon öğrenilmedi, her " + secs[i] + " sn yeniler"
                      else if (useTimer[i]) "ikon görünmedi, her " + secs[i] + " sn yeniler"
                      else "ikon öğrenildi, sol üstte izleniyor"
                  } else {
                      "takip yok, her " + secs[i] + " sn yeniler"
                  }
                  return slotText(bx[i]) + "  ·  " + t
              }

              private fun nisanInfo(): String {
                  val t = if (nMode == 0) "takip yok (otomatik basmaz)"
                  else if (nMode == 2) "oto hedef: kırmızı canavar ismini bulup dokunur"
                  else if (nTplP != null && nTplA != null) "aktif / pasif izleniyor"
                  else "görünüm öğrenilmedi"
                  return slotText(nX) + "  ·  " + t
              }

