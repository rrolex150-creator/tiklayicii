name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK lisanslarini kabul et
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proj/app/src/main/java/com/benim/tiklayici
          mkdir -p proj/app/src/main/res/xml proj/app/src/main/res/values proj/app/src/main/res/drawable

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Tiklayici"
          include ':app'
          EOF

          cat > proj/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.benim.tiklayici'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.benim.tiklayici'
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName '7.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:icon="@drawable/ic_logo"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Oto Av</string>
              <string name="aciklama">Oto Av: Hava Kılıcı ve Öfke becerilerini bitince hemen yeniler, Nişan pasif olunca açar, eşya toplar</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/aciklama" />
          EOF

          cat > proj/app/src/main/res/drawable/ic_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#05080E"
                  android:pathData="M54,4 A50,50 0 1,1 53.9,4 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#1F6FE0" android:strokeWidth="4"
                  android:pathData="M54,7 A47,47 0 1,1 53.9,7 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#6FCBFF" android:strokeWidth="1.2"
                  android:pathData="M54,13 A41,41 0 1,1 53.9,13 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#2F9BFF" android:strokeWidth="2.5"
                  android:strokeLineCap="round"
                  android:pathData="M18,46 Q22,30 38,22 M90,62 Q86,78 70,86" />
              <path android:fillColor="#00000000" android:strokeColor="#E8F1FF" android:strokeWidth="5.5"
                  android:strokeLineCap="round"
                  android:pathData="M28,80 L80,28 M80,80 L28,28" />
              <path android:fillColor="#00000000" android:strokeColor="#2F9BFF" android:strokeWidth="4.5"
                  android:strokeLineCap="round"
