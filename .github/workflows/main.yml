              private fun applyHand(hs: FloatArray) {
                  hState = if (minOf(hs[0], hs[1]) > 40f) 0
                  else if (hs[0] < hs[1] - 3f) 1
                  else if (hs[1] < hs[0] - 3f) 2
                  else hState
              }

              private fun applyRevive(rv: Float) {
                  if (rv >= 24f || rvFx < 0f || !running) return
                  val now = SystemClock.elapsedRealtime()
                  restUntil = now + rvWait * 1000L
                  if (now - rvLastTap > 1400L) {
                      tapFrac(rvFx, rvFy)
                      rvLastTap = now
                      rvCount++
                  }
              }

              // Beceri ikonunu ekranda bulur, yuvayı kaydeder, basıp dener
              private fun autoFind(i: Int) {
                  if (Build.VERSION.SDK_INT < 30) {
                      toast("Android 11 veya üstü gerekli")
                      return
                  }
                  if (autoBusy) return
                  autoBusy = true
                  val pf = profile
                  val kk = "s" + pf + "_" + i + "_"
                  val q = Cfg.SICON[pf][i]
                  val nm = Cfg.SNAME[pf][i]
                  showMenu(false)
                  panel?.visibility = View.INVISIBLE
                  toast(nm + " aranıyor...")
                  fun finish(msg: String) {
                      autoBusy = false
                      panel?.visibility = if (inGame) View.VISIBLE else View.GONE
                      showMenu(true)
                      toast(msg)
                  }
                  handler.postDelayed({
                      grab { a ->
                          if (a == null) {
                              handler.post { finish("Ekran görüntüsü alınamadı") }
                          } else {
                              var r: FloatArray? = null
                              try {
                                  r = findSlot(a, q)
                              } catch (ex: Exception) {
                              }
                              if (r == null) {
                                  handler.post { finish(nm + " ekranda bulunamadı. Oyundayken dene ya da Elle göster") }
                              } else {
                                  val fx = r[0]
                                  val fy = r[1]
                                  val szf = r[3]
                                  prefs.edit().putFloat(kk + "x", fx).putFloat(kk + "y", fy).commit()
                                  handler.post {
                                      tapFrac(fx, fy)
                                      handler.postDelayed({
                                          grab { b ->
                                              val ch = if (b != null) slotChange(a, b, fx, fy, szf) else 0f
                                              handler.post {
                                                  finish(if (ch > 8f) nm + ": yuva bulundu, basınca düğme değişti (çalışıyor)"
                                                  else nm + ": yuva bulundu, basıldı ama değişim görülmedi")
                                              }
                                          }
                                      }, 700L)
                                  }
                              }
                          }
                      }
                  }, 600L)
              }

