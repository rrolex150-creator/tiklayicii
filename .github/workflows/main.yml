              private fun styledSwitch(label: String, init: Boolean, onChange: (Boolean) -> Unit): Switch {
                  val sw = Switch(this)
                  sw.text = label
                  sw.setTextColor(cText)
                  sw.textSize = 13f
                  sw.isChecked = init
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(cAccent, 0xFF7B6A4A.toInt()))
                  sw.trackTintList = ColorStateList(states, intArrayOf(0x66C99A3C, 0x44FFFFFF))
                  sw.setPadding(0, dpx(5), 0, dpx(5))
                  sw.setOnCheckedChangeListener { _, on -> onChange(on) }
                  return sw
              }

