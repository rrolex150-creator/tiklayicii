                  btn.gravity = Gravity.CENTER
                  btn.background = shape(cAccent, 0xFF9ADBFF.toInt(), dp(12).toFloat(), dp(1))
                  btn.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  val blp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48))
                  blp.topMargin = dp(16)
                  col.addView(btn, blp)

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(cBg)
                  sv.addView(col)
                  setContentView(sv)
              }
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/ClickService.kt <<'EOF'
          package com.benim.tiklayici

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityService.ScreenshotResult
          import android.accessibilityservice.AccessibilityService.TakeScreenshotCallback
          import android.accessibilityservice.GestureDescription
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Base64
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import java.util.concurrent.Executors
          import kotlin.math.abs

          class ClickService : AccessibilityService() {

              companion object {
                  var inst: ClickService? = null
              }

              private val handler = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()
              private lateinit var prefs: SharedPreferences
              private var wm: WindowManager? = null

              private val tplBuff: Array<IntArray> by lazy { arrayOf(decodeTpl(Cfg.T_HAVA), decodeTpl(Cfg.T_OFKE)) }
              private val tplNP: IntArray by lazy { decodeTpl(Cfg.T_NP) }
              private val tplNA: IntArray by lazy { decodeTpl(Cfg.T_NA) }

              // ayarlar
              private val skillOn = BooleanArray(2)
              private var nisanOn = true
              private var pickOn = true
              private var pickMs = 500

              // durum
              var running = false
              private var busy = false
              private var busySince = 0L
              private val present = BooleanArray(2)
              private val miss = IntArray(2)
              private val lastCast = LongArray(2)
              private var nisanState = 0      // 0 = bilinmiyor, 1 = pasif, 2 = aktif
              private var scoreP = 99f
              private var scoreA = 99f
              private val scoreB = floatArrayOf(99f, 99f)
              private var lastTap = 0L
              private var lastNisan = 0L
              private var skillLock = 0L
              private var startAt = 0L
              private var nisanCount = 0
              private var skillCount = 0
              private var pickCount = 0
              private val recastGap = 1800L
              private val castLockMs = 650L
              private val nisanGap = 700L

              // arayüz
              private var panel: View? = null
              private var menu: View? = null
              private var menuLp: WindowManager.LayoutParams? = null
              private var menuShown = false
              private var startBtn: TextView? = null
              private var timeText: TextView? = null
              private var statusText: TextView? = null
              private var liveTv: TextView? = null

              // mavi - siyah tema
              private val cBg = 0xF0070B12.toInt()
              private val cStone = 0xFF111B2B.toInt()
              private val cStroke = 0xFF2A6CB8.toInt()
              private val cAccent = 0xFF2F9BFF.toInt()
              private val cCyan = 0xFF7CD0FF.toInt()
              private val cText = 0xFFE6F0FF.toInt()
              private val cMuted = 0xFF8CA0B8.toInt()

              // ---------------- yardımcılar ----------------

              private fun decodeTpl(b64: String): IntArray {
                  val bytes = Base64.decode(b64, Base64.DEFAULT)
                  return IntArray(bytes.size) { bytes[it].toInt() and 255 }
              }

              private fun removeSafe(v: View?) {
                  if (v == null) return
                  try {
                      wm?.removeView(v)
                  } catch (ex: Exception) {
                  }
              }

              private fun toast(s: String) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              }

              private fun screen(): IntArray {
                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm?.defaultDisplay?.getRealMetrics(m)
                  return intArrayOf(m.widthPixels.coerceAtLeast(1), m.heightPixels.coerceAtLeast(1))
              }

              private fun loadCfg() {
                  nisanOn = prefs.getBoolean("nisan", true)
                  pickOn = prefs.getBoolean("pick", true)
                  pickMs = prefs.getInt("pickms", 500)
                  for (b in 0 until 2) skillOn[b] = prefs.getBoolean("b$b", true)
              }

              // ---------------- dokunma ----------------

              private fun tapFrac(fx: Float, fy: Float) {
                  val s = screen()
                  val j = 0.004f * s[1]
                  val x = (fx * s[0] + (Math.random().toFloat() * 2f - 1f) * j).coerceIn(0f, s[0] - 1f)
                  val y = (fy * s[1] + (Math.random().toFloat() * 2f - 1f) * j).coerceIn(0f, s[1] - 1f)
                  val path = Path()
                  path.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                      .build()
                  dispatchGesture(g, null, null)
                  lastTap = SystemClock.elapsedRealtime()
              }

              // ---------------- görüntü analizi (şablon eşleştirme) ----------------

              // Küçük skor = şablon bulundu. Ortalama mutlak renk farkı döner.
              private fun slide(px: IntArray, rw: Int, rh: Int, t: IntArray, tw: Int, th: Int): Float {
                  val n = tw * th * 3
                  var best = Int.MAX_VALUE
                  for (y in 0..(rh - th)) {
                      for (x in 0..(rw - tw)) {
                          var s = 0
                          var ti = 0
                          var yy = 0
                          while (yy < th) {
                              var p = (y + yy) * rw + x
                              var xx = 0
                              while (xx < tw) {
                                  val c = px[p++]
                                  s += abs(((c shr 16) and 255) - t[ti]) +
                                      abs(((c shr 8) and 255) - t[ti + 1]) +
                                      abs((c and 255) - t[ti + 2])
                                  ti += 3
                                  xx++
                              }
                              if (s >= best) break
                              yy++
                          }
                          if (s < best) best = s
                      }
                  }
                  return best.toFloat() / n
              }

              // Sol üst buff satırı: Hava Kılıcı ve Öfke ikonları var mı?
              private fun analyzeBuffs(b: Bitmap): FloatArray {
                  val sc = b.height / 1080f
                  val x0 = (0.03f * b.width).toInt()
                  val x1 = (0.30f * b.width).toInt()
                  val y0 = (0.12f * b.height).toInt()
                  val y1 = (0.22f * b.height).toInt()
                  val f = 0.5f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.TW + 2 || rh < Cfg.TH + 2) return floatArrayOf(99f, 99f)
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  return floatArrayOf(
                      slide(px, rw, rh, tplBuff[0], Cfg.TW, Cfg.TH),
                      slide(px, rw, rh, tplBuff[1], Cfg.TW, Cfg.TH)
                  )
              }

              // Nişan düğmesi: pasif mi aktif mi? Konumun çevresinde iki şablonu da arar.
              private fun analyzeNisan(b: Bitmap): FloatArray {
                  val sc = b.height / 1080f
                  val cx = (Cfg.NX * b.width).toInt()
                  val cy = (Cfg.NY * b.height).toInt()
                  val r = (103 * sc).toInt()
                  val x0 = (cx - r).coerceAtLeast(0)
                  val y0 = (cy - r).coerceAtLeast(0)
                  val x1 = (cx + r).coerceAtMost(b.width)
                  val y1 = (cy + r).coerceAtMost(b.height)
                  val f = 0.25f / sc
                  val rw = ((x1 - x0) * f).toInt()
                  val rh = ((y1 - y0) * f).toInt()
                  if (rw < Cfg.NT + 2 || rh < Cfg.NT + 2) return floatArrayOf(99f, 99f)
                  val reg = Bitmap.createBitmap(b, x0, y0, x1 - x0, y1 - y0)
                  val small = Bitmap.createScaledBitmap(reg, rw, rh, true)
                  val px = IntArray(rw * rh)
                  small.getPixels(px, 0, rw, 0, 0, rw, rh)
                  return floatArrayOf(
                      slide(px, rw, rh, tplNP, Cfg.NT, Cfg.NT),
                      slide(px, rw, rh, tplNA, Cfg.NT, Cfg.NT)
                  )
              }

              private fun scan() {
                  val now = SystemClock.elapsedRealtime()
                  if (busy && now - busySince > 3000L) busy = false
                  if (busy) return
                  busy = true
                  busySince = now
                  takeScreenshot(Display.DEFAULT_DISPLAY, worker, object : TakeScreenshotCallback {
                      override fun onSuccess(r: ScreenshotResult) {
                          try {
                              val hb = r.hardwareBuffer
                              val bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                                  ?.copy(Bitmap.Config.ARGB_8888, false)
                              hb.close()
                              if (bmp == null) {
                                  handler.post { busy = false }
                                  return
                              }
                              val bs = analyzeBuffs(bmp)
                              val ns = analyzeNisan(bmp)
                              handler.post {
                                  busy = false
                                  applyScan(bs, ns)
                              }
                          } catch (ex: Exception) {
                              handler.post { busy = false }
                          }
                      }

                      override fun onFailure(code: Int) {
                          handler.post { busy = false }
                      }
                  })
              }

              private fun applyScan(bs: FloatArray, ns: FloatArray) {
                  for (b in 0 until 2) {
                      scoreB[b] = bs[b]
                      val p = bs[b] < Cfg.BTH
                      present[b] = p
                      if (p) miss[b] = 0 else miss[b]++
                  }
                  scoreP = ns[0]
                  scoreA = ns[1]
                  nisanState = if (minOf(scoreP, scoreA) > 40f) 0
                  else if (scoreP < scoreA - 3f) 1
                  else if (scoreA < scoreP - 3f) 2
                  else 0
                  updateStatus()
                  if (running) decide(SystemClock.elapsedRealtime())
              }

              // ---------------- karar: görülen anda hemen bas ----------------

              private fun decide(now: Long) {
                  if (now - lastTap < 90L) return
                  // 1) Nişan pasif oldu: anında tekrar aç
                  if (nisanOn && nisanState == 1 && now - lastNisan > nisanGap) {
                      tapFrac(Cfg.NX, Cfg.NY)
                      lastNisan = now
                      nisanCount++
                      return
                  }
                  // 2) Hava Kılıcı / Öfke bitti: anında yenile
                  if (now >= skillLock) {
                      for (b in 0 until 2) {
                          if (skillOn[b] && miss[b] >= 1 && now - lastCast[b] > recastGap) {
                              tapFrac(Cfg.BX[b], Cfg.BY[b])
                              lastCast[b] = now
                              miss[b] = 0
                              skillLock = now + castLockMs
                              skillCount++
                              return
                          }
                      }
                  }
              }

              // ---------------- döngüler ----------------

              // sürekli tarama (ekran görüntüsü sınırı izin verdiği kadar hızlı)
              private val scanLoop = object : Runnable {
                  override fun run() {
                      if (Build.VERSION.SDK_INT >= 30 && (running || panel != null)) scan()
                      handler.postDelayed(this, if (running) 60L else 600L)
                  }
              }

              private val pickLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      var wait = pickMs.toLong()
                      if (pickOn) {
                          if (now - lastTap < 120L) {
                              wait = 60L
                          } else {
                              tapFrac(Cfg.HX, Cfg.HY)
                              pickCount++
                          }
                      }
                      handler.postDelayed(this, wait)
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val s = (SystemClock.elapsedRealtime() - startAt) / 1000
                      timeText?.text = "%02d:%02d · N%d B%d T%d".format(s / 60, s % 60, nisanCount, skillCount, pickCount)
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun stateLine(): String {
                  val sb = StringBuilder()
                  sb.append("Hava ").append(if (present[0]) "✓" else "✗").append("  ")
                  sb.append("Öfke ").append(if (present[1]) "✓" else "✗").append("  ")
                  sb.append("Nişan ").append(if (nisanState == 2) "✓" else if (nisanState == 1) "○" else "?")
                  return sb.toString()
              }

              private fun updateStatus() {
                  statusText?.text = stateLine()
                  liveTv?.text = "Hava %s (%.0f)   Öfke %s (%.0f)\nNişan: %s (pasif %.0f / aktif %.0f)".format(
                      if (present[0]) "✓" else "✗", scoreB[0],
                      if (present[1]) "✓" else "✗", scoreB[1],
                      if (nisanState == 2) "AKTİF" else if (nisanState == 1) "PASİF" else "bulunamadı",
                      scoreP, scoreA
                  )
              }

              private fun stopAll() {
                  running = false
                  handler.removeCallbacks(pickLoop)
                  handler.removeCallbacks(ticker)
                  startBtn?.text = "▶"
                  timeText?.text = ""
              }

              fun toggle() {
                  if (running) {
                      stopAll()
                      return
                  }
                  if (Build.VERSION.SDK_INT < 30) {
                      toast("Android 11 veya üstü gerekli")
                      return
                  }
                  loadCfg()
                  running = true
                  nisanCount = 0
                  skillCount = 0
                  pickCount = 0
                  lastNisan = 0L
                  skillLock = 0L
                  for (b in 0 until 2) {
                      miss[b] = 0
                      lastCast[b] = 0L
                  }
                  startAt = SystemClock.elapsedRealtime()
                  startBtn?.text = "■"
                  handler.post(pickLoop)
                  handler.post(ticker)
                  scan()
              }

              // ---------------- arayüz yardımcıları ----------------

              private fun dpx(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun shape(fill: Int, stroke: Int, rDp: Int, strokeDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dpx(rDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dpx(strokeDp), stroke)
                  return g
              }

              // taş görünümlü düğme (koyu zemin, mavi kenar)
              private fun stoneBtn(label: String, sp: Float, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = sp
                  t.setTextColor(cText)
                  t.gravity = Gravity.CENTER
                  t.setTypeface(t.typeface, Typeface.BOLD)
                  t.background = shape(cStone, cStroke, 8, 1)
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun styledSwitch(label: String, init: Boolean, onChange: (Boolean) -> Unit): Switch {
                  val sw = Switch(this)
                  sw.text = label
                  sw.setTextColor(cText)
                  sw.textSize = 13f
                  sw.isChecked = init
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(cAccent, 0xFF6B7A8E.toInt()))
                  sw.trackTintList = ColorStateList(states, intArrayOf(0x662F9BFF, 0x44FFFFFF))
                  sw.setPadding(0, dpx(5), 0, dpx(5))
                  sw.setOnCheckedChangeListener { _, on -> onChange(on) }
                  return sw
              }

              private fun sectionHead(t: String): TextView {
                  val h = TextView(this)
                  h.text = t
                  h.textSize = 12f
                  h.setTypeface(h.typeface, Typeface.BOLD)
                  h.setTextColor(cCyan)
                  h.setPadding(0, dpx(10), 0, dpx(2))
                  return h
              }

              private fun drag(handle: View, target: View, lp: WindowManager.LayoutParams) {
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  handle.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX
                          sy = e.rawY
                          ox = lp.x
                          oy = lp.y
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          lp.x = ox + (e.rawX - sx).toInt()
                          lp.y = oy + (e.rawY - sy).toInt()
                          try {
                              wm?.updateViewLayout(target, lp)
                          } catch (ex: Exception) {
                          }
                      }
                      true
                  }
              }

              private fun testRow(a: String, fa: () -> Unit, b: String, fb: () -> Unit): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val ba = stoneBtn(a, 12f, fa)
                  val bb = stoneBtn(b, 12f, fb)
                  val p1 = LinearLayout.LayoutParams(0, dpx(40), 1f)
                  p1.topMargin = dpx(4)
                  p1.rightMargin = dpx(3)
                  val p2 = LinearLayout.LayoutParams(0, dpx(40), 1f)
                  p2.topMargin = dpx(4)
                  p2.leftMargin = dpx(3)
                  row.addView(ba, p1)
                  row.addView(bb, p2)
                  return row
              }

              // ---------------- kontrol menüsü ----------------

              private fun buildMenu(): View {
                  val sc = screen()
                  val w = minOf(dpx(310), (sc[0] * 0.46f).toInt())

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.background = shape(cBg, cAccent, 14, 2)
                  root.setPadding(dpx(10), dpx(8), dpx(10), dpx(8))

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  row.addView(logo, LinearLayout.LayoutParams(dpx(26), dpx(26)))
                  val title = TextView(this)
                  title.text = "KONTROL"
                  title.textSize = 14f
                  title.letterSpacing = 0.08f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  title.setTextColor(cCyan)
                  title.setPadding(dpx(8), 0, 0, 0)
                  row.addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  val close = stoneBtn("✕", 14f) { showMenu(false) }
                  row.addView(close, LinearLayout.LayoutParams(dpx(40), dpx(32)))
                  root.addView(row)

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL

                  val live = TextView(this)
                  live.textSize = 11f
                  live.setTextColor(cMuted)
                  live.setPadding(dpx(8), dpx(6), dpx(8), dpx(6))
                  live.background = shape(0xFF0A1220.toInt(), 0xFF14263F.toInt(), 8, 1)
                  liveTv = live
                  col.addView(live, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  updateStatus()

                  col.addView(sectionHead("AKTİF / PASİF"))
                  col.addView(styledSwitch("Nişan: pasif olunca hemen aç", nisanOn) { on ->
                      nisanOn = on
                      prefs.edit().putBoolean("nisan", on).apply()
                  })
                  for (b in 0 until 2) {
                      col.addView(styledSwitch(Cfg.BNAME[b] + ": bitince hemen bas", skillOn[b]) { on ->
                          skillOn[b] = on
                          prefs.edit().putBoolean("b$b", on).apply()
                      })
                  }
                  col.addView(styledSwitch("Oto toplama (el düğmesi)", pickOn) { on ->
                      pickOn = on
                      prefs.edit().putBoolean("pick", on).apply()
                  })

                  val pl = TextView(this)
                  pl.textSize = 12f
                  pl.setTextColor(cText)
                  pl.setPadding(0, dpx(6), 0, 0)
                  pl.text = "Toplama aralığı: " + pickMs + " ms"
                  col.addView(pl)
                  val pb = SeekBar(this)
                  pb.max = 13
                  pb.progress = ((pickMs - 200) / 100).coerceIn(0, 13)
                  pb.progressTintList = ColorStateList.valueOf(cAccent)
                  pb.thumbTintList = ColorStateList.valueOf(cCyan)
                  pb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          pickMs = 200 + p * 100
                          pl.text = "Toplama aralığı: " + pickMs + " ms"
                          prefs.edit().putInt("pickms", pickMs).apply()
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}

                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })
                  col.addView(pb)

                  col.addView(sectionHead("DENE (tıklayarak)"))
                  col.addView(testRow("Nişan dene", {
                      tapFrac(Cfg.NX, Cfg.NY)
                      toast("Nişan düğmesine basıldı")
                  }, "Topla dene", {
                      tapFrac(Cfg.HX, Cfg.HY)
                      toast("El düğmesine basıldı")
                  }))
                  col.addView(testRow("Hava Kılıcı dene", {
                      tapFrac(Cfg.BX[0], Cfg.BY[0])
                      toast("Hava Kılıcı basıldı")
                  }, "Öfke dene", {
                      tapFrac(Cfg.BX[1], Cfg.BY[1])
                      toast("Öfke basıldı")
                  }))

                  val sv = ScrollView(this)
                  sv.addView(col)
                  root.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (sc[1] * 0.62f).toInt().coerceAtLeast(dpx(140))))

                  val lp = menuLp ?: WindowManager.LayoutParams(
                      w,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).also {
                      it.gravity = Gravity.TOP or Gravity.START
                      it.x = (sc[0] - w) / 2
                      it.y = dpx(56)
                      menuLp = it
                  }
                  drag(title, root, lp)
                  return root
              }

              private fun showMenu(on: Boolean) {
                  val w = wm ?: return
                  if (on && !menuShown) {
                      loadCfg()
                      removeSafe(menu)
                      val fresh = buildMenu()
                      val lp = menuLp ?: return
                      menu = fresh
                      w.addView(fresh, lp)
                      menuShown = true
                  } else if (!on && menuShown) {
                      removeSafe(menu)
                      liveTv = null
                      menuShown = false
                  }
              }

              // ---------------- servis ----------------

              override fun onServiceConnected() {
                  prefs = getSharedPreferences("ayar", MODE_PRIVATE)
                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  removeSafe(panel)
                  removeSafe(menu)
                  menuShown = false
                  loadCfg()
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  // yüzen pencere: küçük, mavi-siyah, logodan sürüklenir, logoya dokununca küçülür
                  val scr = screen()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = shape(cBg, cAccent, 14, 2)
                  box.setPadding(dp(6), dp(5), dp(6), dp(5))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  top.addView(logo, LinearLayout.LayoutParams(dp(34), dp(34)))

                  val ctl = LinearLayout(this)
                  ctl.orientation = LinearLayout.HORIZONTAL
                  val sBtn = stoneBtn("▶", 16f) { toggle() }
                  startBtn = sBtn
                  val mBtn = stoneBtn("☰", 16f) { showMenu(!menuShown) }
                  for (bv in listOf(sBtn, mBtn)) {
                      val p = LinearLayout.LayoutParams(dp(40), dp(34))
                      p.leftMargin = dp(5)
                      ctl.addView(bv, p)
                  }
                  top.addView(ctl)
                  box.addView(top)

                  val info = LinearLayout(this)
                  info.orientation = LinearLayout.VERTICAL
                  info.setPadding(dp(2), dp(3), 0, 0)
                  val tt = TextView(this)
                  tt.textSize = 11f
                  tt.setTextColor(cCyan)
                  timeText = tt
                  val st = TextView(this)
                  st.textSize = 10f
                  st.setTextColor(cMuted)
                  st.maxLines = 2
                  st.maxWidth = dp(200)
                  statusText = st
                  info.addView(tt)
                  info.addView(st)
                  box.addView(info)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = ((scr[0] - dp(190)) / 2).coerceAtLeast(0)
                  lp.y = dp(4)
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  var collapsed = false
                  logo.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX
                          sy = e.rawY
                          ox = lp.x
                          oy = lp.y
                          moved = false
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          val dx = e.rawX - sx
                          val dy = e.rawY - sy
                          if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                          if (moved) {
                              lp.x = ox + dx.toInt()
                              lp.y = oy + dy.toInt()
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      } else if (e.action == MotionEvent.ACTION_UP) {
                          if (!moved) {
                              collapsed = !collapsed
                              ctl.visibility = if (collapsed) View.GONE else View.VISIBLE
                              info.visibility = if (collapsed) View.GONE else View.VISIBLE
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      }
                      true
                  }
                  w.addView(box, lp)
                  panel = box

                  handler.removeCallbacks(scanLoop)
                  handler.post(scanLoop)
                  inst = this
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  stopAll()
              }

              override fun onDestroy() {
                  stopAll()
                  handler.removeCallbacks(scanLoop)
                  inst = null
                  removeSafe(panel)
                  removeSafe(menu)
                  worker.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
