              <path android:fillColor="#0A1424" android:strokeColor="#9ADBFF" android:strokeWidth="1.5"
                  android:pathData="M54,30 L59,49 L78,54 L59,59 L54,78 L49,59 L30,54 L49,49 Z" />
              <path android:fillColor="#2F9BFF"
                  android:pathData="M54,42 L57,51 L66,54 L57,57 L54,66 L51,57 L42,54 L51,51 Z" />
              <path android:fillColor="#E8F6FF"
                  android:pathData="M54,50 A4,4 0 1,1 53.9,50 Z" />
          </vector>
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/Cfg.kt <<'EOF'
          package com.benim.tiklayici

          object Cfg {
              // Buff ikon şablonu boyutu (yarım ölçek)
              const val TW = 21
              const val TH = 20
              // Nişan ikon şablonu boyutu (çeyrek ölçek)
              const val NT = 29

              // Buff ikonu bu skordan küçükse "var" sayılır
              const val BTH = 22f

              // Ekran oranları (x, y) - yatay oyun ekranı (2400x1080 görüntüden ölçüldü)
              const val NX = 0.953f   // Nişan düğmesi
              const val NY = 0.579f
              const val HX = 0.954f   // el (eşya topla) düğmesi
              const val HY = 0.811f

              // 0 = Hava Kılıcı, 1 = Öfke : beceri yuvası konumları
              val BNAME = arrayOf("Hava Kılıcı", "Öfke")
              val BSHORT = arrayOf("Hava", "Öfke")
              val BX = floatArrayOf(0.772f, 0.810f)
              val BY = floatArrayOf(0.806f, 0.896f)

              // Sol üstteki buff ikonlarının şablonları (RGB, 21x20)
              const val T_HAVA = ""
              const val T_OFKE = ""

              // Nişan düğmesi: pasif (açık renk) ve aktif (koyu) görünüm, RGB 29x29
              const val T_NP = ""
              const val T_NA = ""
          }
          EOF

          cat > proj/app/src/main/java/com/benim/tiklayici/MainActivity.kt <<'EOF'
          package com.benim.tiklayici

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private var statusTv: TextView? = null
              private val cBg = 0xFF05080E.toInt()
              private val cCard = 0xFF0D1522.toInt()
              private val cAccent = 0xFF2F9BFF.toInt()
              private val cCyan = 0xFF7CD0FF.toInt()
              private val cMuted = 0xFF8CA0B8.toInt()

              private fun shape(fill: Int, stroke: Int, r: Float, sw: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = r
                  g.setStroke(sw, stroke)
                  return g
              }

              override fun onResume() {
                  super.onResume()
                  val on = ClickService.inst != null
                  statusTv?.text = if (on) "● Servis açık  ·  oyuna geç, yüzen pencere görünür" else "○ Servis kapalı  ·  aşağıdan Erişilebilirlik'i aç"
                  statusTv?.setTextColor(if (on) 0xFF4CE0A0.toInt() else cCyan)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.gravity = Gravity.CENTER_HORIZONTAL
                  col.setBackgroundColor(cBg)
                  col.setPadding(dp(18), dp(40), dp(18), dp(24))

                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  col.addView(logo, LinearLayout.LayoutParams(dp(110), dp(110)))

                  val title = TextView(this)
                  title.text = "OTO AV"
                  title.textSize = 28f
                  title.letterSpacing = 0.15f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  title.setTextColor(cCyan)
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, dp(10), 0, dp(2))
                  col.addView(title)

                  val sub = TextView(this)
                  sub.text = "Hava Kılıcı  •  Öfke  •  Nişan  •  Oto Topla"
                  sub.textSize = 13f
                  sub.setTextColor(cMuted)
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, 0, 0, dp(16))
                  col.addView(sub)

                  val st = TextView(this)
                  st.textSize = 14f
                  st.gravity = Gravity.CENTER
                  st.setPadding(dp(12), dp(10), dp(12), dp(10))
                  st.background = shape(cCard, 0xFF1F4F8F.toInt(), dp(12).toFloat(), dp(1))
                  statusTv = st
                  col.addView(st, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val how = TextView(this)
                  how.text = "1) Erişilebilirlik'ten Oto Av servisini aç.\n" +
                      "2) Oyuna geç: üstte küçük yüzen pencere çıkar. Logoya dokun: küçül / büyüt, logodan tutup sürükle.\n" +
                      "3) ☰ menüsünden Nişan, Hava Kılıcı, Öfke ve Oto toplamayı aç / kapat, \"dene\" düğmeleriyle dene.\n" +
                      "4) ▶ başlat, ■ durdur.\n\n" +
                      "• Hava Kılıcı ve Öfke bitince hemen yeniden basılır.\n" +
                      "• Nişan pasif olunca anında tekrar açılır.\n" +
                      "• El düğmesiyle eşyalar sürekli toplanır.\n\n" +
                      "Android 11 ve üstü gerekir. Sol üstteki buff ikonlarının ve sağdaki Nişan düğmesinin üstünü pencereyle kapatma."
                  how.textSize = 13f
                  how.setTextColor(0xFFB8C7DB.toInt())
                  how.setPadding(dp(14), dp(12), dp(14), dp(12))
                  how.background = shape(cCard, 0xFF14263F.toInt(), dp(12).toFloat(), dp(1))
                  val hlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  hlp.topMargin = dp(12)
                  col.addView(how, hlp)

                  val btn = TextView(this)
                  btn.text = "Erişilebilirlik Ayarları"
                  btn.textSize = 15f
