                      val isz = (dpx(24) * pScale).toInt()
                      val p = LinearLayout.LayoutParams(isz, isz)
                      p.rightMargin = (dpx(3) * pScale).toInt()
                      row.addView(iv, p)
                      panelIcons.add(iv)
                      panelIdx.add(idx)
                  }
                  if (nisanOn && nX >= 0f) add(-1, iconOf(Cfg.IC_NISAN))
                  if (pickOn && hX >= 0f) add(-2, iconOf(Cfg.IC_EL))
                  for (i in 0 until nSk) {
