              // Şablon boyutu (1080p ekranda buff ikonu ~42x40 px, yarıya küçültülmüş)
              const val TW = 21
              const val TH = 20

              // Ekran oranları (x, y) - yatay oyun ekranı
              const val AX = 0.862f   // saldırı düğmesi
              const val AY = 0.693f
              const val HX = 0.953f   // el (eşya topla) düğmesi
              const val HY = 0.811f

              // 0 = Hava Kılıcı, 1 = Öfke : beceri yuvası konumları
              val BNAME = arrayOf("Hava Kılıcı", "Öfke")
              val BSHORT = arrayOf("Hava", "Öfke")
