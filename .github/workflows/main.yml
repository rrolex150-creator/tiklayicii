                      if (bx[i] < 0f) {
                          toast("Önce yuvayı bul")
                      } else {
                          tapFrac(bx[i], by[i])
                          toast(nm + " basıldı")
                      }
                  })
                  if (smode[i] == 1) {
                      card.addView(btnRow(listOf(
                          Pair("İkonu öğren", {
                              if (bx[i] < 0f) toast("Önce yuvayı bul") else autoLearn(i)
                          }),
