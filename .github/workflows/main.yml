              private fun scan() {
                  if (autoBusy) return
                  val now = SystemClock.elapsedRealtime()
                  if (busy && now - busySince > 3000L) busy = false
                  if (busy) return
                  busy = true
                  busySince = now
                  val tpls = tplBuff
                  val sm = smode.copyOf()
                  val sxs = bx.copyOf()
                  val sys = by.copyOf()
                  val tps = sTplP.copyOf()
                  val tas = sTplA.copyOf()
                  val nxx = nX
                  val nyy = nY
                  val ntp = nTplP
                  val nta = nTplA
                  val nm = nMode
                  val doTgt = nm == 2 && nisanOn && now - lastTgt >= tgtMs.toLong() && now >= restUntil
                  val hm = hMode
                  val hxx = hX
                  val hyy = hY
                  val hpp = hTplP
                  val haa = hTplA
                  val rvA = rvOn && running
                  val rvTT = rvT
                  val rvx = rvFx
                  val rvy = rvFy
                  if (doTgt) lastTgt = now
                  val lp = learnPt
                  val doLearn = lp != null && now >= learnAfter
                  takeScreenshot(Display.DEFAULT_DISPLAY, worker, object : TakeScreenshotCallback {
                      override fun onSuccess(r: ScreenshotResult) {
                          try {
                              val hb = r.hardwareBuffer
                              val bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                                  ?.copy(Bitmap.Config.ARGB_8888, false)
                              hb.close()
                              if (bmp == null) {
                                  handler.post { busy = false }
                                  return
                              }
                              // Nişan önce çözülür ve hemen uygulanır, buff analizi beklemez
                              val ns = if (nm == 1) analyzeSlot(bmp, nxx, nyy, ntp, nta, 103f) else floatArrayOf(99f, 99f)
                              handler.post { applyNisan(ns, now) }
                              if (doTgt) {
                                  val tg = findTarget(bmp)
                                  if (tg != null) handler.post { tapFrac(tg[0], tg[1]); tgtCount++ }
                              }
                              if (hm == 1 && hpp != null && haa != null && hxx >= 0f) {
                                  val hs = analyzeSlot(bmp, hxx, hyy, hpp, haa, 103f)
                                  handler.post { applyHand(hs) }
                              }
                              if (rvA && rvTT != null) {
                                  val rv = analyzeRevive(bmp, rvTT, rvx, rvy)
                                  handler.post { applyRevive(rv) }
                              }
                              val bs = analyzeBuffs(bmp, tpls)
                              analyzeBuffG(bmp, bs)
                              val sp = FloatArray(MAXS) { 99f }
                              val sa = FloatArray(MAXS) { 99f }
                              for (n in 0 until MAXS) {
                                  if (sm[n] == 2 && sxs[n] >= 0f) {
                                      val rr = analyzeSlot(bmp, sxs[n], sys[n], tps[n], tas[n], 80f)
                                      sp[n] = rr[0]
                                      sa[n] = rr[1]
                                  }
                              }
                              var learned: String? = null
                              if (doLearn && lp != null) learned = learnIcon(bmp, lp[0], lp[1])
                              handler.post {
                                  busy = false
                                  if (learned != null) {
                                      val li = learnIdx
                                      prefs.edit().putString("s" + profile + "_" + li + "_t", learned).commit()
                                      useTimer[li] = false
                                      noSee[li] = 0
                                      loadCfg()
                                      learnPt = null
                                      toast(Cfg.SNAME[profile][li] + " ikonu öğrenildi")
                                  }
                                  applyScan(bs, sp, sa)
                              }
                          } catch (ex: Exception) {
                              handler.post { busy = false }
                          }
                      }

                      override fun onFailure(code: Int) {
                          handler.post { busy = false }
                      }
                  })
              }

              // Nişan durumunu hemen işle: pasifse bekletmeden bas
              private fun applyNisan(ns: FloatArray, shotAt: Long) {
                  scoreP = ns[0]
                  scoreA = ns[1]
                  nisanState = if (minOf(scoreP, scoreA) > 40f) 0
                  else if (scoreP < scoreA - 3f) 1
                  else if (scoreA < scoreP - 3f) 2
                  else 0
                  nisanShotAt = shotAt
                  updateStatus()
                  if (running) decide(SystemClock.elapsedRealtime())
              }

              private fun applyScan(bs: FloatArray, sp: FloatArray, sa: FloatArray) {
                  val now = SystemClock.elapsedRealtime()
                  for (b in 0 until nSk) {
                      scoreB[b] = bs[b]
                      val md = smode[b]
                      val tracked = (md == 1 && tplBuff[b] != null) ||
                          (md == 2 && sTplP[b] != null && sTplA[b] != null && bx[b] >= 0f)
                      val p: Boolean
                      if (tracked && !useTimer[b]) {
                          if (md == 2) {
                              // düğmenin kendi aktif / pasif görünümünü izle
                              p = if (minOf(sp[b], sa[b]) > 40f) present[b]
                              else if (sa[b] < sp[b] - 3f) true
                              else if (sp[b] < sa[b] - 3f) false
                              else present[b]
                          } else {
                              // sol üstteki buff ikonunu izle
                              p = bs[b] < thr[b]
                          }
                          if (p) {
                              noSee[b] = 0
                              verifyAt[b] = 0L
                          } else if (verifyAt[b] > 0L && now >= verifyAt[b]) {
                              // basıldı ama görünmedi: 3 kez üst üste olursa süreye geç
                              verifyAt[b] = 0L
                              noSee[b]++
                              if (noSee[b] >= 3) {
                                  useTimer[b] = true
                                  toast(Cfg.SNAME[profile][b] + ": takip olmadı, süreye göre yenilenecek")
                              }
                          }
                      } else {
                          p = lastCast[b] > 0L && now - lastCast[b] < secs[b] * 1000L
                      }
                      present[b] = p
                      if (p) miss[b] = 0 else miss[b]++
                  }
                  updateStatus()
                  if (running) decide(now)
              }

              // ---------------- karar: görülen anda hemen bas ----------------

              private fun decide(now: Long) {
                  if (!inGame) return
                  if (SystemClock.elapsedRealtime() < restUntil) return
                  // 1) Nişan pasif oldu: anında tekrar aç (öncelikli). Basıştan sonra çekilmiş
                  //    bir görüntü pasif gösteriyorsa bas; eski görüntüyle çift basılmaz.
                  if (nisanOn && nisanState == 1 && nisanShotAt > lastNisan + 200L && now - lastNisan > nisanGap) {
                      tapFrac(nX, nY)
                      lastNisan = now
                      nisanCount++
                      return
                  }
                  if (now - lastTap < 90L) return
                  // 2) Bir beceri (buff) bitti: anında yenile
                  if (now >= skillLock) {
                      for (b in 0 until nSk) {
                          if (skillOn[b] && bx[b] >= 0f && miss[b] >= 1 && now - lastCast[b] > recastGap) {
                              tapFrac(bx[b], by[b])
                              lastCast[b] = now
                              verifyAt[b] = now + 2500L
                              miss[b] = 0
                              skillLock = now + castLockMs
                              skillCount++
                              return
                          }
                      }
                  }
              }

              // ---------------- döngüler ----------------

              // sürekli tarama (ekran görüntüsü sınırı izin verdiği kadar hızlı)
              private val scanLoop = object : Runnable {
                  override fun run() {
                      if (Build.VERSION.SDK_INT >= 30 && inGame) scan()
                      handler.postDelayed(this, if (running) scanGap else 600L)
                  }
              }

              // Kırmızı canavar ismini bulur, gövdesine denk gelen noktayı (ekran oranı) döndürür
              private fun findTarget(b: Bitmap): FloatArray? {
                  val w = b.width
                  val h = b.height
                  val sc = h / 1080f
                  val cell = (14f * sc).toInt().coerceAtLeast(6)
                  val x0 = (w * 0.10f).toInt()
                  val x1 = (w * 0.90f).toInt()
                  val y0 = (h * 0.15f).toInt()
                  val y1 = (h * 0.82f).toInt()
                  val gw = (x1 - x0) / cell + 1
                  val gh = (y1 - y0) / cell + 1
                  val cnt = IntArray(gw * gh)
                  val rw = x1 - x0
                  val rh = y1 - y0
                  val px = IntArray(rw)
                  var y = y0
                  while (y < y1) {
                      b.getPixels(px, 0, rw, x0, y, rw, 1)
                      for (i in 0 until rw) {
                          val p = px[i]
                          val r = (p shr 16) and 255
                          val g = (p shr 8) and 255
                          val bl = p and 255
                          if (r > 170 && g < 80 && bl < 80 && r - g > 110) {
                              cnt[((y - y0) / cell) * gw + i / cell]++
                          }
                      }
                      y += 2
                  }
                  val seen = BooleanArray(gw * gh)
                  var best: FloatArray? = null
                  var bestD = 1e9f
                  val cx = w * 0.5f
                  val cy = h * 0.55f
                  for (st in 0 until gw * gh) {
                      if (seen[st] || cnt[st] < 3) continue
                      val stack = ArrayList<Int>()
                      stack.add(st)
                      seen[st] = true
                      var minX = gw
                      var maxX = 0
                      var minY = gh
                      var maxY = 0
                      var tot = 0
                      while (stack.isNotEmpty()) {
                          val k = stack.removeAt(stack.size - 1)
                          val kx = k % gw
                          val ky = k / gw
                          if (kx < minX) minX = kx
                          if (kx > maxX) maxX = kx
                          if (ky < minY) minY = ky
                          if (ky > maxY) maxY = ky
                          tot += cnt[k]
                          for (d in 0 until 4) {
                              val nx = kx + (if (d == 0) 1 else if (d == 1) -1 else 0)
                              val ny = ky + (if (d == 2) 1 else if (d == 3) -1 else 0)
                              if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue
                              val nk = ny * gw + nx
                              if (!seen[nk] && cnt[nk] >= 3) {
                                  seen[nk] = true
                                  stack.add(nk)
                              }
                          }
                      }
                      val bw = (maxX - minX + 1) * cell
                      val bh = (maxY - minY + 1) * cell
                      if (tot < 25 || bw < 30 * sc || bh > 50 * sc || bw < bh * 1.6f) continue
                      val mx = x0 + (minX + maxX + 1) * cell / 2f
                      val my = y0 + (minY + maxY + 1) * cell / 2f
                      val d = (mx - cx) * (mx - cx) + (my - cy) * (my - cy)
                      val rl = floatArrayOf(9f, 0.20f, 0.32f, 0.46f)[tgtRad.coerceIn(0, 3)] * h
                      if (d > rl * rl) continue
                      if (d < bestD) {
                          bestD = d
                          val off = floatArrayOf(0.05f, 0.08f, 0.11f)[tgtOff.coerceIn(0, 2)]
                          best = floatArrayOf(mx / w, (my / h + off).coerceAtMost(0.95f))
                      }
                  }
                  return best
              }

              private val atkLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      var wait = atkMs.toLong()
                      if (now < restUntil) {
                          wait = 300L
                      } else if (potOn && pX >= 0f && now - lastPot >= potSec * 1000L) {
                          if (now - lastTap < 120L) {
                              wait = 60L
                          } else {
                              tapFrac(pX, pY)
                              lastPot = now
                          }
                      } else if (aOn && aX >= 0f) {
                          if (now - lastTap < 120L) {
                              wait = 60L
                          } else {
                              tapFrac(aX, aY)
                          }
                      }
                      handler.postDelayed(this, wait)
                  }
              }

              private val pickLoop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.elapsedRealtime()
                      var wait = pickMs.toLong()
                      if (now < restUntil) {
                          wait = 300L
                      } else if (pickOn && hX >= 0f) {
                          if (hMode == 1 && hTplP != null && hTplA != null) {
                              wait = 150L
                              if (hState == 1 && now - lastTap >= 120L && now - lastHandTap > 900L) {
                                  tapFrac(hX, hY)
                                  lastHandTap = now
                                  pickCount++
                              }
                          } else if (now - lastTap < 120L) {
                              wait = 60L
                          } else {
                              tapFrac(hX, hY)
                              pickCount++
                          }
                      }
                      handler.postDelayed(this, wait)
                  }
              }

              // Hangi uygulama önde? Sadece seçili oyundaysa pencereyi göster ve çalış.
              private fun topAppPkg(): String? {
                  try {
                      val ws = windows
                      if (ws == null || ws.isEmpty()) return null
                      var best: AccessibilityWindowInfo? = null
                      for (wi in ws) {
                          if (wi.type != AccessibilityWindowInfo.TYPE_APPLICATION) continue
                          if (wi.isActive) {
                              best = wi
                              break
                          }
                          if (best == null || wi.layer > best.layer) best = wi
                      }
                      val root = best?.root ?: return null
                      return root.packageName?.toString()
                  } catch (ex: Exception) {
                      return null
                  }
              }

              // Pencere yeniden eklenmesi gerekirse (sistem kaldırdıysa) geri ekle
              private fun ensurePanel() {
                  val v = panel ?: return
                  val w = wm ?: return
                  val lp = panelLp ?: return
                  if (!v.isAttachedToWindow) {
                      try {
                          w.addView(v, lp)
                      } catch (ex: Exception) {
                      }
                  }
              }

              private val gameLoop = object : Runnable {
                  override fun run() {
                      for (x in 0 until Cfg.GNAME.size) {
                          gamePkgs[x] = prefs.getString("gp_" + x, "") ?: ""
                      }
                      val pkg = topAppPkg() ?: evPkg
                      var g = -1
                      for (x in 0 until Cfg.GNAME.size) {
                          if (gamePkgs[x].isNotEmpty() && pkg == gamePkgs[x]) g = x
                      }
                      val here = g >= 0
                      if (here) outCount = 0 else if (outCount < 100) outCount++
                      // Oyundan çıkış: üst üste 2 kontrolde (~1,2 sn) oyun görünmezse gizle
                      val target = if (here) true else if (outCount >= 2) false else inGame
                      if (here && g != curGame) {
                          // oyun değişti: o oyunun son karakterine geç
                          curGame = g
                          panelLogo?.setImageResource(logoRes(g))
                          if (Cfg.PGAME[profile] != g) {
                              stopAll()
                              var np = prefs.getInt("lastp_" + g, firstProfile(g))
                              if (np < 0 || np >= Cfg.PGAME.size || Cfg.PGAME[np] != g) np = firstProfile(g)
                              prefs.edit().putInt("profile", np).commit()
                              showMenu(false)
                              loadCfg()
                          }
                      }
                      if (target != inGame) {
                          inGame = target
                          if (target) {
                              ensurePanel()
                              panel?.visibility = View.VISIBLE
                              loadCfg()
                              updateStatus()
                              if (resumeAfter) {
                                  resumeAfter = false
                                  handler.postDelayed({
                                      if (inGame && !running) toggle()
                                  }, 1200L)
                              }
                          } else {
                              resumeAfter = running
                              panel?.visibility = View.GONE
                              stopAll()
                              showMenu(false)
                              learnPt = null
                          }
                      } else if (inGame) {
                          ensurePanel()
                      }
                      handler.postDelayed(this, 600L)
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val s = (SystemClock.elapsedRealtime() - startAt) / 1000
                      timeText?.text = "%s %02d:%02d · N%d B%d T%d H%d".format(pname(), s / 60, s % 60, nisanCount, skillCount, pickCount, tgtCount)
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun updateStatus() {
                  for (n in 0 until panelIcons.size) {
                      val idx = panelIdx[n]
                      val on = if (idx >= 0) present[idx] else if (idx == -1) (nisanState == 2) else running
                      panelIcons[n].alpha = if (on) 1f else 0.35f
                  }
              }

              private fun stopAll() {
                  running = false
                  handler.removeCallbacks(pickLoop)
                  handler.removeCallbacks(atkLoop)
                  handler.removeCallbacks(ticker)
                  setRunIcon(false)
                  timeText?.text = pname()
              }

              fun toggle() {
                  if (running) {
                      stopAll()
                      return
                  }
                  if (Build.VERSION.SDK_INT < 30) {
                      toast("Android 11 veya üstü gerekli")
                      return
                  }
                  if (!inGame) {
                      toast("Önce seçili oyuna gir")
                      return
                  }
                  loadCfg()
                  running = true
                  nisanCount = 0
                  skillCount = 0
                  pickCount = 0
                  tgtCount = 0
                  lastTgt = 0L
                  restUntil = 0L
                  hState = 0
                  lastPot = 0L
                  lastNisan = 0L
                  skillLock = 0L
                  for (b in 0 until MAXS) {
                      miss[b] = 0
                      lastCast[b] = 0L
                      useTimer[b] = false
                      noSee[b] = 0
                      verifyAt[b] = 0L
                  }
                  startAt = SystemClock.elapsedRealtime()
                  setRunIcon(true)
                  handler.post(pickLoop)
                  handler.post(atkLoop)
                  handler.post(ticker)
                  scan()
              }

