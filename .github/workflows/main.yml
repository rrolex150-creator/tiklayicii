                      p.leftMargin = dpx(3)
                      p.rightMargin = dpx(3)
                      trow.addView(tb, p)
                  }
                  col.addView(trow)

                  val rl = TextView(this)
                  rl.textSize = 12f
                  rl.setTextColor(cText)
                  rl.setPadding(0, dpx(8), 0, 0)
                  fun rtxt(v: Int) = if (v == 0) "Zorla yenile: kapalı (sadece bitince)" else "Zorla yenile: her " + (v * 10) + " sn"
                  rl.text = rtxt(refreshSec / 10)
                  col.addView(rl)
                  val rb = SeekBar(this)
                  rb.max = 30
                  rb.progress = refreshSec / 10
                  rb.progressTintList = ColorStateList.valueOf(cAccent)
                  rb.thumbTintList = ColorStateList.valueOf(cCyan)
                  rb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          refreshSec = p * 10
                          rl.text = rtxt(p)
                          prefs.edit().putInt("refresh", p).apply()
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}

                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })
                  col.addView(rb)

                  // --- av ---
                  col.addView(sectionHead("AV"))
                  col.addView(styledSwitch("ESP (canavar kutuları)", espOn) { on ->
                      espOn = on
                      prefs.edit().putBoolean("esp", on).apply()
                      if (!on) clearEsp()
                  })
                  col.addView(styledSwitch("İnsan gibi (doğal mod)", humanOn) { on ->
                      humanOn = on
                      prefs.edit().putBoolean("human", on).apply()
                  })
                  col.addView(styledSwitch("Canavar yokken gez", wanderOn) { on ->
                      wanderOn = on
                      prefs.edit().putBoolean("wander", on).apply()
                  })

                  // --- joystick ---
                  col.addView(sectionHead("JOYSTICK"))
                  val jn = TextView(this)
                  jn.text = "Joystick merkezine dokunarak konumunu ayarla, sonra Dene ile kontrol et."
                  jn.textSize = 11f
                  jn.setTextColor(cMuted)
                  col.addView(jn)
                  val jrow = LinearLayout(this)
                  jrow.orientation = LinearLayout.HORIZONTAL
                  val bPos = stoneBtn("Konum ayarla", 12f) { calibrateJoy() }
                  val bTest = stoneBtn("Dene", 12f) { testJoy() }
                  val p1 = LinearLayout.LayoutParams(0, dpx(40), 1.5f)
                  p1.topMargin = dpx(4)
                  p1.rightMargin = dpx(3)
                  val p2 = LinearLayout.LayoutParams(0, dpx(40), 1f)
                  p2.topMargin = dpx(4)
                  p2.leftMargin = dpx(3)
                  jrow.addView(bPos, p1)
                  jrow.addView(bTest, p2)
                  col.addView(jrow)

                  val lbl = TextView(this)
                  lbl.text = "Joystick yarıçapı: %" + jrv
                  lbl.textSize = 12f
                  lbl.setTextColor(cText)
                  lbl.setPadding(0, dpx(6), 0, 0)
                  col.addView(lbl)
                  val sb = SeekBar(this)
                  sb.max = 20
                  sb.progress = jrv
                  sb.progressTintList = ColorStateList.valueOf(cAccent)
                  sb.thumbTintList = ColorStateList.valueOf(cCyan)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          val v = p.coerceAtLeast(3)
                          jrv = v
                          lbl.text = "Joystick yarıçapı: %" + v
                          prefs.edit().putInt("jr", v).apply()
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}

                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })
                  col.addView(sb)

                  val sv = ScrollView(this)
                  sv.addView(col)
                  root.addView(sv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (sc[1] * 0.50f).toInt().coerceAtLeast(dpx(120))))

                  val lp = settingsLp ?: overlayLp(w).also { settingsLp = it }
                  drag(bar.second, root, lp)
                  return root
              }

              private fun showSettings(on: Boolean) {
                  val w = wm ?: return
                  if (on && !settingsShown) {
                      showMenu(false)
                      loadCfg()
                      removeSafe(settings)
                      val fresh = buildSettings()
                      val lp = settingsLp ?: return
                      settings = fresh
                      w.addView(fresh, lp)
                      settingsShown = true
                  } else if (!on && settingsShown) {
                      removeSafe(settings)
                      settingsShown = false
                  }
              }

              private fun calibrateJoy() {
                  val w = wm ?: return
                  showSettings(false)
                  removeSafe(joyLayer)
                  val d = resources.displayMetrics.density
                  val layer = FrameLayout(this)
                  joyLayer = layer
                  layer.setBackgroundColor(0x55000000)
                  val msg = TextView(this)
                  msg.text = "Joystick'in merkezine (başparmağını koyduğun yere) dokun"
                  msg.textSize = 20f
                  msg.setTextColor(Color.YELLOW)
                  msg.gravity = Gravity.CENTER
                  msg.setBackgroundColor(0xDD000000.toInt())
                  msg.setPadding((16 * d).toInt(), (40 * d).toInt(), (16 * d).toInt(), (16 * d).toInt())
                  layer.addView(
                      msg,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                      )
                  )
                  val cancel = Button(this)
                  cancel.text = "İptal"
                  cancel.setOnClickListener {
                      removeSafe(layer)
                      joyLayer = null
                  }
                  layer.addView(
                      cancel,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.END
                      )
                  )
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  layer.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_UP) {
                          val s = screen()
                          val rx = (e.rawX / s[0]).coerceIn(0f, 1f)
                          val ry = (e.rawY / s[1]).coerceIn(0f, 1f)
                          prefs.edit().putFloat("jx", rx).putFloat("jy", ry).apply()
                          jxv = rx
                          jyv = ry
                          removeSafe(layer)
                          joyLayer = null
                          showDot(e.rawX, e.rawY)
                          toast("Joystick konumu kaydedildi")
                      }
                      true
                  }
                  w.addView(layer, lp)
              }

              private fun testJoy() {
                  showSettings(false)
                  toast("3 sn sonra joystick yukarı itilecek, karakter yürümeli")
                  handler.postDelayed({
                      loadCfg()
                      val s = screen()
                      showDot(jxv * s[0], jyv * s[1])
                      joyMove(Math.PI / 2, 1500L)
                  }, 3000L)
              }

              private fun showMenu(on: Boolean) {
                  val w = wm ?: return
                  val m = menu ?: return
                  val lp = menuLp ?: return
                  if (on && !menuShown) {
                      showSettings(false)
                      loadCfg()
                      // menü anahtarlarını güncel ayarla eşitle: menüyü yeniden kur
                      removeSafe(m)
                      val fresh = buildMenu()
                      val nlp = menuLp ?: return
                      nlp.x = lp.x
                      nlp.y = lp.y
                      menu = fresh
                      refreshMenuList()
                      w.addView(fresh, nlp)
                      menuShown = true
                  } else if (!on && menuShown) {
                      removeSafe(m)
                      menuShown = false
                  }
              }

              // ---------------- servis ----------------

              override fun onServiceConnected() {
                  prefs = getSharedPreferences("ayar", MODE_PRIVATE)
                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  removeSafe(panel)
                  removeSafe(espView)
                  removeSafe(menu)
                  removeSafe(settings)
                  menuShown = false
                  settingsShown = false
                  loadCfg()
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()

                  // ESP katmanı (dokunmayı geçirir)
                  val ev = EspView(this)
                  val elp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  w.addView(ev, elp)
                  espView = ev

                  // yüzen pencere: küçük, mavi-siyah, logodan sürüklenir, logoya dokununca küçülür
                  val scr = screen()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = shape(cBg, cAccent, 14, 2)
                  box.setPadding(dp(6), dp(5), dp(6), dp(5))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_logo)
                  top.addView(logo, LinearLayout.LayoutParams(dp(34), dp(34)))

                  val ctl = LinearLayout(this)
                  ctl.orientation = LinearLayout.HORIZONTAL
                  val sBtn = stoneBtn("▶", 16f) { toggle() }
                  startBtn = sBtn
                  val mBtn = stoneBtn("☰", 16f) { showMenu(!menuShown) }
                  val gBtn = stoneBtn("⚙", 16f) { showSettings(!settingsShown) }
                  for (bv in listOf(sBtn, mBtn, gBtn)) {
                      val p = LinearLayout.LayoutParams(dp(40), dp(34))
                      p.leftMargin = dp(5)
                      ctl.addView(bv, p)
                  }
                  top.addView(ctl)
                  box.addView(top)

                  val info = LinearLayout(this)
                  info.orientation = LinearLayout.VERTICAL
                  info.setPadding(dp(2), dp(3), 0, 0)
                  val tt = TextView(this)
                  tt.textSize = 11f
                  tt.setTextColor(cCyan)
                  timeText = tt
                  val st = TextView(this)
                  st.textSize = 10f
                  st.setTextColor(cMuted)
                  st.maxLines = 2
                  st.maxWidth = dp(190)
                  statusText = st
                  info.addView(tt)
                  info.addView(st)
                  box.addView(info)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = ((scr[0] - dp(190)) / 2).coerceAtLeast(0)
                  lp.y = dp(4)
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  var collapsed = false
                  logo.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX
                          sy = e.rawY
                          ox = lp.x
                          oy = lp.y
                          moved = false
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          val dx = e.rawX - sx
                          val dy = e.rawY - sy
                          if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                          if (moved) {
                              lp.x = ox + dx.toInt()
                              lp.y = oy + dy.toInt()
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      } else if (e.action == MotionEvent.ACTION_UP) {
                          if (!moved) {
                              collapsed = !collapsed
                              ctl.visibility = if (collapsed) View.GONE else View.VISIBLE
                              info.visibility = if (collapsed) View.GONE else View.VISIBLE
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      }
                      true
                  }
                  w.addView(box, lp)
                  panel = box

                  menu = buildMenu()
                  handler.removeCallbacks(idle)
                  handler.post(idle)
                  inst = this
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  stopAll()
              }

              override fun onDestroy() {
                  stopAll()
                  handler.removeCallbacks(idle)
                  inst = null
                  removeSafe(panel)
                  removeSafe(menu)
                  removeSafe(settings)
                  removeSafe(joyLayer)
                  removeSafe(espView)
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
