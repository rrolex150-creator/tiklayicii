          package com.benim.tiklayici

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private var statusTv: TextView? = null
              private val gameTv = arrayOfNulls<TextView>(Cfg.GNAME.size)
              private val cBg = 0xFF150C06.toInt()
              private val cCard = 0xFF2A1A0D.toInt()
              private val cAccent = 0xFFC99A3C.toInt()
              private val cCyan = 0xFFF3CF6B.toInt()
              private val cMuted = 0xFFA98A55.toInt()

              private fun shape(fill: Int, stroke: Int, r: Float, sw: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = r
                  g.setStroke(sw, stroke)
                  return g
              }

              private fun prefs() = getSharedPreferences("ayar", MODE_PRIVATE)

              // Eski sürümden gelen tek oyun seçimini 1. oyuna taşı
              private fun migrate() {
                  val p = prefs()
                  val old = p.getString("game_pkg", "") ?: ""
                  val cur = p.getString("gp_0", "") ?: ""
                  if (old.isNotEmpty() && cur.isEmpty()) {
                      p.edit()
                          .putString("gp_0", old)
                          .putString("gn_0", p.getString("game_name", "") ?: "")
                          .commit()
                  }
                  if ((p.getString("gp_2", "") ?: "").isEmpty() && packageManager.getLaunchIntentForPackage("com.hardmobile.client") != null) {
                      p.edit().putString("gp_2", "com.hardmobile.client").putString("gn_2", "HardMt2").commit()
                  }
              }

              private fun refresh() {
                  val on = ClickService.inst != null
                  statusTv?.text = if (on) "● Servis açık" else "○ Servis kapalı  ·  aşağıdan Erişilebilirlik'i aç"
                  statusTv?.setTextColor(if (on) 0xFF4CE0A0.toInt() else cCyan)
                  for (g in 0 until Cfg.GNAME.size) {
                      val name = prefs().getString("gn_" + g, "") ?: ""
                      gameTv[g]?.text = if (name.isEmpty()) "Uygulama seçilmedi" else name
                  }
              }

              override fun onResume() {
                  super.onResume()
                  migrate()
                  refresh()
              }

              private fun pickGame(g: Int) {
                  val i = Intent(Intent.ACTION_MAIN)
                  i.addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = packageManager.queryIntentActivities(i, 0)
                  val apps = list.map { Pair(it.loadLabel(packageManager).toString(), it.activityInfo.packageName) }
                      .filter { it.second != packageName }
                      .distinctBy { it.second }
                      .sortedBy { it.first.lowercase() }
                  if (apps.isEmpty()) {
                      Toast.makeText(this, "Uygulama listesi alınamadı", Toast.LENGTH_LONG).show()
                      return
