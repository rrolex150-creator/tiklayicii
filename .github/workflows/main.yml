                  menu.addView(pageHost)
                  showPage(0)
                  rebuildMobList()

                  menuBtn.setOnClickListener {
                      if (menu.visibility == View.GONE) {
                          rebuildMobList()
                          menu.visibility = View.VISIBLE
                      } else {
                          menu.visibility = View.GONE
                      }
                  }

                  box.addView(left)
                  box.addView(menu)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(60)
                  lp.y = dp(80)

                  // sürükleme (✥ tutamacından)
                  var dx = 0f
                  var dy = 0f
                  var sx = 0
                  var sy = 0
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = e.rawX
                              dy = e.rawY
                              sx = lp.x
                              sy = lp.y
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = sx + (e.rawX - dx).toInt()
                              lp.y = sy + (e.rawY - dy).toInt()
                              w.updateViewLayout(box, lp)
                          }
                      }
                      true
                  }

                  w.addView(box, lp)
                  panel = box
              }

              // ------------------------------------------------------------------
              //  Başlat / durdur
              // ------------------------------------------------------------------

              fun toggle() {
                  if (running) {
                      running = false
                      setStatus("Durduruluyor…")
                  } else {
                      start()
                  }
              }

              private fun start() {
                  if (worker?.isAlive == true) {
                      setStatus("Önceki döngü bitiyor, birkaç sn sonra tekrar bas")
                      return
                  }
                  running = true
                  startBtn?.text = "■"
                  hadTarget = false
                  lootBurst = 0
                  offIdx = 0
                  awaitingSelect = false
                  miss = 0
                  val t = Thread {
                      try {
                          if (mode == 0) farmLoop() else clickLoop()
                      } catch (e: Throwable) {
                          setStatus("Hata: " + e.javaClass.simpleName + " " + (e.message ?: ""))
                      } finally {
                          running = false
                          ui { startBtn?.text = "▶" }
                      }
                  }
                  t.isDaemon = true
                  worker = t
                  t.start()
              }

              // Eski mod: sadece açık tuşlara sırayla dokun
              private fun clickLoop() {
                  setStatus("Tıklayıcı çalışıyor")
                  var i = 0
                  while (running) {
                      val on = acts.indices.filter { enabled[it] }
                      if (on.isNotEmpty()) {
                          tapAct(on[i % on.size])
                          i++
                      }
                      sleep(speeds[speedIdx].click.random().toLong())
                  }
                  setStatus("Durdu")
              }

              // ------------------------------------------------------------------
              //  Akıllı farm
              // ------------------------------------------------------------------

              private fun farmLoop() {
                  if (Build.VERSION.SDK_INT < 30) {
                      setStatus("Akıllı farm için Android 11+ gerekir. Ayar > Mod > Tıklayıcı")
                      return
                  }
                  setStatus("Akıllı farm başladı")
                  var fail = 0
                  while (running) {
                      val bmp = grab()
                      if (bmp == null) {
                          fail++
                          setStatus("Ekran alınamadı (" + fail + ")")
                          sleep(if (fail > 3) 1500L else 500L)
                          continue
                      }
                      fail = 0
                      val delay: Long = try {
                          farmStep(bmp)
                      } finally {
                          bmp.recycle()
                      }
                      sleep(maxOf(350L, delay))
                  }
                  setStatus("Durdu")
              }

              private fun farmStep(bmp: Bitmap): Long {
                  val H = bmp.height
                  val now = SystemClock.uptimeMillis()
                  val normalDelay = speeds[speedIdx].farm.random().toLong()

                  // 1) HP / MP iksir
                  val hp = barRatio(bmp, 0.0467f, false)
                  val mp = barRatio(bmp, 0.075f, true)
                  if (enabled[IDX_HP] && hp > 0.02f && hp * 100f < hpPct && now - lastHp > 2500L) {
                      tapAct(IDX_HP)
                      lastHp = now
                  }
                  if (enabled[IDX_MP] && mp > 0.02f && mp * 100f < mpPct && now - lastMp > 2500L) {
                      tapAct(IDX_MP)
                      lastMp = now
                  }

                  // 2) otomatik saldırı açık mı? (çapraz kılıç taraması)
                  val score = autoScore(bmp)
                  val autoOn = score >= esik
                  val info = "Oto " + (if (autoOn) "✔" else "✘") + score.toInt() +
                      "  HP " + (hp * 100f).toInt() + "  MP " + (mp * 100f).toInt()

                  // 3) hedef var mı, doğru mu?
                  val barRed = targetBarPresent(bmp)
                  val sel = Shared.selected(this)
                  val all = Shared.all(this)
                  all.addAll(sel)
                  var tName = ""
                  if (barRed) tName = ocrTarget(bmp)
                  val matched = barRed && (sel.isEmpty() || Shared.matchSel(tName, sel, all))

                  // ---- A) doğru hedef seçili: saldır ----
                  if (matched) {
                      hadTarget = true
                      awaitingSelect = false
                      miss = 0

                      if (enabled[IDX_ATTACK] && !autoOn && now - lastAtkTap > 2200L) {
                          tapAct(IDX_ATTACK)
                          lastAtkTap = now
                      }
                      if (autoOn || !enabled[IDX_ATTACK]) {
                          val sk = intArrayOf(2, 3, 4, 5).filter { enabled[it] }
                          if (sk.isNotEmpty()) {
                              tapAct(sk[skillI % sk.size])
                              skillI++
                          }
                      }
                      if (enabled[IDX_LOOT] && now - lastLoot > 3000L) {
                          tapAct(IDX_LOOT)
                          lastLoot = now
                      }
                      setStatus("⚔ " + (if (tName.isEmpty()) "hedef" else tName) + "\n" + info)
                      return normalDelay
                  }

                  // ---- B) hedef yok / yanlış hedef ----
                  val was = hadTarget
                  hadTarget = false
                  if (was && !barRed) {
                      lootBurst = if (enabled[IDX_LOOT]) 3 else 0
                  }
                  if (lootBurst > 0) {
                      tapAct(IDX_LOOT)
                      lootBurst--
                      setStatus("💰 Toplanıyor\n" + info)
                      return 600L
                  }

                  if (sel.isNotEmpty()) {
                      val hit = findLabel(bmp, sel, all, miss % 3 == 2)
                      if (hit != null) {
                          if (awaitingSelect) offIdx = (offIdx + 1) % OFFS.size
                          val tx = hit.exactCenterX()
                          val ty = (hit.bottom + OFFS[offIdx] * H).coerceIn(0.12f * H, 0.76f * H)
                          tapPx(tx, ty)
                          awaitingSelect = true
                          miss = 0
                          setStatus("🎯 Canavar bulundu, seçiliyor\n" + info)
                          return 900L
                      }
                      miss++
                      awaitingSelect = false
                      if (enabled[IDX_TARGET] && miss >= 2) {
                          tapAct(IDX_TARGET)
                      }
                      setStatus("🔍 Aranıyor (" + miss + ")" +
                          (if (barRed) " - yanlış hedef" else "") + "\n" + info)
                      return normalDelay
                  }

                  // isim seçilmemiş: oyunun kendi "hedef seç" tuşu
                  if (enabled[IDX_TARGET]) tapAct(IDX_TARGET)
                  setStatus("Hedef seçiliyor (isim seçilmedi)\n" + info)
                  return normalDelay
              }

              // ------------------------------------------------------------------
              //  Ekran görüntüsü + OCR
              // ------------------------------------------------------------------

              private fun grab(): Bitmap? {
                  if (Build.VERSION.SDK_INT < 30) return null
                  val latch = CountDownLatch(1)
                  val ref = AtomicReference<Bitmap?>(null)
                  try {
                      takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          cbExec,
                          object : AccessibilityService.TakeScreenshotCallback {
                              override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                                  try {
                                      val hb = result.hardwareBuffer
                                      val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                      if (hw != null) {
                                          ref.set(hw.copy(Bitmap.Config.ARGB_8888, false))
                                          hw.recycle()
                                      }
                                      hb.close()
                                  } catch (e: Throwable) {
                                  }
                                  latch.countDown()
                              }

                              override fun onFailure(errorCode: Int) {
                                  latch.countDown()
                              }
                          }
                      )
                  } catch (e: Throwable) {
                      return null
                  }
                  latch.await(3, TimeUnit.SECONDS)
                  return ref.get()
              }

              private fun ocr(img: Bitmap): List<Line2> {
                  val latch = CountDownLatch(1)
                  val ref = AtomicReference<List<Line2>>(emptyList())
                  try {
                      recognizer.process(InputImage.fromBitmap(img, 0))
                          .addOnSuccessListener { t ->
                              val out = ArrayList<Line2>()
                              for (b in t.textBlocks) {
                                  for (l in b.lines) {
                                      val r = l.boundingBox
                                      if (r != null) out.add(Line2(l.text, r))
                                  }
                              }
                              ref.set(out)
                              latch.countDown()
                          }
                          .addOnFailureListener {
                              latch.countDown()
                          }
                  } catch (e: Throwable) {
                      return emptyList()
                  }
                  latch.await(8, TimeUnit.SECONDS)
                  return ref.get()
              }

              // Kırmızı yazıları (canavar isimleri) siyah, gerisini beyaz yapar; HUD alanları atlanır
              private fun redMask(src: Bitmap, x0: Int, y0: Int, w: Int, h: Int): Bitmap {
                  val W = src.width
                  val H = src.height
                  val px = IntArray(w * h)
                  src.getPixels(px, 0, w, x0, y0, w, h)
                  val m = BooleanArray(w * h)
                  for (y in 0 until h) {
                      val gy = y0 + y
                      for (x in 0 until w) {
                          val gx = x0 + x
                          if (gx < 0.26f * W && gy < 0.22f * H) continue
                          if (gx < 0.12f * W && gy > 0.25f * H && gy < 0.42f * H) continue
                          val c = px[y * w + x]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          m[y * w + x] = r > 105 && r > g + 50 && r > b + 45
                      }
                  }
                  val out = IntArray(w * h) { -1 }
                  val black = 0xFF000000.toInt()
                  for (y in 0 until h) {
                      for (x in 0 until w) {
                          val i = y * w + x
                          if (m[i] ||
                              (x > 0 && m[i - 1]) ||
                              (y > 0 && m[i - w]) ||
                              (x > 0 && y > 0 && m[i - w - 1])
                          ) {
                              out[i] = black
                          }
                      }
                  }
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  bmp.setPixels(out, 0, w, 0, 0, w, h)
                  return bmp
              }

              // Ekranda aranan canavarın isim yazısını bulur; piksel dikdörtgeni döner
              private fun findLabel(bmp: Bitmap, sel: Set<String>, all: Set<String>, raw: Boolean): Rect? {
                  val W = bmp.width
                  val H = bmp.height
                  val x0 = 0
                  val y0 = (0.10f * H).toInt()
                  val w = (0.70f * W).toInt()
                  val h = (0.68f * H).toInt()
                  val src = if (raw) Bitmap.createBitmap(bmp, x0, y0, w, h) else redMask(bmp, x0, y0, w, h)
                  val lines = ocr(src)
                  val px = 0.52f * W
                  val py = 0.52f * H
                  var best: Rect? = null
                  var bd = Float.MAX_VALUE
                  for (l in lines) {
                      if (!Shared.matchSel(l.text, sel, all)) continue
                      val r = Rect(l.box)
                      r.offset(x0, y0)
                      val dx = r.exactCenterX() - px
                      val dy = r.exactCenterY() - py
                      val d = dx * dx + dy * dy
                      if (d < bd) {
                          bd = d
                          best = r
                      }
                  }
                  return best
              }

              // Üstteki hedef çubuğunda kırmızı can çizgisi var mı?
              private fun targetBarPresent(bmp: Bitmap): Boolean {
                  val W = bmp.width
                  val H = bmp.height
                  val xa = (0.54f * W).toInt()
                  val xb = (0.64f * W).toInt()
                  val ya = (0.040f * H).toInt()
                  val yb = (0.058f * H).toInt()
                  val w = xb - xa
                  val h = yb - ya
                  if (w <= 0 || h <= 0) return false
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, xa, ya, w, h)
                  var cnt = 0
                  for (c in px) {
                      val r = (c shr 16) and 0xFF
                      val g = (c shr 8) and 0xFF
                      val b = c and 0xFF
                      if (r > 150 && g < 100 && b < 100) cnt++
                  }
                  return cnt >= 25
              }

              // Hedef çubuğundaki "Lv.18 (1.Seviye) Beyaz Yeminli Asker" yazısını okur
              private fun ocrTarget(bmp: Bitmap): String {
                  val W = bmp.width
                  val H = bmp.height
                  val x0 = (0.355f * W).toInt()
                  val y0 = (0.02f * H).toInt()
                  val w = (0.19f * W).toInt()
                  val h = (0.065f * H).toInt()
                  val c = Bitmap.createBitmap(bmp, x0, y0, w, h)
                  val s = Bitmap.createScaledBitmap(c, w * 2, h * 2, true)
                  val lines = ocr(s)
                  val sb = StringBuilder()
                  for (l in lines) sb.append(l.text).append(' ')
                  return sb.toString().trim()
              }

              // ------------------------------------------------------------------
              //  HP / MP çubuğu
              // ------------------------------------------------------------------

              private fun barRatio(bmp: Bitmap, yr: Float, blue: Boolean): Float {
                  val W = bmp.width
                  val H = bmp.height
                  val x0 = (0.1025f * W).toInt()
                  val x1 = (0.2275f * W).toInt()
                  val yc = (yr * H).toInt()
                  val dy = maxOf(1, (0.006f * H).toInt())
                  var best = 0f
                  for (y in intArrayOf(yc - dy, yc, yc + dy)) {
                      if (y < 0 || y >= H) continue
                      var x = x1
                      var found = -1
                      while (x >= x0) {
                          val c = bmp.getPixel(x, y)
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          val hit = if (blue) (b > 150 && r < 100 && b > g + 40) else (r > 150 && g < 100 && b < 100)
                          if (hit) {
                              found = x
                              break
                          }
                          x--
                      }
                      if (found >= 0) best = maxOf(best, (found - x0 + 1).toFloat() / (x1 - x0))
                  }
                  return best.coerceAtMost(1f)
              }

              // ------------------------------------------------------------------
              //  Otomatik saldırı algılama (görsel tarama)
              //  Pasif: tek kılıç. Aktif: çapraz iki kılıç.
              //  İkinci kılıcın (sol-üst -> sağ-alt) çapraz hattında parlak "bıçak" var mı bakar.
              // ------------------------------------------------------------------

              private fun autoScore(bmp: Bitmap): Float {
                  val W = bmp.width
                  val H = bmp.height
                  val n = 112
                  val side = (0.28f * H).toInt()
                  if (side < n || side > W || side > H) return 0f
                  val x0 = ((0.8625f * W).toInt() - side / 2).coerceIn(0, W - side)
                  val y0 = ((0.694f * H).toInt() - side / 2).coerceIn(0, H - side)
                  val px = IntArray(side * side)
                  bmp.getPixels(px, 0, side, x0, y0, side, side)

                  // 112x112'ye küçült; her hücre için min(R,G,B) = "beyazlık" (kılıç gri-beyaz, zemin kahverengi)
                  val wmap = FloatArray(n * n)
                  for (oy in 0 until n) {
                      val ya = oy * side / n
                      val yb = maxOf(ya + 1, (oy + 1) * side / n)
                      for (ox in 0 until n) {
                          val xa = ox * side / n
                          val xb = maxOf(xa + 1, (ox + 1) * side / n)
                          var sr = 0
                          var sg = 0
                          var sb = 0
                          var cnt = 0
                          for (yy in ya until yb) {
                              for (xx in xa until xb) {
                                  val c = px[yy * side + xx]
                                  sr += (c shr 16) and 0xFF
                                  sg += (c shr 8) and 0xFF
                                  sb += c and 0xFF
                                  cnt++
                              }
                          }
                          wmap[oy * n + ox] = minOf(sr, sg, sb).toFloat() / cnt
                      }
                  }
                  return diagScore(wmap, n)
              }

              private fun diagScore(w: FloatArray, n: Int): Float {
                  val offs = floatArrayOf(-0.02f, 0f, 0.02f)
                  val halves = floatArrayOf(0.085f, 0.09f, 0.095f)
                  val v = FloatArray(TS.size)
                  val r = 0.70710678f
                  var best = 0f

                  for (oy in offs) {
                      for (ox in offs) {
                          for (half in halves) {
                              val scl = 2f * half / 0.28f

                              fun s(u: Float, vv: Float): Float {
                                  val bx = 0.5f + ox / 0.28f + (u - 0.5f) * scl
                                  val by = 0.5f + oy / 0.28f + (vv - 0.5f) * scl
                                  val xi = Math.round(bx * (n - 1)).coerceIn(0, n - 1)
                                  val yi = Math.round(by * (n - 1)).coerceIn(0, n - 1)
                                  return w[yi * n + xi]
                              }

                              for (i in TS.indices) {
                                  val t = TS[i]
                                  var mx = -1e9f
                                  for (a in TOL1) {
                                      for (b in TOL1) {
                                          mx = maxOf(mx, s(t + a, t + b))
                                      }
                                  }
                                  var b1 = 0f
                                  var b2 = 0f
                                  for (a in TOL2) {
                                      for (b in TOL2) {
                                          b1 += s(t + 0.15f * r + a, t - 0.15f * r + b)
                                          b2 += s(t - 0.15f * r + a, t + 0.15f * r + b)
                                      }
                                  }
                                  b1 /= 9f
                                  b2 /= 9f
                                  v[i] = maxOf(0f, mx - 0.5f * (b1 + b2))
                              }

                              var m1 = 0f
                              var m2 = 0f
                              for (i in 0 until 6) m1 += v[i]
                              for (i in 6 until 12) m2 += v[i]
                              m1 /= 6f
                              m2 /= 6f
                              val sorted = v.sortedArray()
                              val p25 = sorted[2] + 0.75f * (sorted[3] - sorted[2])
                              val sc = minOf(m1, m2, p25 * 1.3f)
                              if (sc > best) best = sc
                          }
                      }
                  }
                  return best
              }

              // ------------------------------------------------------------------
              //  Ekranı tara (canavar isimlerini öğren) ve test
              // ------------------------------------------------------------------

              private fun scanOnce() {
                  if (Build.VERSION.SDK_INT < 30) {
                      setStatus("Tarama için Android 11+ gerekir")
                      return
                  }
                  setStatus("Taranıyor…")
                  Thread {
                      val bmp = grab()
                      if (bmp == null) {
                          setStatus("Ekran alınamadı")
                          return@Thread
                      }
                      try {
                          val W = bmp.width
                          val H = bmp.height
                          val y0 = (0.10f * H).toInt()
                          val w = (0.70f * W).toInt()
                          val h = (0.68f * H).toInt()
                          val lines = ocr(redMask(bmp, 0, y0, w, h))
                          val all = Shared.all(this)
                          var added = 0
                          for (l in lines) {
                              val name = l.text.trim().replace(Regex("\\s+"), " ")
                              if (Shared.letters(name) < 4 || name.length > 40) continue
                              if (all.any { Shared.simFull(it, name) >= 0.85f }) continue
                              all.add(name)
                              added++
                              val r = Rect(l.box)
                              r.offset(0, y0)
                              saveThumb(bmp, name, r)
                          }
                          if (added > 0) Shared.saveAll(this, all)
                          setStatus("Tarama: " + lines.size + " yazı, +" + added + " yeni canavar")
                          ui { rebuildMobList() }
                      } finally {
                          bmp.recycle()
                      }
                  }.start()
              }

              private fun saveThumb(bmp: Bitmap, name: String, r: Rect) {
                  try {
                      val W = bmp.width
                      val H = bmp.height
                      val side = (0.16f * H).toInt()
                      val x = (r.centerX() - side / 2).coerceIn(0, W - side)
                      val y = (r.bottom + (0.005f * H).toInt()).coerceIn(0, H - side)
                      val c = Bitmap.createBitmap(bmp, x, y, side, side)
                      val s = Bitmap.createScaledBitmap(c, 96, 96, true)
                      FileOutputStream(Shared.thumb(this, name)).use {
                          s.compress(Bitmap.CompressFormat.PNG, 100, it)
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun testOnce() {
                  if (Build.VERSION.SDK_INT < 30) {
                      setStatus("Test için Android 11+ gerekir")
                      return
                  }
                  setStatus("Test…")
                  Thread {
                      val bmp = grab()
                      if (bmp == null) {
                          setStatus("Ekran alınamadı")
                          return@Thread
                      }
                      try {
                          val score = autoScore(bmp)
                          val hp = barRatio(bmp, 0.0467f, false)
                          val mp = barRatio(bmp, 0.075f, true)
                          val bar = targetBarPresent(bmp)
                          val t = if (bar) ocrTarget(bmp) else "yok"
                          setStatus(
                              "Oto skor " + score.toInt() + " (eşik " + esik + ") → " +
                                  (if (score >= esik) "AÇIK" else "KAPALI") +
                                  "\nHP " + (hp * 100f).toInt() + "%  MP " + (mp * 100f).toInt() + "%" +
                                  "\nHedef: " + t
                          )
                      } finally {
                          bmp.recycle()
                      }
                  }.start()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
