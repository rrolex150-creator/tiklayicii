              private fun tabBtn(kind: String, label: String, on: Boolean, onClick: () -> Unit): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.HORIZONTAL
                  c.gravity = Gravity.CENTER
                  c.setPadding(0, dpx(7), 0, dpx(7))
                  val iv = ImageView(this)
                  iv.setImageDrawable(sym(kind, if (on) cCyan else cMuted))
                  c.addView(iv, LinearLayout.LayoutParams(dpx(16), dpx(16)))
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 12f
                  t.setTypeface(t.typeface, Typeface.BOLD)
                  t.setTextColor(if (on) cCyan else cMuted)
                  t.setPadding(dpx(5), 0, 0, 0)
                  c.addView(t)
                  c.background = if (on) shape(0xFF2A1A0D.toInt(), cAccent, 8, 1) else null
                  c.setOnClickListener { onClick() }
                  return c
              }

              private fun buildMenu(): View {
                  val sc = screen()
                  val g = Cfg.PGAME[profile]
                  val w0 = dpx(300)
                  val h0 = dpx(440)
                  val fit = minOf(sc[0] * 0.96f / w0, sc[1] * 0.94f / h0)
                  val sca = minOf(mScale(), fit)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.background = shape(cBg, cAccent, 14, 2)
                  root.setPadding(dpx(10), dpx(8), dpx(10), dpx(8))

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(logoRes(g))
                  row.addView(logo, LinearLayout.LayoutParams(dpx(34), dpx(34)))
                  val tcol = LinearLayout(this)
                  tcol.orientation = LinearLayout.VERTICAL
                  tcol.setPadding(dpx(8), 0, 0, 0)
                  val title = TextView(this)
                  title.text = "OTO AV"
                  title.textSize = 15f
                  title.letterSpacing = 0.12f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  title.setTextColor(cCyan)
                  tcol.addView(title)
                  val sub = TextView(this)
                  sub.text = Cfg.GNAME[g] + "  ·  sürüklemek için tut"
                  sub.textSize = 10f
                  sub.setTextColor(cMuted)
                  tcol.addView(sub)
                  row.addView(tcol, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  val hbList = listOf(
                      Pair("minus", { setMenuScale(mScale() - 0.1f) }),
                      Pair("plus", { setMenuScale(mScale() + 0.1f) }),
                      Pair("close", { showMenu(false) })
                  )
                  for (hb in hbList) {
                      val b = symBtn(hb.first, dpx(7)) { hb.second() }
                      val p = LinearLayout.LayoutParams(dpx(30), dpx(30))
                      p.leftMargin = dpx(5)
                      row.addView(b, p)
                  }
                  root.addView(row)

                  // karakter seçimi
                  val crow = LinearLayout(this)
                  crow.orientation = LinearLayout.HORIZONTAL
                  for (k in 0 until Cfg.PNAME.size) {
                      if (Cfg.PGAME[k] != g) continue
                      val on = (k == profile)
                      val t = TextView(this)
                      t.text = Cfg.PNAME[k]
                      t.textSize = 13f
                      t.gravity = Gravity.CENTER
                      t.setTypeface(t.typeface, Typeface.BOLD)
                      t.setTextColor(if (on) 0xFF1D1108.toInt() else cText)
                      t.background = if (on) shape(cAccent, cCyan, 8, 1) else shape(0xFF1D1108.toInt(), 0xFF5A3A12.toInt(), 8, 1)
                      t.setOnClickListener { switchProfile(k) }
                      val p = LinearLayout.LayoutParams(0, dpx(34), 1f)
                      p.leftMargin = dpx(2)
                      p.rightMargin = dpx(2)
                      crow.addView(t, p)
                  }
                  val clp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  clp.topMargin = dpx(8)
                  root.addView(crow, clp)

                  // sekmeler
                  val trow = LinearLayout(this)
                  trow.orientation = LinearLayout.HORIZONTAL
                  val tn = listOf("Av", "Beceri", "Ayar")
                  val ti = listOf("tgt", "star", "gear")
                  for (n in 0 until 3) {
                      val tb = tabBtn(ti[n], tn[n], mTab == n) {
                          mTab = n
                          lastScroll = 0
                          refreshMenu()
                      }
                      val p = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      p.leftMargin = dpx(2)
                      p.rightMargin = dpx(2)
                      trow.addView(tb, p)
                  }
                  val tlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  tlp.topMargin = dpx(6)
                  root.addView(trow, tlp)

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  if (mTab == 0) {
                      addNisanCard(col)
                      addAtkCard(col)
                      addPickCard(col)
                      addPotCard(col)
                      addReviveCard(col)
                  } else if (mTab == 1) {
                      val hint = TextView(this)
                      hint.text = "Becerine dokun, aşağıda ayarla. Yeşil nokta: yuva bulundu."
                      hint.textSize = 11f
                      hint.setTextColor(cMuted)
                      hint.setPadding(0, dpx(6), 0, dpx(2))
                      col.addView(hint)
                      addSkillGrid(col)
                      addSkillCard(col, selSk.coerceIn(0, nSk - 1))
                  } else {
                      addSpeedCard(col)
                      col.addView(sectionHead("PENCERE"))
                      addWindowCard(col)
                  }

                  val sv = ScrollView(this)
                  menuSv = sv
                  sv.addView(col)
                  val svp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  svp.topMargin = dpx(4)
                  root.addView(sv, svp)
                  sv.post { sv.scrollTo(0, lastScroll) }

                  val wrap = FrameLayout(this)
                  wrap.addView(root, FrameLayout.LayoutParams(w0, h0))
                  root.pivotX = 0f
                  root.pivotY = 0f
                  root.scaleX = sca
                  root.scaleY = sca
                  val ww = (w0 * sca).toInt()
                  val hh = (h0 * sca).toInt()
                  val lp = menuLp ?: WindowManager.LayoutParams(
                      ww,
                      hh,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).also {
                      it.gravity = Gravity.TOP or Gravity.START
                      it.x = (sc[0] - ww) / 2
                      it.y = dpx(16)
                      menuLp = it
                  }
                  lp.width = ww
                  lp.height = hh
                  lp.x = lp.x.coerceIn(0, (sc[0] - ww).coerceAtLeast(0))
                  lp.y = lp.y.coerceIn(0, (sc[1] - hh).coerceAtLeast(0))
                  drag(tcol, wrap, lp)
                  drag(logo, wrap, lp)
                  return wrap
              }

              private fun showMenu(on: Boolean) {
                  val w = wm ?: return
                  if (on && !menuShown) {
                      loadCfg()
                      removeSafe(menu)
                      val fresh = buildMenu()
                      val lp = menuLp ?: return
                      menu = fresh
                      w.addView(fresh, lp)
                      menuShown = true
                  } else if (!on && menuShown) {
                      removeSafe(menu)
                      menuShown = false
                  }
              }

              // ---------------- servis ----------------

              override fun onServiceConnected() {
                  prefs = getSharedPreferences("ayar", MODE_PRIVATE)
                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  removeSafe(panel)
                  removeSafe(menu)
                  menuShown = false
                  loadCfg()
                  pScale = prefs.getFloat("pscale", 1f).coerceIn(0.6f, 1.6f)
                  val d = resources.displayMetrics.density * pScale
                  fun dp(v: Int) = (v * d).toInt()

                  // yüzen pencere: küçük, mavi-siyah, logodan sürüklenir, logoya dokununca küçülür
                  val scr = screen()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = shape(cBg, cAccent, 14, 2)
                  box.setPadding(dp(6), dp(5), dp(6), dp(5))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  val logo = ImageView(this)
                  logo.setImageResource(logoRes(if (curGame >= 0) curGame else 0))
                  panelLogo = logo
                  top.addView(logo, LinearLayout.LayoutParams(dp(34), dp(34)))

                  val ctl = LinearLayout(this)
                  ctl.orientation = LinearLayout.HORIZONTAL
                  val sBtn = symBtn("play", dp(8)) { toggle() }
                  startBtn = sBtn
                  setRunIcon(running)
                  val mBtn = symBtn("menu", dp(8)) { showMenu(!menuShown) }
                  for (bv in listOf(sBtn, mBtn)) {
                      val p = LinearLayout.LayoutParams(dp(40), dp(34))
                      p.leftMargin = dp(5)
                      ctl.addView(bv, p)
                  }
                  top.addView(ctl)
                  box.addView(top)

                  val info = LinearLayout(this)
                  info.orientation = LinearLayout.VERTICAL
                  info.setPadding(dp(2), dp(3), 0, 0)
                  val tt = TextView(this)
                  tt.textSize = 11f * pScale
                  tt.setTextColor(cCyan)
                  timeText = tt
                  tt.text = pname()
                  val st = TextView(this)
                  st.textSize = 10f * pScale
                  st.setTextColor(cMuted)
                  st.maxLines = 3
                  st.maxWidth = dp(230)
                  statusText = st
                  st.text = "parlak = aktif · soluk = bekliyor"
                  val ir = LinearLayout(this)
                  ir.orientation = LinearLayout.HORIZONTAL
                  ir.setPadding(0, dp(4), 0, dp(2))
                  iconRow = ir
                  info.addView(tt)
                  info.addView(ir)
                  info.addView(st)
                  box.addView(info)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  // Pencerenin son konumu ve küçültme durumu hatırlanır
                  lp.x = prefs.getInt("px", (scr[0] - dp(190)) / 2).coerceIn(0, (scr[0] - dp(60)).coerceAtLeast(0))
                  lp.y = prefs.getInt("py", dp(4)).coerceIn(0, (scr[1] - dp(60)).coerceAtLeast(0))
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  var collapsed = prefs.getBoolean("col", false)
                  logo.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          sx = e.rawX
                          sy = e.rawY
                          ox = lp.x
                          oy = lp.y
                          moved = false
                      } else if (e.action == MotionEvent.ACTION_MOVE) {
                          val dx = e.rawX - sx
                          val dy = e.rawY - sy
                          if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                          if (moved) {
                              lp.x = ox + dx.toInt()
                              lp.y = oy + dy.toInt()
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      } else if (e.action == MotionEvent.ACTION_UP) {
                          if (moved) {
                              prefs.edit().putInt("px", lp.x).putInt("py", lp.y).commit()
                          }
                          if (!moved) {
                              collapsed = !collapsed
                              prefs.edit().putBoolean("col", collapsed).commit()
                              ctl.visibility = if (collapsed) View.GONE else View.VISIBLE
                              info.visibility = if (collapsed) View.GONE else View.VISIBLE
                              try {
                                  w.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                              }
                          }
                      }
                      true
                  }
                  if (collapsed) {
                      ctl.visibility = View.GONE
                      info.visibility = View.GONE
                  }
                  box.alpha = pAlpha()
                  box.visibility = View.GONE
                  panelLp = lp
                  w.addView(box, lp)
                  panel = box
                  rebuildPanelIcons()

                  handler.removeCallbacks(scanLoop)
                  handler.removeCallbacks(gameLoop)
                  handler.post(scanLoop)
                  handler.post(gameLoop)
                  inst = this
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e != null && e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      val p = e.packageName?.toString()
                      if (p != null && p != packageName && p != "com.android.systemui") evPkg = p
                  }
              }

              override fun onInterrupt() {
                  stopAll()
              }

              override fun onDestroy() {
                  stopAll()
                  handler.removeCallbacks(scanLoop)
                  handler.removeCallbacks(gameLoop)
                  inst = null
                  removeSafe(panel)
                  removeSafe(menu)
                  worker.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: APK derle
        working-directory: proj
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Hata ozeti
        if: failure()
        run: |
          {
            echo '### HATA OZETI'
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Execution failed|Could not|Caused by|AAPT|Unresolved" -A4 build.log | head -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: tiklayici-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
