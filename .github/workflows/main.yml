              private fun pAlpha(): Float = prefs.getFloat("palpha", 1f).coerceIn(0.3f, 1f)

              // Yüzen pencereyi yeni boyutla baştan kur; menü açıksa tekrar aç
              private fun rebuildPanel() {
                  val wasMenu = menuShown
                  onServiceConnected()
                  panel?.visibility = if (inGame) View.VISIBLE else View.GONE
                  setRunIcon(running)
                  updateStatus()
                  if (wasMenu) showMenu(true)
