                  header.addView(sBtn, LinearLayout.LayoutParams(dp(56), dp(46)))
                  val mlp = LinearLayout.LayoutParams(dp(56), dp(46))
                  mlp.leftMargin = dp(4)
                  header.addView(menuBtn, mlp)

