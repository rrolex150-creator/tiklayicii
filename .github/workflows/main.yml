              private fun secP(sc: Int): Int = if (sc <= 40) (sc / 2 - 1).coerceAtLeast(0) else (19 + (sc - 40) / 10).coerceAtMost(39)

              private fun pSec(p: Int): Int = if (p <= 19) (p + 1) * 2 else 40 + (p - 19) * 10

