name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK lisanslarini kabul et
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje zip dosyasini ac
        run: |
          Z=$(find . -name proje.zip -not -path "./proj/*" | head -1)
          test -n "$Z" || { echo "proje.zip bulunamadi: repoya proje.zip yukle" | tee build.log; ls -R . | head -40 | tee -a build.log; exit 1; }
          echo "zip: $Z"
          rm -rf proj
          unzip -q -o "$Z" -d .
          test -d proj || { echo "zip icinde proj klasoru yok" | tee build.log; exit 1; }

      - name: APK derle
        working-directory: proj
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Hata ozeti
        if: failure()
        run: |
          {
            echo '### HATA OZETI'
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Execution failed|Could not|Caused by|AAPT|Unresolved|bulunamadi" -A4 build.log | head -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: OtoAv-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
